<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNG-Kongruenz 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Lora:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-gutter: stable; }
  :root {
    --bg: #f8f8f6; --white: #ffffff; --border: #E6E4DF;
    --text: #111111; --muted: #898783; --accent: #c6613f;
    --green: #4caf50; --radius: 14px;
  }
  body { font-family: 'Noto Sans', sans-serif; background: var(--bg); min-height: 100vh; padding: 5rem 1.5rem 3rem; color: var(--text); }
  header { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; z-index: 100; }
  .sitename { font-size: 19px; font-weight: 700; color: #111111; font-family: 'Lora', serif; letter-spacing: -0.4px; display: flex; align-items: center; gap: 6px; }
  .sitename a { color: inherit; text-decoration: none; }
  .sitename .sep  { color: #CCCCCC; font-family: 'Noto Sans', sans-serif; font-weight: 400; font-size: 17px; }
  .sitename .sep2 { color: #CCCCCC; font-family: 'Noto Sans', sans-serif; font-weight: 400; font-size: 17px; }
  .sitename .sub  { font-size: 12px; font-weight: 600; color: #555555; font-family: 'Noto Sans', sans-serif; letter-spacing: 0; }
  .sitename .sub2 { font-size: 12px; font-weight: 600; color: #555555; font-family: 'Noto Sans', sans-serif; letter-spacing: 0; }
  .topbar { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 12px; border: 1px solid transparent; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; position: relative; outline: none; flex-shrink: 0; }
  .icon-btn:hover  { transform: scale(1.08); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 16px; height: 16px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bell-btn svg { stroke: #898783; }
  .bell-btn .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: #CC3300; border-radius: 50%; border: 1.5px solid var(--white); }
  @keyframes ring { 0%,100%{transform:rotate(0)} 15%{transform:rotate(14deg)} 30%{transform:rotate(-12deg)} 45%{transform:rotate(8deg)} 60%{transform:rotate(-5deg)} 75%{transform:rotate(3deg)} }
  .bell-btn:hover svg { animation: ring 0.55s ease; transform-origin: 50% 3px; }
  .user-btn svg { stroke: #898783; }
  .user-wrap { position: relative; }
  .dropdown { display: none; position: absolute; top: 44px; right: 0; background: var(--white); border: 1px solid #E0E0E0; border-radius: 10px; min-width: 190px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,0.10); }
  .dropdown.open { display: block; animation: dropIn 0.15s ease; }
  @keyframes dropIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
  .dropdown-header { padding: 13px 16px 9px; border-bottom: 1px solid #E8E8E8; background: #F9F9F9; }
  .dropdown-name  { font-size: 14px; font-weight: 600; color: #111; }
  .dropdown-email { font-size: 12px; color: #888; margin-top: 2px; }
  .dropdown-item  { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 14px; color: #111; cursor: pointer; border: none; background: none; width: 100%; font-family: 'Noto Sans', sans-serif; transition: background 0.12s; text-align: left; }
  .dropdown-item:hover { background: #F4F4F4; }
  .dropdown-item svg { width: 15px; height: 15px; stroke: #555; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .dropdown-sep-line { height: 1px; background: #E8E8E8; }
  .dropdown-item.danger { color: #CC3300; }
  .dropdown-item.danger svg { stroke: #CC3300; }
  .page-wrap { max-width: 780px; margin: 0 auto; }
  .task-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .task-header { padding: 20px 22px 16px; border-bottom: 1px solid var(--border); }
  .task-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; font-family: 'Lora', serif; }
  .task-instruction { font-size: 14px; color: var(--muted); line-height: 1.6; }
  .task-content { padding: 22px 22px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .video-wrap { width: 100%; border-radius: 12px; overflow: hidden; position: relative; background: #1a1a1a; aspect-ratio: 16 / 9; }
  .video-wrap video { width: 100%; height: 100%; display: block; object-fit: contain; }
  .video-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(0,0,0,0.38); transition: opacity 0.25s; cursor: pointer; z-index: 2; }
  .video-overlay.hidden { opacity: 0; pointer-events: none; }
  .video-play-btn { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.15s; backdrop-filter: blur(4px); cursor: pointer; }
  .video-overlay:hover .video-play-btn { background: rgba(255,255,255,0.25); transform: scale(1.06); }
  .video-play-btn svg { width: 28px; height: 28px; stroke: #fff; fill: #fff; stroke-width: 1; margin-left: 4px; }
  .video-overlay-title { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.9); letter-spacing: 0.2px; }
  .video-controls { position: absolute; bottom: 0; left: 0; right: 0; z-index: 3; padding: 0 12px 10px; background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, transparent 100%); opacity: 0; transition: opacity 0.2s; display: flex; flex-direction: column; gap: 6px; }
  .video-wrap:hover .video-controls, .video-wrap.paused .video-controls { opacity: 1; }
  .vc-progress { width: 100%; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; cursor: pointer; position: relative; transition: height 0.15s; flex-shrink: 0; margin-top: 8px; }
  .vc-progress:hover { height: 6px; }
  .vc-progress-fill { height: 100%; background: #fff; border-radius: 2px; width: 0%; pointer-events: none; transition: width 0.1s linear; }
  .vc-progress-thumb { position: absolute; top: 50%; width: 12px; height: 12px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; transition: opacity 0.15s; left: 0%; }
  .vc-progress:hover .vc-progress-thumb { opacity: 1; }
  .vc-row { display: flex; align-items: center; gap: 10px; }
  .vc-btn { background: none; border: none; cursor: pointer; padding: 2px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.12s; }
  .vc-btn:hover { transform: scale(1.12); }
  .vc-btn:active { transform: scale(0.92); }
  .vc-btn svg { width: 18px; height: 18px; stroke: rgba(255,255,255,0.9); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .vc-btn.play-pause svg { width: 20px; height: 20px; fill: rgba(255,255,255,0.9); stroke: none; }
  .vc-time { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.75); white-space: nowrap; flex-shrink: 0; min-width: 74px; }
  .vc-spacer { flex: 1; }
  .vc-volume-wrap { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .vc-slider { -webkit-appearance: none; appearance: none; width: 60px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; outline: none; cursor: pointer; }
  .vc-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #fff; cursor: pointer; }
  .vc-slider::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: #fff; border: none; cursor: pointer; }
  .vc-speed { position: relative; flex-shrink: 0; }
  .vc-speed-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 5px; color: rgba(255,255,255,0.9); font-size: 11px; font-weight: 600; font-family: 'Noto Sans', sans-serif; padding: 3px 7px; cursor: pointer; white-space: nowrap; transition: background 0.15s; }
  .vc-speed-btn:hover { background: rgba(255,255,255,0.25); }
  .vc-speed-menu { display: none; position: absolute; bottom: calc(100% + 6px); right: 0; background: #1c1c1c; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; overflow: hidden; min-width: 80px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
  .vc-speed-menu.open { display: block; }
  .vc-speed-option { display: block; width: 100%; background: none; border: none; color: rgba(255,255,255,0.75); font-size: 12px; font-weight: 500; font-family: 'Noto Sans', sans-serif; padding: 7px 12px; cursor: pointer; text-align: left; transition: background 0.1s; }
  .vc-speed-option:hover { background: rgba(255,255,255,0.08); }
  .vc-speed-option.active { color: #fff; font-weight: 700; }
  .task-footer { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
  .attempts-wrap { display: flex; gap: 5px; align-items: center; }
  .attempt-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #D0CEC9; background: transparent; transition: background 0.2s, border-color 0.2s; }
  .attempt-dot.used { background: var(--muted); border-color: var(--muted); }
  .check-btn { background: #111111; color: #ffffff; border: none; border-radius: 10px; padding: 9px 20px; font-size: 14px; font-weight: 600; font-family: 'Noto Sans', sans-serif; cursor: pointer; transition: background 0.15s, transform 0.15s; opacity: 0.4; pointer-events: none; }
  .check-btn.enabled { opacity: 1; pointer-events: auto; }
  .check-btn.enabled:hover  { background: #333; transform: translateY(-1px); }
  .check-btn.enabled:active { transform: scale(0.97); }
  .check-btn.success { background: var(--green); opacity: 1; pointer-events: none; }
  .feedback { display: none; margin: 0 22px 16px; padding: 12px 14px; border-radius: 10px; font-size: 14px; font-weight: 500; align-items: center; gap: 8px; }
  .feedback.show { display: flex; }
  .feedback.ok { background: #EDF7ED; color: #2E7D32; border: 1px solid #C8E6C9; }
  .feedback svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  @media (max-width: 500px) { body { padding: 4.5rem 1rem 2rem; } .task-content { padding: 12px; } .task-footer { padding: 12px 16px; } }
</style>
</head>
<body>
<header>
  <div class="sitename">
    <a href="lektionsuebersicht.html">Latein*</a>
    <span class="sep">›</span>
    <a href="lektion05.html" class="sub">Lektion 5</a>
    <span class="sep2">›</span>
    <span class="sub2">KNG-Kongruenz 3</span>
  </div>
  <div class="topbar">
    <button class="icon-btn bell-btn" title="Benachrichtigungen" onclick="handleBell()">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="dot" id="bellDot"></span>
    </button>
    <div class="user-wrap">
      <button class="icon-btn user-btn" title="Benutzerprofil" onclick="toggleDropdown()">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <div class="dropdown" id="dropdown">
        <div class="dropdown-header">
          <div class="dropdown-name">Max Mustermann</div>
          <div class="dropdown-email">max@beispiel.de</div>
        </div>
        <button class="dropdown-item" onclick="closeDropdown()">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil
        </button>
        <button class="dropdown-item" onclick="closeDropdown()">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Einstellungen
        </button>
        <div class="dropdown-sep-line"></div>
        <button class="dropdown-item danger" onclick="closeDropdown()">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Abmelden
        </button>
      </div>
    </div>
  </div>
</header>

<div class="page-wrap">
  <div class="task-card">
    <div class="task-header">
      <div class="task-title">KNG-Kongruenz 3</div>
      <div class="task-instruction">Schau dir das Video vollständig an. Du erhältst danach automatisch deinen Punkt.</div>
    </div>
    <div class="task-content">
      <div class="video-wrap paused" id="videoWrap">
        <video id="videoEl" src="video/kng-3.mp4" preload="metadata"></video>
        <div class="video-overlay" id="videoOverlay" onclick="togglePlay()">
          <div class="video-play-btn">
            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </div>
          <div class="video-overlay-title">KNG-Kongruenz 3</div>
        </div>
        <div class="video-controls" id="videoControls">
          <div class="vc-progress" id="vcProgress">
            <div class="vc-progress-fill" id="vcFill"></div>
            <div class="vc-progress-thumb" id="vcThumb"></div>
          </div>
          <div class="vc-row">
            <button class="vc-btn play-pause" id="vcPlayBtn" onclick="togglePlay()" title="Play / Pause">
              <svg id="vcPlayIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </button>
            <span class="vc-time"><span id="vcElapsed">0:00</span> / <span id="vcDuration">-:--</span></span>
            <div class="vc-spacer"></div>
            <div class="vc-volume-wrap">
              <button class="vc-btn" id="vcMuteBtn" onclick="toggleMute()" title="Stummschalten">
                <svg id="vcVolIcon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path id="vcVolWave" d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              </button>
              <input class="vc-slider" id="vcVolSlider" type="range" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)" title="Lautstärke">
            </div>
            <div class="vc-speed" id="vcSpeed">
              <button class="vc-speed-btn" id="vcSpeedBtn" onclick="toggleSpeedMenu()">1×</button>
              <div class="vc-speed-menu" id="vcSpeedMenu">
                <button class="vc-speed-option" onclick="setSpeed(0.5)">0.5×</button>
                <button class="vc-speed-option" onclick="setSpeed(0.75)">0.75×</button>
                <button class="vc-speed-option active" onclick="setSpeed(1)">1×</button>
                <button class="vc-speed-option" onclick="setSpeed(1.25)">1.25×</button>
                <button class="vc-speed-option" onclick="setSpeed(1.5)">1.5×</button>
                <button class="vc-speed-option" onclick="setSpeed(2)">2×</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="feedback" id="feedback">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      Sehr gut! Du hast das Video angesehen und erhältst 1 Punkt.
    </div>

    <div class="task-footer">
      <div class="attempts-wrap">
        <div class="attempt-dot" id="dot1"></div>
        <div class="attempt-dot" id="dot2"></div>
        <div class="attempt-dot" id="dot3"></div>
      </div>
      <button class="check-btn" id="checkBtn" onclick="submit()">Weiter</button>
    </div>
  </div>
</div>

<script>
  const video       = document.getElementById('videoEl');
  const overlay     = document.getElementById('videoOverlay');
  const videoWrap   = document.getElementById('videoWrap');
  const checkBtn    = document.getElementById('checkBtn');
  const feedback    = document.getElementById('feedback');
  const vcFill      = document.getElementById('vcFill');
  const vcThumb     = document.getElementById('vcThumb');
  const vcElapsed   = document.getElementById('vcElapsed');
  const vcDuration  = document.getElementById('vcDuration');
  const vcPlayIcon  = document.getElementById('vcPlayIcon');
  const vcVolSlider = document.getElementById('vcVolSlider');
  const vcVolWave   = document.getElementById('vcVolWave');
  const vcSpeedBtn  = document.getElementById('vcSpeedBtn');
  const vcSpeedMenu = document.getElementById('vcSpeedMenu');
  const vcProgress  = document.getElementById('vcProgress');

  const KEY  = 'task_l05_kng_kongruenz_3';
  const NEXT = 'kng-3.html';

  let hasWatched = false;
  let attempts   = 0;
  let isPlaying  = false;
  let isSeeking  = false;

  const PLAY_ICON  = '<polygon points="5 3 19 12 5 21 5 3"/>';
  const PAUSE_ICON = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';

  function fmt(s) {
    if (!isFinite(s)) return '-:--';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function togglePlay() {
    if (isPlaying) { video.pause(); }
    else { video.play().catch(() => { hasWatched = true; checkBtn.classList.add('enabled'); }); }
  }

  video.addEventListener('play', () => { isPlaying = true; overlay.classList.add('hidden'); videoWrap.classList.remove('paused'); vcPlayIcon.innerHTML = PAUSE_ICON; });
  video.addEventListener('pause', () => { isPlaying = false; videoWrap.classList.add('paused'); vcPlayIcon.innerHTML = PLAY_ICON; if (!video.ended) overlay.classList.remove('hidden'); });
  video.addEventListener('ended', () => { isPlaying = false; hasWatched = true; videoWrap.classList.add('paused'); vcPlayIcon.innerHTML = PLAY_ICON; overlay.classList.remove('hidden'); checkBtn.classList.add('enabled'); });
  video.addEventListener('loadedmetadata', () => { vcDuration.textContent = fmt(video.duration); });
  video.addEventListener('timeupdate', () => {
    if (!video.duration || isSeeking) return;
    const pct = (video.currentTime / video.duration) * 100;
    vcFill.style.width = pct + '%';
    vcThumb.style.left = pct + '%';
    vcElapsed.textContent = fmt(video.currentTime);
    if (pct >= 90 && !hasWatched) { hasWatched = true; checkBtn.classList.add('enabled'); }
  });

  function seekTo(e) {
    const rect = vcProgress.getBoundingClientRect();
    const x = Math.max(0, Math.min((e.clientX ?? e.touches?.[0]?.clientX ?? 0) - rect.left, rect.width));
    video.currentTime = (x / rect.width) * video.duration;
  }
  vcProgress.addEventListener('click', seekTo);
  vcProgress.addEventListener('mousedown', e => { isSeeking = true; seekTo(e); });
  document.addEventListener('mousemove', e => { if (isSeeking) seekTo(e); });
  document.addEventListener('mouseup', () => { isSeeking = false; });
  vcProgress.addEventListener('touchstart', e => { isSeeking = true; seekTo(e); }, { passive: true });
  document.addEventListener('touchmove', e => { if (isSeeking) seekTo(e); }, { passive: true });
  document.addEventListener('touchend', () => { isSeeking = false; });

  function setVolume(val) { video.volume = val; video.muted = val == 0; updateVolIcon(); }
  function toggleMute() { video.muted = !video.muted; vcVolSlider.value = video.muted ? 0 : video.volume; updateVolIcon(); }
  function updateVolIcon() {
    const muted = video.muted || video.volume === 0;
    vcVolWave.setAttribute('d', muted ? 'M23 9 L17 15 M17 9 L23 15' : 'M15.54 8.46a5 5 0 0 1 0 7.07');
  }

  function toggleSpeedMenu() { vcSpeedMenu.classList.toggle('open'); }
  function setSpeed(rate) {
    video.playbackRate = rate;
    vcSpeedBtn.textContent = rate + '×';
    vcSpeedMenu.querySelectorAll('.vc-speed-option').forEach(btn => { btn.classList.toggle('active', parseFloat(btn.textContent) === rate); });
    vcSpeedMenu.classList.remove('open');
  }
  document.addEventListener('click', e => { if (!document.getElementById('vcSpeed').contains(e.target)) vcSpeedMenu.classList.remove('open'); });

  function submit() {
    if (!hasWatched) return;
    attempts++;
    document.getElementById('dot' + attempts).classList.add('used');
    feedback.classList.add('show', 'ok');
    checkBtn.classList.add('success');
    localStorage.setItem(KEY, 'done');
    localStorage.setItem(KEY + '_date', new Date().toLocaleDateString('de-DE'));
    localStorage.setItem(KEY + '_attempts', attempts);
    localStorage.setItem(KEY + '_points', 1);
    checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
    checkBtn.style.pointerEvents = 'auto';
    checkBtn.onclick = () => window.location.href = NEXT;
    video.pause();
  }

  if (localStorage.getItem(KEY) === 'done') {
    hasWatched = true;
    checkBtn.classList.add('enabled');
    checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
    checkBtn.style.background = '#4CAF50';
    checkBtn.style.pointerEvents = 'auto';
    checkBtn.onclick = () => window.location.href = NEXT;
    feedback.classList.add('show', 'ok');
    const savedAttempts = parseInt(localStorage.getItem(KEY + '_attempts') || '1');
    for (let i = 1; i <= savedAttempts; i++) { const d = document.getElementById('dot' + i); if (d) d.classList.add('used'); }
  }

  function handleBell() { alert('Keine neuen Benachrichtigungen.'); }
  function toggleDropdown() { document.getElementById('dropdown').classList.toggle('open'); }
  function closeDropdown()  { document.getElementById('dropdown').classList.remove('open'); }
  document.addEventListener('click', e => { if (!document.querySelector('.user-wrap').contains(e.target)) closeDropdown(); });
</script>
</body>
</html>
