<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Die Cornelier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Lora:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scrollbar-gutter: stable;
      }

      :root {
        --bg: #f8f8f6;
        --white: #ffffff;
        --border: #e6e4df;
        --text: #111111;
        --muted: #898783;
        --accent: #c6613f;
        --green: #4caf50;
        --yellow: #f5a623;
        --radius: 14px;
      }

      body {
        font-family: "Noto Sans", sans-serif;
        background: var(--bg);
        min-height: 100vh;
        padding: 5rem 1.5rem 3rem;
        color: var(--text);
      }

      /* ── Header ── */
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        background: var(--white);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
        z-index: 100;
      }

      .sitename {
        font-size: 19px;
        font-weight: 700;
        color: #111111;
        font-family: "Lora", serif;
        letter-spacing: -0.4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sitename a {
        color: inherit;
        text-decoration: none;
      }
      .sitename .sep {
        color: #cccccc;
        font-family: "Noto Sans", sans-serif;
        font-weight: 400;
        font-size: 17px;
      }
      .sitename .sep2 {
        color: #cccccc;
        font-family: "Noto Sans", sans-serif;
        font-weight: 400;
        font-size: 17px;
      }
      .sitename .sub {
        font-size: 12px;
        font-weight: 600;
        color: #555555;
        font-family: "Noto Sans", sans-serif;
        letter-spacing: 0;
      }
      .sitename .sub2 {
        font-size: 12px;
        font-weight: 600;
        color: #555555;
        font-family: "Noto Sans", sans-serif;
        letter-spacing: 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s;
        position: relative;
        outline: none;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        transform: scale(1.08);
      }
      .icon-btn:active {
        transform: scale(0.94);
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .bell-btn svg {
        stroke: #898783;
      }
      .bell-btn.has-notification {
        background: #c6613f;
      }
      .bell-btn.has-notification svg {
        stroke: #ffffff;
      }
      .bell-btn .dot {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 7px;
        height: 7px;
        background: #cc3300;
        border-radius: 50%;
        border: 1.5px solid var(--white);
      }
      @keyframes ring {
        0%,
        100% {
          transform: rotate(0);
        }
        15% {
          transform: rotate(14deg);
        }
        30% {
          transform: rotate(-12deg);
        }
        45% {
          transform: rotate(8deg);
        }
        60% {
          transform: rotate(-5deg);
        }
        75% {
          transform: rotate(3deg);
        }
      }
      .bell-btn:hover svg {
        animation: ring 0.55s ease;
        transform-origin: 50% 3px;
      }
      .user-btn svg {
        stroke: #898783;
      }
      .user-wrap {
        position: relative;
      }

      .dropdown {
        display: none;
        position: absolute;
        top: 44px;
        right: 0;
        background: var(--white);
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        min-width: 190px;
        overflow: hidden;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.1);
      }
      .dropdown.open {
        display: block;
        animation: dropIn 0.15s ease;
      }
      @keyframes dropIn {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .dropdown-header {
        padding: 13px 16px 9px;
        border-bottom: 1px solid #e8e8e8;
        background: #f9f9f9;
      }
      .dropdown-name {
        font-size: 14px;
        font-weight: 600;
        color: #111;
      }
      .dropdown-email {
        font-size: 12px;
        color: #888;
        margin-top: 2px;
      }
      .dropdown-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        font-size: 14px;
        color: #111;
        cursor: pointer;
        border: none;
        background: none;
        width: 100%;
        font-family: "Noto Sans", sans-serif;
        transition: background 0.12s;
        text-align: left;
      }
      .dropdown-item:hover {
        background: #f4f4f4;
      }
      .dropdown-item svg {
        width: 15px;
        height: 15px;
        stroke: #555;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .dropdown-sep-line {
        height: 1px;
        background: #e8e8e8;
      }
      .dropdown-item.danger {
        color: #cc3300;
      }
      .dropdown-item.danger svg {
        stroke: #cc3300;
      }

      /* ── Page layout ── */
      .page-wrap {
        max-width: 780px;
        margin: 0 auto;
      }

      /* ── Task card ── */
      .task-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .task-header {
        padding: 20px 22px 16px;
        border-bottom: 1px solid var(--border);
      }
      .task-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 6px;
        font-family: "Lora", serif;
      }
      .task-instruction {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.6;
      }

      /* ── Task content ── */
      .task-content {
        padding: 22px 22px;
      }

      /* ── Image with overlays ── */
      .image-wrap {
        position: relative;
        width: 100%;
        border-radius: 10px;
        overflow: hidden;
        background: #e8e6e0;
      }
      .image-wrap img {
        width: 100%;
        display: block;
      }

      /* Each label overlay */
      .label-overlay {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }

      .label-latin {
        font-size: clamp(8px, 1.2vw, 11px);
        font-weight: 700;
        color: #111;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 4px 4px 0 0;
        padding: 2px 5px;
        line-height: 1.3;
        white-space: nowrap;
      }

      .label-input-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
        pointer-events: auto;
      }

      .label-input {
        font-size: clamp(9px, 1.2vw, 11px);
        font-family: "Noto Sans", sans-serif;
        font-weight: 500;
        background: rgba(255, 255, 255, 0.92);
        border: 1.5px solid #d0cec9;
        border-radius: 4px;
        padding: 2px 5px;
        color: var(--text);
        outline: none;
        width: clamp(70px, 11vw, 110px);
        transition: border-color 0.15s;
      }
      .label-input:focus {
        border-color: var(--accent);
      }
      .label-input.correct {
        border-color: var(--green) !important;
        border-width: 2px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--text);
      }
      .label-input.wrong {
        border-color: var(--yellow) !important;
        border-width: 2px;
        background: rgba(255, 255, 255, 0.92);
      }
      .label-input:disabled {
        cursor: default;
      }

      /* Badge — circle top-right, exactly like willkommen */
      .label-badge {
        display: none;
        position: absolute;
        top: -8px;
        right: -8px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        align-items: center;
        justify-content: center;
        z-index: 10;
        flex-shrink: 0;
      }
      .label-badge.show {
        display: flex;
      }
      .label-badge.ok {
        background: var(--green);
      }
      .label-badge.fail {
        background: var(--yellow);
      }
      .label-badge svg {
        width: 10px;
        height: 10px;
        stroke: #fff;
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Popover — black tooltip above, exactly like willkommen */
      .label-popover {
        display: none;
        position: absolute;
        top: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%);
        background: #111;
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        padding: 6px 10px;
        border-radius: 8px;
        white-space: nowrap;
        z-index: 50;
        pointer-events: none;
        animation: fadeDown 0.15s ease;
      }
      .label-popover::after {
        content: "";
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 5px solid transparent;
        border-bottom-color: #111;
      }
      .label-popover.show {
        display: block;
      }
      @keyframes fadeDown {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      /* ── Task footer ── */
      .task-footer {
        padding: 16px 22px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 16px;
      }

      .attempts-wrap {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .attempt-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 1.5px solid #d0cec9;
        background: transparent;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .attempt-dot.used {
        background: var(--muted);
        border-color: var(--muted);
      }

      .check-btn {
        background: #111111;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        padding: 9px 20px;
        font-size: 14px;
        font-weight: 600;
        font-family: "Noto Sans", sans-serif;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.15s;
      }
      .check-btn:hover {
        background: #333;
        transform: translateY(-1px);
      }
      .check-btn:active {
        transform: scale(0.97);
      }
      .check-btn.success {
        background: var(--green);
        pointer-events: none;
      }
      .check-btn.partial {
        background: var(--yellow);
      }

      /* ── Feedback ── */
      .feedback {
        display: none;
        margin: 0 22px 16px;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        align-items: center;
        gap: 8px;
      }
      .feedback.show {
        display: flex;
      }
      .feedback.ok {
        background: #edf7ed;
        color: #2e7d32;
        border: 1px solid #c8e6c9;
      }
      .feedback.warn {
        background: #fff8ee;
        color: #92610a;
        border: 1px solid #f5dfa0;
      }
      .feedback svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      @media (max-width: 500px) {
        body {
          padding: 4.5rem 1rem 2rem;
        }
        .task-content {
          padding: 12px;
        }
        .task-footer {
          padding: 12px 16px;
        }
        .feedback {
          margin: 0 12px 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="sitename">
        <a href="lektionsuebersicht.html">Latein*</a>
        <span class="sep">›</span>
        <a href="lektionsalve.html" class="sub">Lektion Salve</a>
        <span class="sep2">›</span>
        <span class="sub2">Die Cornelier</span>
      </div>
      <div class="topbar">
        <button
          class="icon-btn bell-btn"
          title="Benachrichtigungen"
          onclick="handleBell()"
        >
          <svg viewBox="0 0 24 24">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span class="dot" id="bellDot"></span>
        </button>
        <div class="user-wrap">
          <button
            class="icon-btn user-btn"
            title="Benutzerprofil"
            onclick="toggleDropdown()"
          >
            <svg viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </button>
          <div class="dropdown" id="dropdown">
            <div class="dropdown-header">
              <div class="dropdown-name">Max Mustermann</div>
              <div class="dropdown-email">max@beispiel.de</div>
            </div>
            <button class="dropdown-item" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              Profil
            </button>
            <button class="dropdown-item" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                />
              </svg>
              Einstellungen
            </button>
            <div class="dropdown-sep-line"></div>
            <button class="dropdown-item danger" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Abmelden
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="page-wrap">
      <div class="task-card">
        <div class="task-header">
          <div class="task-title">Die Cornelier</div>
          <div class="task-instruction">
            Erschließe, was die Wörter bedeuten könnten. Schreibe in die Lücken.
          </div>
        </div>

        <div class="task-content">
          <div class="image-wrap" id="imageWrap">
            <img
              src="images/eine-roemische-familie.png"
              alt="Die Cornelier"
              id="familyImg"
            />

            <!-- avus – top left -->
            <div class="label-overlay" style="left: 5.5%; top: 3%">
              <span class="label-latin">avus</span>
              <div class="label-input-wrap">
                <input
                  class="label-input"
                  id="input-avus"
                  type="text"
                  placeholder="…"
                  autocomplete="off"
                  spellcheck="false"
                />
                <div class="label-badge" id="badge-avus"></div>
                <div class="label-popover" id="popover-avus"></div>
              </div>
            </div>

            <!-- pater – at scroll height -->
            <div class="label-overlay" style="left: 25%; top: 33%">
              <span class="label-latin">pater</span>
              <div class="label-input-wrap">
                <input
                  class="label-input"
                  id="input-pater"
                  type="text"
                  placeholder="…"
                  autocomplete="off"
                  spellcheck="false"
                />
                <div class="label-badge" id="badge-pater"></div>
                <div class="label-popover" id="popover-pater"></div>
              </div>
            </div>

            <!-- filius – bottom center-left -->
            <div class="label-overlay" style="left: 9%; top: 66%">
              <span class="label-latin">fīlius</span>
              <div class="label-input-wrap">
                <input
                  class="label-input"
                  id="input-filius"
                  type="text"
                  placeholder="…"
                  autocomplete="off"
                  spellcheck="false"
                />
                <div class="label-badge" id="badge-filius"></div>
                <div class="label-popover" id="popover-filius"></div>
              </div>
            </div>

            <!-- catella – center -->
            <div class="label-overlay" style="left: 37%; top: 62%">
              <span class="label-latin">catella</span>
              <div class="label-input-wrap">
                <input
                  class="label-input"
                  id="input-catella"
                  type="text"
                  placeholder="…"
                  autocomplete="off"
                  spellcheck="false"
                />
                <div class="label-badge" id="badge-catella"></div>
                <div class="label-popover" id="popover-catella"></div>
              </div>
            </div>

            <!-- mater – top center-right -->
            <div class="label-overlay" style="left: 45%; top: 3%">
              <span class="label-latin">māter</span>
              <div class="label-input-wrap">
                <input
                  class="label-input"
                  id="input-mater"
                  type="text"
                  placeholder="…"
                  autocomplete="off"
                  spellcheck="false"
                />
                <div class="label-badge" id="badge-mater"></div>
                <div class="label-popover" id="popover-mater"></div>
              </div>
            </div>

            <!-- filia – center-right -->
            <div class="label-overlay" style="left: 58%; top: 80%">
              <span class="label-latin">fīlia</span>
              <div class="label-input-wrap">
                <input
                  class="label-input"
                  id="input-filia"
                  type="text"
                  placeholder="…"
                  autocomplete="off"
                  spellcheck="false"
                />
                <div class="label-badge" id="badge-filia"></div>
                <div class="label-popover" id="popover-filia"></div>
              </div>
            </div>

            <!-- serva – right -->
            <div class="label-overlay" style="left: 76%; top: 8%">
              <span class="label-latin">serva</span>
              <div class="label-input-wrap">
                <input
                  class="label-input"
                  id="input-serva"
                  type="text"
                  placeholder="…"
                  autocomplete="off"
                  spellcheck="false"
                />
                <div class="label-badge" id="badge-serva"></div>
                <div class="label-popover" id="popover-serva"></div>
              </div>
            </div>

            <!-- servus – far right -->
            <div class="label-overlay" style="left: 88%; top: 3%">
              <span class="label-latin">servus</span>
              <div class="label-input-wrap">
                <input
                  class="label-input"
                  id="input-servus"
                  type="text"
                  placeholder="…"
                  autocomplete="off"
                  spellcheck="false"
                />
                <div class="label-badge" id="badge-servus"></div>
                <div class="label-popover" id="popover-servus"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="feedback" id="feedback">
          <svg id="feedbackIcon" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          <span id="feedbackText"></span>
        </div>

        <div class="task-footer">
          <div class="attempts-wrap">
            <div class="attempt-dot" id="dot1"></div>
            <div class="attempt-dot" id="dot2"></div>
            <div class="attempt-dot" id="dot3"></div>
          </div>
          <button class="check-btn" id="checkBtn" onclick="checkAnswers()">
            Überprüfen
          </button>
        </div>
      </div>
    </div>

    <script>
      // ── Answer definitions ────────────────────────────────────────────────────
      const fields = [
        { id: "avus", answers: ["der Großvater", "Großvater"] },
        { id: "pater", answers: ["der Vater", "Vater"] },
        { id: "filius", answers: ["der Sohn", "Sohn"] },
        {
          id: "catella",
          answers: [
            "das Hündchen",
            "Hündchen",
            "die Hündin",
            "Hündin",
            "der Hund",
            "Hund",
          ],
        },
        { id: "mater", answers: ["die Mutter", "Mutter"] },
        { id: "filia", answers: ["die Tochter", "Tochter"] },
        { id: "serva", answers: ["die Sklavin", "Sklavin"] },
        { id: "servus", answers: ["der Sklave", "Sklave"] },
      ];

      const KEY = "task_cornelier";
      let attempts = 0;
      let locked = false;

      const checkBtn = document.getElementById("checkBtn");
      const feedback = document.getElementById("feedback");

      function normalize(str) {
        return str.trim().replace(/\s+/g, " ");
      }

      function applyBorders(markEmpty) {
        fields.forEach((f) => {
          const input = document.getElementById("input-" + f.id);
          if (input.value.trim() === "" && !markEmpty) return; // don't mark empty fields unless forced
          const isCorrect = f.answers.some(
            (a) => normalize(a) === normalize(input.value),
          );
          input.classList.remove("correct", "wrong");
          input.classList.add(isCorrect ? "correct" : "wrong");
        });
      }

      function showBadges(revealWrong) {
        fields.forEach((f) => {
          const input = document.getElementById("input-" + f.id);
          const badge = document.getElementById("badge-" + f.id);
          const val = normalize(input.value);
          const isCorrect = f.answers.some((a) => normalize(a) === val);

          if (isCorrect) {
            badge.className = "label-badge show ok";
            badge.innerHTML =
              '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
          } else {
            badge.className = "label-badge show fail";
            badge.innerHTML =
              '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>';
          }
        });

        if (revealWrong) setupPopovers();
      }

      function setupPopovers() {
        fields.forEach((f) => {
          const input = document.getElementById("input-" + f.id);
          const popover = document.getElementById("popover-" + f.id);
          const wrap = input.closest(".label-input-wrap");
          const val = normalize(input.value);
          const isCorrect = f.answers.some((a) => normalize(a) === val);
          if (isCorrect) return;

          popover.textContent = f.answers[0];
          // Make the wrapper the click target (input is readonly/pointer-none)
          wrap.style.cursor = "pointer";
          wrap.addEventListener("click", () => {
            // close all other popovers first
            document.querySelectorAll(".label-popover.show").forEach((p) => {
              if (p !== popover) p.classList.remove("show");
            });
            popover.classList.toggle("show");
          });
        });
      }

      // Enable button always; check requires at least one field filled
      function checkAnswers() {
        if (locked || attempts >= 3) return;
        const anyFilled = fields.some(
          (f) => document.getElementById("input-" + f.id).value.trim() !== "",
        );
        if (!anyFilled) {
          showFeedback("warn", "Fülle mindestens eine Lücke aus.");
          return;
        }

        attempts++;
        document.getElementById("dot" + attempts).classList.add("used");

        let correctCount = 0;
        fields.forEach((f) => {
          const val = normalize(document.getElementById("input-" + f.id).value);
          if (f.answers.some((a) => normalize(a) === val)) correctCount++;
        });

        const allCorrect = correctCount === fields.length;
        const points = correctCount * 0.5;

        if (allCorrect) {
          applyBorders();
          showBadges(false);
          showFeedback("ok", "Ausgezeichnet! Alle Antworten sind richtig!");
          winState(points);
          return;
        }

        if (attempts < 3) {
          applyBorders();
          showFeedback(
            "warn",
            `${correctCount} von ${fields.length} richtig. Versuche es nochmal!`,
          );
          return;
        }

        // 3rd failed attempt — keep user input, show borders + badges + popovers
        applyBorders(true);
        showBadges(true);
        locked = true;
        fields.forEach((f) => {
          const inp = document.getElementById("input-" + f.id);
          inp.readOnly = true;
          inp.style.pointerEvents = "none";
        });
        showFeedback(
          "warn",
          "Klicke auf die gelb markierten Felder um die richtige Antwort zu sehen.",
        );
        saveState(points, false);
        checkBtn.classList.add("partial");
        checkBtn.innerHTML =
          'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
        checkBtn.onclick = () =>
          (window.location.href = "satzglied-wortart-form.html");
      }

      function winState(points) {
        locked = true;
        fields.forEach((f) => {
          const inp = document.getElementById("input-" + f.id);
          inp.readOnly = true;
          inp.style.pointerEvents = "none";
        });
        showBadges(false);
        saveState(points, true);
        checkBtn.classList.add("success");
        checkBtn.innerHTML =
          'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
        checkBtn.style.pointerEvents = "auto";
        checkBtn.onclick = () =>
          (window.location.href = "satzglied-wortart-form.html");
      }

      function saveState(points, done) {
        const values = {};
        fields.forEach((f) => {
          values[f.id] = document.getElementById("input-" + f.id).value;
        });
        localStorage.setItem(KEY, done ? "done" : "attempted");
        localStorage.setItem(KEY + "_points", points);
        localStorage.setItem(
          KEY + "_date",
          new Date().toLocaleDateString("de-DE"),
        );
        localStorage.setItem(KEY + "_attempts", attempts);
        localStorage.setItem(KEY + "_values", JSON.stringify(values));
        if (!done) localStorage.setItem(KEY + "_fail", "true");
      }

      function showFeedback(type, text) {
        feedback.className = "feedback show " + type;
        document.getElementById("feedbackIcon").innerHTML =
          type === "ok"
            ? '<polyline points="20 6 9 17 4 12"/>'
            : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
        document.getElementById("feedbackText").textContent = text;
      }

      // ── Restore saved state ───────────────────────────────────────────────────
      (function restoreState() {
        const saved = localStorage.getItem(KEY);
        if (!saved) return;
        const savedValues = JSON.parse(
          localStorage.getItem(KEY + "_values") || "{}",
        );
        const savedAttempts = parseInt(
          localStorage.getItem(KEY + "_attempts") || "0",
        );
        const savedDone = saved === "done";
        const savedFail = localStorage.getItem(KEY + "_fail") === "true";

        fields.forEach((f) => {
          const input = document.getElementById("input-" + f.id);
          if (savedValues[f.id] !== undefined) input.value = savedValues[f.id];
          input.readOnly = true;
          input.style.pointerEvents = "none";
        });

        for (let i = 1; i <= savedAttempts; i++) {
          const d = document.getElementById("dot" + i);
          if (d) d.classList.add("used");
        }
        attempts = savedAttempts;
        locked = true;
        applyBorders(savedFail); // mark empty fields too if failed
        if (savedDone || savedFail) showBadges(savedFail);

        if (savedDone) {
          showFeedback("ok", "Ausgezeichnet! Alle Antworten sind richtig!");
          checkBtn.classList.add("success");
          checkBtn.innerHTML =
            'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
          checkBtn.style.pointerEvents = "auto";
          checkBtn.onclick = () =>
            (window.location.href = "satzglied-wortart-form.html");
        } else if (savedFail) {
          showFeedback(
            "warn",
            "Klicke auf die gelb markierten Felder um die richtige Antwort zu sehen.",
          );
          checkBtn.classList.add("partial");
          checkBtn.innerHTML =
            'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
          checkBtn.style.pointerEvents = "auto";
          checkBtn.onclick = () =>
            (window.location.href = "satzglied-wortart-form.html");
        }
      })();

      // ── Bell & dropdown ───────────────────────────────────────────────────────
      function handleBell() {
        alert("Keine neuen Benachrichtigungen.");
      }
      function toggleDropdown() {
        document.getElementById("dropdown").classList.toggle("open");
      }
      function closeDropdown() {
        document.getElementById("dropdown").classList.remove("open");
      }
      document.addEventListener("click", (e) => {
        if (!document.querySelector(".user-wrap").contains(e.target))
          closeDropdown();
        // Close all popovers when clicking outside a label-input-wrap
        if (!e.target.closest(".label-input-wrap")) {
          document
            .querySelectorAll(".label-popover.show")
            .forEach((p) => p.classList.remove("show"));
        }
      });
    </script>
  </body>
</html>
