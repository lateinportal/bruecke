<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wer wird Circusprofi?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Lora:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scrollbar-gutter: stable;
      }

      :root {
        --bg: #f8f8f6;
        --white: #ffffff;
        --border: #e6e4df;
        --text: #111111;
        --muted: #898783;
        --green: #4caf50;
        --yellow: #f5a623;
        --radius: 14px;
      }

      body {
        font-family: "Noto Sans", sans-serif;
        background: var(--bg);
        min-height: 100vh;
        padding: 5rem 1.5rem 3rem;
        color: var(--text);
      }

      /* ── Header ── */
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        background: var(--white);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
        z-index: 200;
      }
      .sitename {
        font-size: 19px;
        font-weight: 700;
        color: #111;
        font-family: "Lora", serif;
        letter-spacing: -0.4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sitename a {
        color: inherit;
        text-decoration: none;
      }
      .sitename .sep {
        color: #cccccc;
        font-family: "Noto Sans", sans-serif;
        font-weight: 400;
        font-size: 17px;
      }
      .sitename .sep2 {
        color: #cccccc;
        font-family: "Noto Sans", sans-serif;
        font-weight: 400;
        font-size: 17px;
      }
      .sitename .sub {
        font-size: 12px;
        font-weight: 600;
        color: #555;
        font-family: "Noto Sans", sans-serif;
      }
      .sitename .sub2 {
        font-size: 12px;
        font-weight: 600;
        color: #555;
        font-family: "Noto Sans", sans-serif;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s;
        position: relative;
        outline: none;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        transform: scale(1.08);
      }
      .icon-btn:active {
        transform: scale(0.94);
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bell-btn svg {
        stroke: #898783;
      }
      .bell-btn .dot {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 7px;
        height: 7px;
        background: #cc3300;
        border-radius: 50%;
        border: 1.5px solid var(--white);
      }
      @keyframes ring {
        0%,
        100% {
          transform: rotate(0);
        }
        15% {
          transform: rotate(14deg);
        }
        30% {
          transform: rotate(-12deg);
        }
        45% {
          transform: rotate(8deg);
        }
        60% {
          transform: rotate(-5deg);
        }
        75% {
          transform: rotate(3deg);
        }
      }
      .bell-btn:hover svg {
        animation: ring 0.55s ease;
        transform-origin: 50% 3px;
      }
      .user-btn svg {
        stroke: #898783;
      }
      .user-wrap {
        position: relative;
      }
      .dropdown {
        display: none;
        position: absolute;
        top: 44px;
        right: 0;
        background: var(--white);
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        min-width: 190px;
        overflow: hidden;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.1);
      }
      .dropdown.open {
        display: block;
        animation: dropIn 0.15s ease;
      }
      @keyframes dropIn {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .dropdown-header {
        padding: 13px 16px 9px;
        border-bottom: 1px solid #e8e8e8;
        background: #f9f9f9;
      }
      .dropdown-name {
        font-size: 14px;
        font-weight: 600;
        color: #111;
      }
      .dropdown-email {
        font-size: 12px;
        color: #888;
        margin-top: 2px;
      }
      .dropdown-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        font-size: 14px;
        color: #111;
        cursor: pointer;
        border: none;
        background: none;
        width: 100%;
        font-family: "Noto Sans", sans-serif;
        transition: background 0.12s;
        text-align: left;
      }
      .dropdown-item:hover {
        background: #f4f4f4;
      }
      .dropdown-item svg {
        width: 15px;
        height: 15px;
        stroke: #555;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .dropdown-sep-line {
        height: 1px;
        background: #e8e8e8;
      }
      .dropdown-item.danger {
        color: #cc3300;
      }
      .dropdown-item.danger svg {
        stroke: #cc3300;
      }

      /* ── Page ── */
      .page-wrap {
        max-width: 780px;
        margin: 0 auto;
      }

      /* ── Task card ── */
      .task-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .task-header {
        padding: 20px 22px 16px;
        border-bottom: 1px solid var(--border);
      }
      .task-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 6px;
        font-family: "Lora", serif;
      }
      .task-instruction {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.6;
      }

      /* ── Task content ── */
      .task-content {
        padding: 24px 22px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      /* ── Question block ── */
      .q-block {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .q-label {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.5;
      }
      .q-label span {
        font-weight: 700;
        margin-right: 4px;
      }

      /* ── Checkbox grid — single column for single-choice ── */
      .cb-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      /* ── Checkbox item ── */
      .cb-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        background: var(--white);
        cursor: pointer;
        user-select: none;
        transition:
          background 0.12s,
          border-color 0.12s,
          box-shadow 0.12s;
      }
      .cb-item:hover {
        background: #fafaf8;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      .cb-item.checked {
        border-color: #111;
        background: #f5f4f0;
      }

      /* Custom radio box */
      .cb-box {
        width: 20px;
        height: 20px;
        border: 2px solid #d0cec9;
        border-radius: 50%;
        background: var(--white);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .cb-item.checked .cb-box {
        background: #111;
        border-color: #111;
      }
      .cb-box::after {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #fff;
        display: none;
      }
      .cb-item.checked .cb-box::after {
        display: block;
      }

      /* Option letter badge */
      .cb-letter {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        flex-shrink: 0;
        min-width: 14px;
      }

      /* Label text */
      .cb-label {
        font-size: 13px;
        line-height: 1.4;
        color: var(--text);
      }

      /* States after check */
      .cb-item.locked-ok {
        border-color: var(--green) !important;
        background: #edf7ed;
        cursor: default;
      }
      .cb-item.locked-ok .cb-box {
        background: var(--green);
        border-color: var(--green);
      }
      .cb-item.locked-ok .cb-box::after {
        display: block;
      }
      .cb-item.locked-wrong {
        border-color: var(--yellow) !important;
        background: #fff8ed;
        cursor: default;
      }
      .cb-item.locked-wrong .cb-box {
        background: var(--yellow);
        border-color: var(--yellow);
      }
      .cb-item.locked-wrong .cb-box::after {
        display: block;
      }
      /* Show correct answer when user got it wrong */
      .cb-item.locked-correct-hint {
        border-color: var(--green) !important;
        background: #edf7ed;
        cursor: default;
      }
      .cb-item.locked-correct-hint .cb-box {
        background: var(--green);
        border-color: var(--green);
      }
      .cb-item.locked-correct-hint .cb-box::after {
        display: block;
      }
      .cb-item.locked-neutral {
        cursor: default;
        opacity: 0.7;
      }

      /* ── Feedback ── */
      .feedback {
        display: none;
        margin: 0 22px 16px;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        align-items: center;
        gap: 8px;
      }
      .feedback.show {
        display: flex;
      }
      .feedback.warn {
        background: #fff8ed;
        color: #b45309;
        border: 1px solid #fde68a;
      }
      .feedback.ok {
        background: #edf7ed;
        color: #2e7d32;
        border: 1px solid #c8e6c9;
      }
      .feedback svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      /* ── Task footer ── */
      .task-footer {
        padding: 16px 22px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 16px;
      }
      .attempts-wrap {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .attempt-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 1.5px solid #d0cec9;
        background: transparent;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .attempt-dot.used {
        background: var(--muted);
        border-color: var(--muted);
      }

      .check-btn {
        background: #111;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 9px 20px;
        font-size: 14px;
        font-weight: 600;
        font-family: "Noto Sans", sans-serif;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.15s;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .check-btn:hover {
        background: #333;
        transform: translateY(-1px);
      }
      .check-btn:active {
        transform: scale(0.97);
      }
      .check-btn.success {
        background: var(--green);
      }
      .check-btn.partial {
        background: var(--yellow);
      }
      .check-btn svg {
        width: 14px;
        height: 14px;
        stroke: #fff;
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @media (max-width: 560px) {
        .cb-grid {
          grid-template-columns: 1fr;
        }
        body {
          padding: 4.5rem 0.75rem 2rem;
        }
        .task-content {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="sitename">
        <a href="lektionsuebersicht.html">Latein*</a>
        <span class="sep">›</span>
        <a href="lektion06.html" class="sub">Lektion 6</a>
        <span class="sep2">›</span>
        <span class="sub2">Wer wird Circusprofi?</span>
      </div>
      <div class="topbar">
        <button
          class="icon-btn bell-btn"
          title="Benachrichtigungen"
          onclick="handleBell()"
        >
          <svg viewBox="0 0 24 24">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span class="dot"></span>
        </button>
        <div class="user-wrap">
          <button
            class="icon-btn user-btn"
            title="Benutzerprofil"
            onclick="toggleDropdown()"
          >
            <svg viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </button>
          <div class="dropdown" id="dropdown">
            <div class="dropdown-header">
              <div class="dropdown-name">Max Mustermann</div>
              <div class="dropdown-email">max@beispiel.de</div>
            </div>
            <button class="dropdown-item" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" /></svg
              >Profil
            </button>
            <button class="dropdown-item" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                /></svg
              >Einstellungen
            </button>
            <div class="dropdown-sep-line"></div>
            <button class="dropdown-item danger" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" /></svg
              >Abmelden
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="page-wrap">
      <div class="task-card">
        <div class="task-header">
          <div class="task-title">Wer wird Circusprofi?</div>
          <div class="task-instruction">Kreuze die richtige Antwort an.</div>
        </div>

        <div class="task-content" id="taskContent"></div>

        <div class="feedback" id="feedback">
          <svg id="feedbackIcon" viewBox="0 0 24 24"></svg>
          <span id="feedbackText"></span>
        </div>

        <div class="task-footer">
          <div class="attempts-wrap">
            <div class="attempt-dot" id="dot1"></div>
            <div class="attempt-dot" id="dot2"></div>
            <div class="attempt-dot" id="dot3"></div>
          </div>
          <button class="check-btn" id="checkBtn" onclick="checkAnswers()">
            Überprüfen
          </button>
        </div>
      </div>
    </div>

    <script>
      // ── Daten ──────────────────────────────────────────────────────────────
      // ans: true = richtige Antwort (nur eine pro Frage)
      const questions = [
        {
          id: "q1",
          text: "Der Circus Maximus heute ist vergleichbar mit ...",
          options: [
            { id: "q1a", letter: "a", label: "einer Pferderennbahn.", ans: false },
            { id: "q1b", letter: "b", label: "dem Zirkus Roncalli.", ans: false },
            { id: "q1c", letter: "c", label: "einem Fußballstadion.", ans: true },
          ],
        },
        {
          id: "q2",
          text: "Wie viele Zuschauer fanden im Circus Maximus Platz?",
          options: [
            { id: "q2a", letter: "a", label: "50 000 bis 70 000", ans: false },
            { id: "q2b", letter: "b", label: "10 000 bis 20 000", ans: false },
            { id: "q2c", letter: "c", label: "150 000 bis 250 000", ans: true },
          ],
        },
        {
          id: "q3",
          text: "Metae sind ...",
          options: [
            { id: "q3a", letter: "a", label: "Renngesellschaften.", ans: false },
            { id: "q3b", letter: "b", label: "Wendemarken.", ans: true },
            { id: "q3c", letter: "c", label: "Nahrungsmittel für die Pferde.", ans: false },
          ],
        },
        {
          id: "q4",
          text: "Sieben Bronzedelfine und sieben Marmoreier dienten ...",
          options: [
            { id: "q4a", letter: "a", label: "der Götterverehrung.", ans: false },
            { id: "q4b", letter: "b", label: "zur Anzeige der sieben Rennrunden.", ans: true },
            { id: "q4c", letter: "c", label: "als Siegerprämien.", ans: false },
          ],
        },
        {
          id: "q5",
          text: "Spina bedeutet ...",
          options: [
            { id: "q5a", letter: "a", label: "Startlinie.", ans: false },
            { id: "q5b", letter: "b", label: "Wendemarke mit Säulen.", ans: false },
            { id: "q5c", letter: "c", label: "Trennmauer auf der Rennbahn.", ans: true },
          ],
        },
      ];

      const KEY  = "task_l06_wer_wird_circusprofi";
      const NEXT = "gr-genitivattribut-formen.html";

      // ── State ──────────────────────────────────────────────────────────────
      // selected[qId] = optionId or null
      let selected = {};
      let tries  = 0;
      let locked = false;

      questions.forEach((q) => { selected[q.id] = null; });

      // ── Build UI ───────────────────────────────────────────────────────────
      const taskContent = document.getElementById("taskContent");

      questions.forEach((q) => {
        const block = document.createElement("div");
        block.className = "q-block";

        const label = document.createElement("div");
        label.className = "q-label";
        label.innerHTML = `<span>${q.id.replace("q", "") + "."}</span>${q.text}`;
        block.appendChild(label);

        const grid = document.createElement("div");
        grid.className = "cb-grid";
        grid.id = "grid-" + q.id;

        q.options.forEach((o) => {
          const el = document.createElement("div");
          el.className = "cb-item";
          el.id = o.id;
          el.innerHTML = `
            <div class="cb-box"></div>
            <span class="cb-letter">${o.letter}</span>
            <span class="cb-label">${o.label}</span>`;
          el.onclick = () => selectItem(q.id, o.id);
          grid.appendChild(el);
        });

        block.appendChild(grid);
        taskContent.appendChild(block);
      });

      // ── Select (radio behaviour) ───────────────────────────────────────────
      function selectItem(qId, oId) {
        if (locked) return;
        // Deselect previous in same question
        const q = questions.find((x) => x.id === qId);
        q.options.forEach((o) => {
          document.getElementById(o.id).classList.remove("checked");
        });
        selected[qId] = oId;
        document.getElementById(oId).classList.add("checked");
      }

      // ── Check ──────────────────────────────────────────────────────────────
      function checkAnswers() {
        if (locked || tries >= 3) return;

        // Ensure all answered
        const allAnswered = questions.every((q) => selected[q.id] !== null);
        if (!allAnswered) {
          showFeedback("warn", "Bitte beantworte alle Fragen, bevor du überprüfst.");
          return;
        }

        tries++;
        document.getElementById("dot" + tries).classList.add("used");

        const allOk = questions.every((q) => {
          const correctOption = q.options.find((o) => o.ans);
          return selected[q.id] === correctOption.id;
        });

        const btn = document.getElementById("checkBtn");

        if (allOk) {
          applyLock(true);
          locked = true;
          showFeedback("ok", "Ausgezeichnet! Alle Antworten richtig!");
          btn.classList.add("success");
          btn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
          btn.onclick = () => (window.location.href = NEXT);
          saveState(true);
          return;
        }

        if (tries < 3) {
          showFeedback("warn", "Das ist noch nicht ganz richtig. Versuche es nochmal!");
          return;
        }

        // 3rd attempt failed
        applyLock(false);
        locked = true;
        btn.classList.add("partial");
        btn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
        btn.onclick = () => (window.location.href = NEXT);
        showFeedback("warn", "Die gelb markierten Antworten waren nicht korrekt. Grün zeigt die richtige Lösung.");
        saveState(false);
      }

      function applyLock(allCorrect) {
        questions.forEach((q) => {
          const correctOption = q.options.find((o) => o.ans);
          const userSel = selected[q.id];
          q.options.forEach((o) => {
            const el = document.getElementById(o.id);
            el.classList.remove("checked");
            if (o.id === correctOption.id && userSel === o.id) {
              // Correct selection
              el.classList.add("locked-ok");
            } else if (o.id === userSel && !o.ans) {
              // Wrong selection
              el.classList.add("locked-wrong");
            } else if (o.id === correctOption.id && userSel !== o.id) {
              // Show correct answer when missed (only after final lock)
              if (!allCorrect) el.classList.add("locked-correct-hint");
              else el.classList.add("locked-neutral");
            } else {
              el.classList.add("locked-neutral");
            }
          });
        });
      }

      // ── Save ───────────────────────────────────────────────────────────────
      function saveState(done) {
        const correctCount = questions.filter((q) => {
          const correctOption = q.options.find((o) => o.ans);
          return selected[q.id] === correctOption.id;
        }).length;
        const points = +(correctCount * 0.5).toFixed(1);
        localStorage.setItem(KEY, done ? "done" : "attempted");
        localStorage.setItem(KEY + "_selected", JSON.stringify(selected));
        localStorage.setItem(KEY + "_attempts", tries);
        localStorage.setItem(KEY + "_points", points);
        localStorage.setItem(KEY + "_date", new Date().toLocaleDateString("de-DE"));
        if (!done) localStorage.setItem(KEY + "_fail", "true");
      }

      // ── Feedback ───────────────────────────────────────────────────────────
      function showFeedback(type, text) {
        const fb = document.getElementById("feedback");
        fb.className = "feedback show " + type;
        document.getElementById("feedbackIcon").innerHTML =
          type === "ok"
            ? '<polyline points="20 6 9 17 4 12"/>'
            : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
        document.getElementById("feedbackText").textContent = text;
      }

      // ── Restore ────────────────────────────────────────────────────────────
      (function restoreState() {
        const savedDone    = localStorage.getItem(KEY) === "done";
        const savedFail    = localStorage.getItem(KEY + "_fail") === "true";
        const savedSel     = localStorage.getItem(KEY + "_selected");
        const savedTries   = parseInt(localStorage.getItem(KEY + "_attempts") || "0");
        if (!savedSel || (!savedDone && !savedFail)) return;

        selected = JSON.parse(savedSel);
        tries  = savedTries;
        locked = true;

        for (let i = 1; i <= savedTries; i++) {
          const d = document.getElementById("dot" + i);
          if (d) d.classList.add("used");
        }

        applyLock(savedDone);

        const btn = document.getElementById("checkBtn");
        if (savedDone) {
          btn.classList.add("success");
          showFeedback("ok", "Ausgezeichnet! Alle Antworten richtig!");
        } else {
          btn.classList.add("partial");
          showFeedback("warn", "Die gelb markierten Antworten waren nicht korrekt. Grün zeigt die richtige Lösung.");
        }
        btn.innerHTML =
          'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
        btn.onclick = () => (window.location.href = NEXT);
      })();

      // ── Bell & Dropdown ────────────────────────────────────────────────────
      function handleBell()    { alert("Keine neuen Benachrichtigungen."); }
      function toggleDropdown(){ document.getElementById("dropdown").classList.toggle("open"); }
      function closeDropdown() { document.getElementById("dropdown").classList.remove("open"); }
      document.addEventListener("click", (e) => {
        if (!document.querySelector(".user-wrap").contains(e.target)) closeDropdown();
      });
    </script>
  </body>
</html>
