<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ponticulus 2 B</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Lora:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scrollbar-gutter: stable; }

      :root {
        --bg: #f8f8f6;
        --white: #ffffff;
        --border: #e6e4df;
        --text: #111111;
        --muted: #898783;
        --green: #4caf50;
        --yellow: #f5a623;
        --blue: #2563eb;
        --radius: 14px;
      }

      body {
        font-family: "Noto Sans", sans-serif;
        background: var(--bg);
        min-height: 100vh;
        padding: 5rem 1.5rem 3rem;
        color: var(--text);
      }

      /* ── Header ── */
      header {
        position: fixed; top: 0; left: 0; right: 0;
        height: 56px; background: var(--white);
        border-bottom: 1px solid var(--border);
        display: flex; align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem; z-index: 200;
      }
      .sitename { font-size: 19px; font-weight: 700; color: #111; font-family: "Lora", serif; letter-spacing: -0.4px; display: flex; align-items: center; gap: 6px; }
      .sitename a { color: inherit; text-decoration: none; }
      .sitename .sep  { color: #cccccc; font-family: "Noto Sans", sans-serif; font-weight: 400; font-size: 17px; }
      .sitename .sep2 { color: #cccccc; font-family: "Noto Sans", sans-serif; font-weight: 400; font-size: 17px; }
      .sitename .sub  { font-size: 12px; font-weight: 600; color: #555; font-family: "Noto Sans", sans-serif; }
      .sitename .sub2 { font-size: 12px; font-weight: 600; color: #555; font-family: "Noto Sans", sans-serif; }
      .topbar { display: flex; align-items: center; gap: 8px; }
      .icon-btn { width: 34px; height: 34px; border-radius: 12px; border: 1px solid transparent; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; position: relative; outline: none; flex-shrink: 0; }
      .icon-btn:hover { transform: scale(1.08); }
      .icon-btn:active { transform: scale(0.94); }
      .icon-btn svg { width: 16px; height: 16px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .bell-btn svg { stroke: #898783; }
      .bell-btn .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: #cc3300; border-radius: 50%; border: 1.5px solid var(--white); }
      @keyframes ring { 0%,100%{transform:rotate(0)} 15%{transform:rotate(14deg)} 30%{transform:rotate(-12deg)} 45%{transform:rotate(8deg)} 60%{transform:rotate(-5deg)} 75%{transform:rotate(3deg)} }
      .bell-btn:hover svg { animation: ring 0.55s ease; transform-origin: 50% 3px; }
      .user-btn svg { stroke: #898783; }
      .user-wrap { position: relative; }
      .dropdown { display: none; position: absolute; top: 44px; right: 0; background: var(--white); border: 1px solid #e0e0e0; border-radius: 10px; min-width: 190px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,0.10); }
      .dropdown.open { display: block; animation: dropIn 0.15s ease; }
      @keyframes dropIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
      .dropdown-header { padding: 13px 16px 9px; border-bottom: 1px solid #e8e8e8; background: #f9f9f9; }
      .dropdown-name { font-size: 14px; font-weight: 600; color: #111; }
      .dropdown-email { font-size: 12px; color: #888; margin-top: 2px; }
      .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 14px; color: #111; cursor: pointer; border: none; background: none; width: 100%; font-family: "Noto Sans", sans-serif; transition: background 0.12s; text-align: left; }
      .dropdown-item:hover { background: #f4f4f4; }
      .dropdown-item svg { width: 15px; height: 15px; stroke: #555; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
      .dropdown-sep-line { height: 1px; background: #e8e8e8; }
      .dropdown-item.danger { color: #cc3300; }
      .dropdown-item.danger svg { stroke: #cc3300; }

      /* ── Page ── */
      .page-wrap { max-width: 780px; margin: 0 auto; }

      /* ── Task card ── */
      .task-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
      .task-header { padding: 20px 22px 16px; border-bottom: 1px solid var(--border); }
      .task-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; font-family: "Lora", serif; }
      .task-instruction { font-size: 14px; color: var(--muted); line-height: 1.6; }

      /* ── Task content ── */
      .task-content { padding: 22px 22px; display: flex; flex-direction: column; gap: 0; }

      /* ── Rows ── */
      .noun-row {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 14px 0;
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .noun-row:last-child { border-bottom: none; }

      /* Substantiv label */
      .noun-label {
        font-family: "Lora", serif;
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        min-width: 90px;
        flex-shrink: 0;
      }

      /* Chip groups */
      .chip-groups {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        flex: 1;
      }

      .chip-group {
        display: flex;
        gap: 5px;
      }

      /* Individual chip */
      .chip {
        padding: 5px 13px;
        border-radius: 7px;
        border: 1.5px solid var(--border);
        background: var(--white);
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
        font-family: "Noto Sans", sans-serif;
        white-space: nowrap;
      }
      .chip:hover:not(.locked) { border-color: #b0aead; color: var(--text); }
      .chip.selected {
        background: #EEF3FC;
        border-color: #2563eb;
        color: #2563eb;
      }

      /* States after check */
      .chip.correct-chip {
        background: #EDF7ED;
        border-color: var(--green);
        border-width: 2px;
        color: #2e7d32;
      }
      .chip.wrong-chip {
        background: #fff8ed;
        border-color: var(--yellow);
        border-width: 2px;
        color: #b45309;
      }
      .chip.locked { cursor: default; pointer-events: none; }
      .chip.locked.wrong-chip { cursor: pointer; pointer-events: auto; }

      /* Lösung nach 3. Versuch */
      .solution-label {
        display: none;
        font-size: 12px;
        color: var(--muted);
        font-style: italic;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .solution-label strong {
        color: var(--text);
        font-style: normal;
        font-weight: 600;
      }
      .solution-label.show { display: inline; }

      /* Chip popover */
      .chip { position: relative; }
      .chip-popover {
        display: none;
        position: absolute;
        bottom: calc(100% + 7px);
        left: 50%; transform: translateX(-50%);
        background: #111; color: #fff;
        font-size: 11px; font-weight: 600;
        font-family: "Noto Sans", sans-serif;
        padding: 4px 8px; border-radius: 6px;
        white-space: nowrap; z-index: 50;
        pointer-events: none;
      }
      .chip-popover::after {
        content: ''; position: absolute;
        top: 100%; left: 50%; transform: translateX(-50%);
        border: 4px solid transparent; border-top-color: #111;
      }
      .chip-popover.show { display: block; }

      /* Divider between Kasus and Numerus groups */
      .chip-divider {
        width: 1px;
        height: 20px;
        background: var(--border);
        flex-shrink: 0;
      }

      /* Double-answer hint badge */
      .double-hint {
        font-size: 11px;
        color: var(--muted);
        background: #EEECEA;
        border-radius: 5px;
        padding: 2px 7px;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* ── Feedback ── */
      .feedback {
        display: none; margin: 0 22px 16px;
        padding: 12px 14px; border-radius: 10px;
        font-size: 14px; font-weight: 500;
        align-items: center; gap: 8px;
      }
      .feedback.show { display: flex; }
      .feedback.warn { background: #fff8ed; color: #b45309; border: 1px solid #fde68a; }
      .feedback.ok   { background: #edf7ed; color: #2e7d32; border: 1px solid #c8e6c9; }
      .feedback svg  { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

      /* ── Task footer ── */
      .task-footer {
        padding: 16px 22px; border-top: 1px solid var(--border);
        display: flex; align-items: center; justify-content: flex-end; gap: 16px;
      }
      .attempts-wrap { display: flex; gap: 5px; align-items: center; }
      .attempt-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #d0cec9; background: transparent; transition: background 0.2s, border-color 0.2s; }
      .attempt-dot.used { background: var(--muted); border-color: var(--muted); }

      .check-btn {
        background: #111; color: #fff; border: none; border-radius: 10px;
        padding: 9px 20px; font-size: 14px; font-weight: 600;
        font-family: "Noto Sans", sans-serif;
        cursor: pointer; transition: background 0.15s, transform 0.15s;
        display: flex; align-items: center; gap: 6px;
      }
      .check-btn:hover { background: #333; transform: translateY(-1px); }
      .check-btn:active { transform: scale(0.97); }
      .check-btn.success { background: var(--green); }
      .check-btn.partial { background: var(--yellow); }
      .check-btn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

      @media (max-width: 560px) {
        body { padding: 4.5rem 0.75rem 2rem; }
        .task-content { padding: 14px 12px; }
        .noun-label { min-width: 75px; font-size: 14px; }
        .chip { font-size: 12px; padding: 4px 10px; }
      }
    </style>
  </head>
  <body>

    <header>
      <div class="sitename">
        <a href="lektionsuebersicht.html">Latein*</a>
        <span class="sep">›</span>
        <a href="lektion03.html" class="sub">Lektion 3</a>
        <span class="sep2">›</span>
        <span class="sub2">Ponticulus 2 B</span>
      </div>
      <div class="topbar">
        <button class="icon-btn bell-btn" title="Benachrichtigungen" onclick="handleBell()">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="dot" id="bellDot"></span>
        </button>
        <div class="user-wrap">
          <button class="icon-btn user-btn" title="Benutzerprofil" onclick="toggleDropdown()">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>
          <div class="dropdown" id="dropdown">
            <div class="dropdown-header">
              <div class="dropdown-name">Max Mustermann</div>
              <div class="dropdown-email">max@beispiel.de</div>
            </div>
            <button class="dropdown-item" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil
            </button>
            <button class="dropdown-item" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Einstellungen
            </button>
            <div class="dropdown-sep-line"></div>
            <button class="dropdown-item danger" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Abmelden
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="page-wrap">
      <div class="task-card">

        <div class="task-header">
          <div class="task-title">Ponticulus 2 B</div>
          <div class="task-instruction">
            Bestimme Kasus (Nominativ / Akkusativ) und Numerus der Substantive.
            Achtung: Bei drei Substantiven gibt es jeweils zwei richtige Lösungen.
          </div>
        </div>

        <div class="task-content" id="nounList"></div>

        <div class="feedback" id="feedback">
          <svg id="feedbackIcon" viewBox="0 0 24 24"></svg>
          <span id="feedbackText"></span>
        </div>

        <div class="task-footer">
          <div class="attempts-wrap">
            <div class="attempt-dot" id="dot1"></div>
            <div class="attempt-dot" id="dot2"></div>
            <div class="attempt-dot" id="dot3"></div>
          </div>
          <button class="check-btn" id="checkBtn">Überprüfen</button>
        </div>

      </div>
    </div>

    <script>
      // ── Daten ─────────────────────────────────────────────────────────────────
      // correct: Array von Arrays → jede innere Array = eine gültige Kombination [kasus, numerus]
      // double: true = Hinweis "2 Lösungen" anzeigen
      const nouns = [
        { id: 'n1', word: 'soror',    double: false, correct: [['Nom','Sg']] },
        { id: 'n2', word: 'otium',    double: true,  correct: [['Nom','Sg'], ['Akk','Sg']] },
        { id: 'n3', word: 'puerī',    double: false, correct: [['Nom','Pl']] },
        { id: 'n4', word: 'frātrēs',  double: true,  correct: [['Nom','Pl'], ['Akk','Pl']] },
        { id: 'n5', word: 'virum',    double: false, correct: [['Akk','Sg']] },
        { id: 'n6', word: 'līberōs',  double: false, correct: [['Akk','Pl']] },
        { id: 'n7', word: 'officia',  double: true,  correct: [['Nom','Pl'], ['Akk','Pl']] },
        { id: 'n8', word: 'patrem',   double: false, correct: [['Akk','Sg']] },
      ];

      const KEY  = 'task_l03_ponticulus_2b';
      const NEXT = 'auf-dem-land.html';

      let tries  = 0;
      let locked = false;

      // State: kasus = Set (multi), numerus = null|'Sg'|'Pl' (single)
      const state = {};
      nouns.forEach(n => { state[n.id] = { kasus: new Set(), numerus: null }; });

      // ── Aufbau ────────────────────────────────────────────────────────────────
      const container = document.getElementById('nounList');

      nouns.forEach((n, idx) => {
        const row = document.createElement('div');
        row.className = 'noun-row';
        row.id = 'row-' + n.id;

        // Label
        const label = document.createElement('span');
        label.className = 'noun-label';
        label.textContent = n.word;
        row.appendChild(label);

        // Chip groups wrapper
        const groups = document.createElement('div');
        groups.className = 'chip-groups';

        // Kasus chips
        const kasusGroup = document.createElement('div');
        kasusGroup.className = 'chip-group';
        ['Nom', 'Akk'].forEach(k => {
          const chip = document.createElement('button');
          chip.className = 'chip';
          chip.textContent = k + '.';
          chip.dataset.nid   = n.id;
          chip.dataset.type  = 'kasus';
          chip.dataset.value = k;
          chip.id = `chip-${n.id}-kasus-${k}`;
          chip.addEventListener('click', () => toggleChip(n.id, 'kasus', k));
          // popover
          const pop = document.createElement('span');
          pop.className = 'chip-popover';
          pop.id = `pop-${n.id}-kasus-${k}`;
          chip.appendChild(pop);
          chip.addEventListener('click', (e) => {
            if (chip.classList.contains('wrong-chip')) {
              e.stopPropagation();
              pop.classList.toggle('show');
            }
          });
          kasusGroup.appendChild(chip);
        });
        groups.appendChild(kasusGroup);

        // Divider
        const divider = document.createElement('div');
        divider.className = 'chip-divider';
        groups.appendChild(divider);

        // Numerus chips
        const numerusGroup = document.createElement('div');
        numerusGroup.className = 'chip-group';
        ['Sg', 'Pl'].forEach(num => {
          const chip = document.createElement('button');
          chip.className = 'chip';
          chip.textContent = num + '.';
          chip.dataset.nid   = n.id;
          chip.dataset.type  = 'numerus';
          chip.dataset.value = num;
          chip.id = `chip-${n.id}-numerus-${num}`;
          chip.addEventListener('click', () => toggleChip(n.id, 'numerus', num));
          // popover
          const pop = document.createElement('span');
          pop.className = 'chip-popover';
          pop.id = `pop-${n.id}-numerus-${num}`;
          chip.appendChild(pop);
          chip.addEventListener('click', (e) => {
            if (chip.classList.contains('wrong-chip')) {
              e.stopPropagation();
              pop.classList.toggle('show');
            }
          });
          numerusGroup.appendChild(chip);
        });
        groups.appendChild(numerusGroup);

        row.appendChild(groups);

        // Lösungs-Label (wird nach 3. Versuch eingeblendet)
        const solLabel = document.createElement('span');
        solLabel.className = 'solution-label';
        solLabel.id = 'sol-' + n.id;
        row.appendChild(solLabel);

        container.appendChild(row);
      });

      // ── Chip toggle ───────────────────────────────────────────────────────────
      function toggleChip(nid, type, value) {
        if (locked) return;

        if (type === 'kasus') {
          // Multi-select: an/aus
          const set = state[nid].kasus;
          if (set.has(value)) {
            set.delete(value);
            document.getElementById(`chip-${nid}-kasus-${value}`).classList.remove('selected');
          } else {
            set.add(value);
            document.getElementById(`chip-${nid}-kasus-${value}`).classList.add('selected');
          }
        } else {
          // Numerus: Radio
          const current = state[nid].numerus;
          if (current === value) {
            state[nid].numerus = null;
            document.getElementById(`chip-${nid}-numerus-${value}`).classList.remove('selected');
          } else {
            if (current) {
              document.getElementById(`chip-${nid}-numerus-${current}`).classList.remove('selected');
            }
            state[nid].numerus = value;
            document.getElementById(`chip-${nid}-numerus-${value}`).classList.add('selected');
          }
        }
      }

      // ── Check ─────────────────────────────────────────────────────────────────
      const checkBtn = document.getElementById('checkBtn');
      checkBtn.onclick = checkAnswers;

      function checkAnswers() {
        if (locked || tries >= 3) return;

        const anySelected = nouns.some(n => state[n.id].kasus.size > 0 || state[n.id].numerus);
        if (!anySelected) {
          showFeedback('warn', 'Wähle zuerst Kasus und Numerus für mindestens ein Substantiv.');
          return;
        }

        tries++;
        document.getElementById('dot' + tries).classList.add('used');

        // Hilfsfunktion: welche Kasus-Werte sind für dieses Substantiv richtig?
        // und welcher Numerus?
        function correctKasusSet(n) { return new Set(n.correct.map(c => c[0])); }
        function correctNumerus(n) {
          // Alle richtigen Numerus-Werte (bei otium/officia/fratres immer gleich)
          const nums = new Set(n.correct.map(c => c[1]));
          return nums; // Set, meist nur ein Wert
        }

        // Bewerte alle Chips für alle Substantive
        function evalAllChips() {
          let totalPoints = 0;
          const chipResults = {}; // nid → { kasus: {Nom: bool|null, Akk: bool|null}, numerus: {Sg: bool|null, Pl: bool|null} }
          // null = neutral (nicht markiert, nicht erwartet)
          // true = korrekt (grün)
          // false = falsch (gelb)

          nouns.forEach(n => {
            const sel = state[n.id];
            const expKasus   = correctKasusSet(n);
            const expNumerus = correctNumerus(n);

            chipResults[n.id] = { kasus: {}, numerus: {} };

            ['Nom', 'Akk'].forEach(k => {
              const selected = sel.kasus.has(k);
              const expected = expKasus.has(k);
              if (selected && expected)       chipResults[n.id].kasus[k] = true;
              else if (selected && !expected) chipResults[n.id].kasus[k] = false;
              else if (!selected && expected) chipResults[n.id].kasus[k] = false;
              else                            chipResults[n.id].kasus[k] = null;
            });

            ['Sg', 'Pl'].forEach(num => {
              const selected = sel.numerus === num;
              const expected = expNumerus.has(num);
              if (selected && expected)       chipResults[n.id].numerus[num] = true;
              else if (selected && !expected) chipResults[n.id].numerus[num] = false;
              else if (!selected && expected) chipResults[n.id].numerus[num] = false;
              else                            chipResults[n.id].numerus[num] = null;
            });
          });
          return { chipResults };
        }

        const { chipResults } = evalAllChips();
        const maxPoints = nouns.length * 4 * 0.25; // 8 Substantive × 4 Chips × 0.25
        const allOk  = nouns.every(n =>
          ['Nom','Akk'].every(k => chipResults[n.id].kasus[k] !== false) &&
          ['Sg','Pl'].every(num => chipResults[n.id].numerus[num] !== false)
        );
        const doLock = tries >= 3 || allOk;

        // Punkte: 0.5 pro vollständig richtig bestimmtem Substantiv
        let totalPoints = 0;
        nouns.forEach(n => {
          const nounOk = ['Nom','Akk'].every(k => chipResults[n.id].kasus[k] !== false) &&
                         ['Sg','Pl'].every(num => chipResults[n.id].numerus[num] !== false);
          if (nounOk) totalPoints += 0.5;
        });

        if (doLock) {
          locked = true;

          // Alle Chips grün/gelb markieren
          nouns.forEach(n => {
            const sel = state[n.id];
            ['Nom', 'Akk'].forEach(k => {
              const res = chipResults[n.id].kasus[k];
              if (res === true)  { markChip(n.id, 'kasus', k, 'correct-chip'); }
              else if (res === false) {
                markChip(n.id, 'kasus', k, 'wrong-chip');
                const pop = document.getElementById(`pop-${n.id}-kasus-${k}`);
                if (pop) pop.textContent = sel.kasus.has(k) ? 'Löschen' : k + '.';
              }
            });
            ['Sg', 'Pl'].forEach(num => {
              const res = chipResults[n.id].numerus[num];
              if (res === true)  { markChip(n.id, 'numerus', num, 'correct-chip'); }
              else if (res === false) {
                markChip(n.id, 'numerus', num, 'wrong-chip');
                const pop = document.getElementById(`pop-${n.id}-numerus-${num}`);
                if (pop) pop.textContent = (sel.numerus === num) ? 'Löschen' : num + '.';
              }
            });
            lockRow(n.id);
            // Lösungstext einblenden wenn nicht alles korrekt
            const nAllOk = ['Nom','Akk'].every(k => chipResults[n.id].kasus[k] !== false) &&
                           ['Sg','Pl'].every(num => chipResults[n.id].numerus[num] !== false);
            if (!nAllOk) showSolutionLabel(n);
          });

          save(allOk, totalPoints);
        }

        if (allOk) {
          showFeedback('ok', 'Ausgezeichnet! Alle Formen richtig bestimmt!');
          checkBtn.classList.add('success');
          checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
          checkBtn.onclick = () => window.location.href = NEXT;
        } else if (tries === 1) {
          showFeedback('warn', 'Das ist noch nicht richtig!');
        } else if (tries === 2) {
          showFeedback('warn', 'Du hast noch einen Versuch übrig!');
        } else {
          showFeedback('warn', 'Die richtigen Lösungen sind nun markiert.');
          checkBtn.classList.add('partial');
          checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
          checkBtn.onclick = () => window.location.href = NEXT;
        }
      }

      function showSolutionLabel(n) {
        const label = document.getElementById('sol-' + n.id);
        if (!label) return;
        const text = n.correct.map(c => c[0] + '. ' + c[1] + '.').join(' / ');
        label.innerHTML = 'Lösung: <strong>' + text + '</strong>';
        label.classList.add('show');
      }
      function markChip(nid, type, value, cls) {
        const chip = document.getElementById(`chip-${nid}-${type}-${value}`);
        if (!chip) return;
        chip.classList.remove('selected', 'wrong-chip', 'correct-chip');
        chip.classList.add(cls);
        const pop = document.getElementById(`pop-${nid}-${type}-${value}`);
        if (pop) pop.textContent = cls === 'wrong-chip' ? 'Löschen' : '';
      }
      function unmarkChip(nid, type, value) {
        const chip = document.getElementById(`chip-${nid}-${type}-${value}`);
        if (chip) { chip.classList.remove('wrong-chip', 'correct-chip'); chip.classList.add('selected'); }
      }
      function lockRow(nid) {
        document.querySelectorAll(`[data-nid="${nid}"]`).forEach(c => c.classList.add('locked'));
      }

      // ── Save / Restore ────────────────────────────────────────────────────────
      function lsSet(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
      function lsGet(k){ try{return localStorage.getItem(k)}catch(e){return null} }

      function save(done, totalPoints) {
        const vals = {};
        nouns.forEach(n => { vals[n.id] = { kasus: [...state[n.id].kasus], numerus: state[n.id].numerus }; });
        lsSet(KEY,               done ? 'done' : 'attempted');
        lsSet(KEY + '_vals',     JSON.stringify(vals));
        lsSet(KEY + '_attempts', tries);
        lsSet(KEY + '_points',   +totalPoints.toFixed(2));
        lsSet(KEY + '_date',     new Date().toLocaleDateString('de-DE'));
        if (!done) lsSet(KEY + '_fail', 'true');
      }

      (function restore() {
        const savedDone  = lsGet(KEY) === 'done';
        const savedFail  = lsGet(KEY + '_fail') === 'true';
        const savedVals  = lsGet(KEY + '_vals');
        const savedTries = parseInt(lsGet(KEY + '_attempts') || '0');
        if (!savedVals || (!savedDone && !savedFail)) return;

        const vals = JSON.parse(savedVals);
        tries  = savedTries;
        locked = true;

        for (let i = 1; i <= savedTries; i++) {
          const d = document.getElementById('dot' + i);
          if (d) d.classList.add('used');
        }

        nouns.forEach(n => {
          const saved = vals[n.id] || { kasus: [], numerus: null };
          state[n.id] = { kasus: new Set(saved.kasus), numerus: saved.numerus };
          const sel = state[n.id];

          const expKasus   = new Set(n.correct.map(c => c[0]));
          const expNumerus = new Set(n.correct.map(c => c[1]));

          ['Nom', 'Akk'].forEach(k => {
            const selected = sel.kasus.has(k);
            const expected = expKasus.has(k);
            if (selected && expected)        markChip(n.id, 'kasus', k, 'correct-chip');
            else if (selected && !expected)  { markChip(n.id, 'kasus', k, 'wrong-chip'); const p = document.getElementById(`pop-${n.id}-kasus-${k}`); if(p) p.textContent='Löschen'; }
            else if (!selected && expected)  { markChip(n.id, 'kasus', k, 'wrong-chip'); const p = document.getElementById(`pop-${n.id}-kasus-${k}`); if(p) p.textContent=k+'.'; }
          });
          ['Sg', 'Pl'].forEach(num => {
            const selected = sel.numerus === num;
            const expected = expNumerus.has(num);
            if (selected && expected)        markChip(n.id, 'numerus', num, 'correct-chip');
            else if (selected && !expected)  { markChip(n.id, 'numerus', num, 'wrong-chip'); const p = document.getElementById(`pop-${n.id}-numerus-${num}`); if(p) p.textContent='Löschen'; }
            else if (!selected && expected)  { markChip(n.id, 'numerus', num, 'wrong-chip'); const p = document.getElementById(`pop-${n.id}-numerus-${num}`); if(p) p.textContent=num+'.'; }
          });

          const nAllOk = ['Nom','Akk'].every(k => {
            const selected = sel.kasus.has(k); const expected = expKasus.has(k);
            return !((selected && !expected) || (!selected && expected));
          }) && ['Sg','Pl'].every(num => {
            const selected = sel.numerus === num; const expected = expNumerus.has(num);
            return !((selected && !expected) || (!selected && expected));
          });
          if (!nAllOk) showSolutionLabel(n);
          lockRow(n.id);
        });

        if (savedDone) {
          showFeedback('ok', 'Ausgezeichnet! Alle Formen richtig bestimmt!');
          checkBtn.classList.add('success');
        } else {
          showFeedback('warn', 'Die richtigen Lösungen sind nun markiert.');
          checkBtn.classList.add('partial');
        }
        checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
        checkBtn.onclick = () => window.location.href = NEXT;
      })();

      // ── Feedback ──────────────────────────────────────────────────────────────
      function showFeedback(type, text) {
        const fb = document.getElementById('feedback');
        fb.className = 'feedback show ' + type;
        document.getElementById('feedbackIcon').innerHTML = type === 'ok'
          ? '<polyline points="20 6 9 17 4 12"/>'
          : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
        document.getElementById('feedbackText').textContent = text;
      }

      // ── Bell & Dropdown ───────────────────────────────────────────────────────
      function handleBell()    { alert('Keine neuen Benachrichtigungen.'); }
      function toggleDropdown(){ document.getElementById('dropdown').classList.toggle('open'); }
      function closeDropdown() { document.getElementById('dropdown').classList.remove('open'); }
      document.addEventListener('click', e => {
        if (!document.querySelector('.user-wrap').contains(e.target)) closeDropdown();
      });
    </script>
  </body>
</html>
