<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Willkommen im alten Rom!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Lora:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-gutter: stable; }

  :root {
    --bg:      #f8f8f6;
    --white:   #ffffff;
    --border:  #E6E4DF;
    --text:    #111111;
    --muted:   #898783;
    --accent:  #c6613f;
    --green:   #4CAF50;
    --yellow:  #F5A623;
    --radius:  14px;
  }

  body {
    font-family: 'Noto Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 5rem 1.5rem 3rem;
    color: var(--text);
  }

  /* ── Header ── */
  header {
    position: fixed; top: 0; left: 0; right: 0;
    height: 56px; background: var(--white);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem; z-index: 200;
  }
  .sitename { font-size: 19px; font-weight: 700; color: #111; font-family: 'Lora', serif; letter-spacing: -0.4px; display: flex; align-items: center; gap: 6px; }
  .sitename a { color: inherit; text-decoration: none; }
  .sitename .sep { color: #CCCCCC; font-family: 'Noto Sans', sans-serif; font-weight: 400; font-size: 17px; }
  .sitename .sub { font-size: 12px; font-weight: 600; color: #555; font-family: 'Noto Sans', sans-serif; }
  .topbar { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 12px; border: 1px solid transparent; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; position: relative; outline: none; flex-shrink: 0; }
  .icon-btn:hover { transform: scale(1.08); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 16px; height: 16px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bell-btn svg { stroke: #898783; }
  .bell-btn.has-notification { background: #c6613f; }
  .bell-btn.has-notification svg { stroke: #fff; }
  .bell-btn .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: #CC3300; border-radius: 50%; border: 1.5px solid var(--white); }
  @keyframes ring { 0%,100%{transform:rotate(0)} 15%{transform:rotate(14deg)} 30%{transform:rotate(-12deg)} 45%{transform:rotate(8deg)} 60%{transform:rotate(-5deg)} 75%{transform:rotate(3deg)} }
  .bell-btn:hover svg { animation: ring 0.55s ease; transform-origin: 50% 3px; }
  .user-btn svg { stroke: #898783; }
  .user-wrap { position: relative; }
  .dropdown { display: none; position: absolute; top: 44px; right: 0; background: var(--white); border: 1px solid #E0E0E0; border-radius: 10px; min-width: 190px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,0.10); }
  .dropdown.open { display: block; animation: dropIn 0.15s ease; }
  @keyframes dropIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
  .dropdown-header { padding: 13px 16px 9px; border-bottom: 1px solid #E8E8E8; background: #F9F9F9; }
  .dropdown-name { font-size: 14px; font-weight: 600; color: #111; }
  .dropdown-email { font-size: 12px; color: #888; margin-top: 2px; }
  .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 14px; color: #111; cursor: pointer; border: none; background: none; width: 100%; font-family: 'Noto Sans', sans-serif; transition: background 0.12s; text-align: left; }
  .dropdown-item:hover { background: #F4F4F4; }
  .dropdown-item svg { width: 15px; height: 15px; stroke: #555; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .dropdown-sep-line { height: 1px; background: #E8E8E8; }
  .dropdown-item.danger { color: #CC3300; }
  .dropdown-item.danger svg { stroke: #CC3300; }

  /* ── Page ── */
  .page-wrap { max-width: 780px; margin: 0 auto; }
  .page-header { margin-bottom: 1.5rem; }
  .page-header h1 { font-family: 'Lora', serif; font-size: clamp(20px, 4vw, 26px); font-weight: 700; color: var(--text); letter-spacing: -0.4px; margin-bottom: 4px; }
  .page-header p { font-size: 14px; color: var(--muted); }

  /* ── Task card ── */
  .task-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: visible; }
  .task-header { padding: 20px 22px 16px; border-bottom: 1px solid var(--border); }
  .task-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; font-family: 'Lora', serif; }
  .task-instruction { font-size: 14px; color: var(--muted); line-height: 1.6; }

  /* ── Task content ── */
  .task-content { padding: 24px 22px; }

  /* Items grid */
  .items-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }

  .item-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: relative;
  }

  .item-img {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-size: 11px; color: var(--muted); text-align: center;
  }
  .item-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }



  /* Drop slot */
  .slot {
    width: 100%;
    min-height: 36px;
    border: 1.5px dashed #D0CEC9;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #C0BEB9;
    transition: border-color 0.2s, background 0.2s;
    cursor: pointer;
    position: relative;
    padding: 4px 6px;
    text-align: center;
    line-height: 1.3;
  }
  .slot.drag-over { border-color: var(--accent); background: rgba(198,97,63,0.05); }
  .slot.filled { border-style: solid; border-color: var(--border); background: var(--bg); font-size: 11px; color: var(--text); font-weight: 600; cursor: pointer; }
  .slot.correct { border-color: var(--green) !important; border-width: 2px; }
  .slot.wrong { border-color: var(--yellow) !important; border-width: 2px; cursor: pointer; }

  /* Slot badge */
  .slot-badge {
    position: absolute;
    top: -8px; right: -8px;
    width: 18px; height: 18px;
    border-radius: 50%;
    display: none;
    align-items: center; justify-content: center;
    z-index: 10;
  }
  .slot-badge.show { display: flex; }
  .slot-badge.ok { background: var(--green); }
  .slot-badge.fail { background: var(--yellow); }
  .slot-badge svg { width: 10px; height: 10px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  /* Popover */
  .slot-popover {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%; transform: translateX(-50%);
    background: #111;
    color: #fff;
    font-size: 11px; font-weight: 600;
    padding: 6px 10px;
    border-radius: 8px;
    white-space: nowrap;
    z-index: 50;
    pointer-events: none;
    animation: fadeUp 0.15s ease;
  }
  .slot-popover::after {
    content: '';
    position: absolute;
    top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #111;
  }
  .slot-popover.show { display: block; }
  @keyframes fadeUp { from{opacity:0;transform:translateX(-50%) translateY(4px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

  /* Chip pool */
  .chip-pool-label {
    font-size: 12px; font-weight: 600; color: var(--muted);
    margin-bottom: 10px; letter-spacing: 0.3px;
  }
  .chip-pool {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 16px;
    background: #EFEEEB;
    border: 1px solid var(--border);
    border-radius: 10px;
    min-height: 56px;
    align-content: flex-start;
  }

  .chip.used {
    visibility: hidden;
    pointer-events: none;
  }

  .chip {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px; font-weight: 600;
    color: var(--text);
    cursor: grab;
    user-select: none;
    transition: box-shadow 0.15s, transform 0.15s, opacity 0.15s;
    white-space: nowrap;
  }
  .chip:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); transform: translateY(-1px); }
  .chip.dragging { opacity: 1; cursor: grabbing; }
  .chip.selected { border-color: var(--accent); background: rgba(198,97,63,0.06); box-shadow: 0 0 0 2px rgba(198,97,63,0.2); }
  /* .chip.used is handled below with visibility: hidden */

  /* ── Feedback ── */
  .feedback {
    display: none; margin: 0 22px 16px;
    padding: 12px 14px; border-radius: 10px;
    font-size: 14px; font-weight: 500;
    align-items: center; gap: 8px;
  }
  .feedback.show { display: flex; }
  .feedback.warn { background: #FFF8ED; color: #b45309; border: 1px solid #FDE68A; }
  .feedback.ok { background: #EDF7ED; color: #2E7D32; border: 1px solid #C8E6C9; }
  .feedback svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ── Task footer ── */
  .task-footer {
    padding: 16px 22px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center;
    justify-content: flex-end; gap: 16px;
  }
  .attempts-wrap { display: flex; gap: 5px; align-items: center; }
  .attempt-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #D0CEC9; background: transparent; transition: background 0.2s, border-color 0.2s; }
  .attempt-dot.used { background: var(--muted); border-color: var(--muted); }

  .check-btn {
    background: #111; color: #fff;
    border: none; border-radius: 10px;
    padding: 9px 20px; font-size: 14px; font-weight: 600;
    font-family: 'Noto Sans', sans-serif;
    cursor: pointer; transition: background 0.15s, transform 0.15s;
    display: flex; align-items: center; gap: 6px;
  }
  .check-btn:hover { background: #333; transform: translateY(-1px); }
  .check-btn:active { transform: scale(0.97); }
  .check-btn:disabled { opacity: 0.4; cursor: default; transform: none; }
  .check-btn.success { background: #4CAF50; }
  .check-btn.partial { background: #F5A623; }
  .check-btn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  .chip-pool-float {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    z-index: 150;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 10px 22px 14px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    display: none;
  }

  .chip-pool-float.visible { display: block; }

  .chip-pool-float .chip-pool-label { margin-bottom: 8px; }

  @media (max-width: 600px) {
    .items-grid { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .item-label { font-size: 9px; }
    .chip { font-size: 11px; padding: 4px 9px; }
    body { padding: 4.5rem 1rem 2rem; }
    .task-content { padding: 16px 14px; }
    .task-footer { padding: 12px 14px; }
    .task-header { padding: 16px 14px 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="sitename">
    <a href="lektionsuebersicht.html">Latein*</a>
    <span class="sep">›</span>
    <a href="lektionsalve.html" class="sub">Lektion Salve</a>
    <span class="sep">›</span>
    <span class="sub">Willkommen im alten Rom!</span>
  </div>
  <div class="topbar">
    <button class="icon-btn bell-btn" title="Benachrichtigungen" onclick="handleBell()">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="dot" id="bellDot"></span>
    </button>
    <div class="user-wrap">
      <button class="icon-btn user-btn" title="Benutzerprofil" onclick="toggleDropdown()">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <div class="dropdown" id="dropdown">
        <div class="dropdown-header">
          <div class="dropdown-name">Max Mustermann</div>
          <div class="dropdown-email">max@beispiel.de</div>
        </div>
        <button class="dropdown-item" onclick="closeDropdown()">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil
        </button>
        <button class="dropdown-item" onclick="closeDropdown()">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Einstellungen
        </button>
        <div class="dropdown-sep-line"></div>
        <button class="dropdown-item danger" onclick="closeDropdown()">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Abmelden
        </button>
      </div>
    </div>
  </div>
</header>

<div class="page-wrap">
<div class="task-card">
    <div class="task-header">
      <div class="task-title">Willkommen im alten Rom!</div>
      <div class="task-instruction">Stelle Vermutungen an, welche Gegenstände die Römer anstelle der folgenden modernen Gegenstände verwendeten. Ziehe die richtigen Chips in die Felder unter den Bildern.</div>
    </div>

    <div class="task-content">
      <div class="items-grid" id="itemsGrid"></div>
      <div class="chip-pool" id="chipPool"></div>
    </div>

    <div class="feedback" id="feedback">
      <svg id="feedbackIcon" viewBox="0 0 24 24"></svg>
      <span id="feedbackText"></span>
    </div>

    <div class="task-footer">
      <div class="attempts-wrap">
        <div class="attempt-dot" id="dot1"></div>
        <div class="attempt-dot" id="dot2"></div>
        <div class="attempt-dot" id="dot3"></div>
      </div>
      <button class="check-btn" id="checkBtn" onclick="checkAnswers()">Überprüfen</button>
    </div>
  </div>
</div>

<script>
  const items = [
    { label: 'Glühbirne',     img: 'images/gluehbirne.jpg',     answer: 'Kerze' },
    { label: 'Heizung',       img: 'images/heizung.jpg',        answer: 'Kohlebecken' },
    { label: 'Herd',          img: 'images/herd.jpg',           answer: 'Offenes Feuer' },
    { label: 'Spielkonsole',  img: 'images/spielkonsole.jpg',   answer: 'Nüsse, Bälle' },
    { label: 'Staubsauger',   img: 'images/staubsauger.jpg',    answer: 'Besen' },
    { label: 'Waschmaschine', img: 'images/waschmaschine.jpg',  answer: 'Bottich, Waschbrett' },
    { label: 'Uhr',           img: 'images/uhr.jpg',            answer: 'Sonnenuhr' },
    { label: 'Buch',          img: 'images/buch.jpg',           answer: 'Buchrolle' },
    { label: 'Auto',          img: 'images/auto.jpg',           answer: 'Kutsche' },
    { label: 'Kugelschreiber',img: 'images/kugelschreiber.jpg', answer: 'Griffel, Schreibfeder' },
  ];

  // ── State ────────────────────────────────────────────────────────────────
  // slotState[i] = chip-text currently placed in slot i, or null
  const slotState = new Array(items.length).fill(null);

  const chipTexts = ['Sonnenuhr','Buchrolle','Besen','Nüsse, Bälle','Bottich, Waschbrett','Offenes Feuer','Kerze','Kutsche','Griffel, Schreibfeder','Kohlebecken'];

  let attempts = 0;
  let revealed = false;
  let locked = false;
  let dragSource = null;   // { type: 'pool'|'slot', index?: number, text: string }

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const pool = document.getElementById('chipPool');
  const slotEls = []; // filled after buildGrid()

  // ── Build grid ────────────────────────────────────────────────────────────
  const grid = document.getElementById('itemsGrid');
  items.forEach((item, i) => {
    const col = document.createElement('div');
    col.className = 'item-col';
    col.innerHTML = `
      <div class="item-img"><img src="${item.img}" alt="${item.label}" onerror="this.parentNode.innerHTML='<span>${item.label}</span>'"></div>
      <div class="slot" id="slot-${i}">
        <span class="slot-badge" id="badge-${i}"></span>
        <span class="slot-popover" id="popover-${i}">${item.answer}</span>
        <span class="slot-text">—</span>
      </div>
    `;
    grid.appendChild(col);
    const slot = col.querySelector('.slot');

    // Mouse drop target
    slot.addEventListener('dragover', e => {
      if (locked || !dragSource) return;
      e.preventDefault();
      slot.classList.add('drag-over');
    });
    slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
    slot.addEventListener('drop', e => {
      e.preventDefault();
      slot.classList.remove('drag-over');
      if (!dragSource || locked || revealed) return;
      dropOnSlot(i);
    });

    // Reveal popover on tap after check
    slot.addEventListener('click', () => {
      if (revealed && slotEls[i].classList.contains('wrong')) {
        document.getElementById('popover-' + i).classList.toggle('show');
      }
    });

    slotEls.push(slot);
  });

  // ── Build chip pool ───────────────────────────────────────────────────────
  chipTexts.forEach(text => {
    pool.appendChild(makeChipEl(text));
  });

  function makeChipEl(text) {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = text;
    chip.draggable = true;
    chip.dataset.text = text;

    // Mouse drag from pool
    chip.addEventListener('dragstart', e => {
      if (locked) { e.preventDefault(); return; }
      dragSource = { type: 'pool', text };
      chip.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', text);
    });
    chip.addEventListener('dragend', () => {
      chip.classList.remove('dragging');
      dragSource = null;
    });

    // Touch drag from pool
    addTouchDrag(chip, { type: 'pool', text });

    return chip;
  }

  // ── Core logic ─────────────────────────────────────────────────────────────
  function placeOnSlot(text, fromSlotIndex, targetIndex) {
    if (fromSlotIndex !== undefined && fromSlotIndex !== null) clearSlot(fromSlotIndex);
    if (slotState[targetIndex] !== null) returnChipToPool(slotState[targetIndex]);
    removeChipFromPool(text);
    slotState[targetIndex] = text;
    renderSlot(targetIndex);
  }

  function dropOnSlot(targetIndex) {
    if (!dragSource) return;
    if (dragSource.type === 'pool') {
      placeOnSlot(dragSource.text, null, targetIndex);
    } else {
      placeOnSlot(dragSource.text, dragSource.fromSlot, targetIndex);
    }
    dragSource = null;
  }

  // ── Slot drag-out (mouse) ─────────────────────────────────────────────────
  slotEls.forEach((slot, i) => {
    slot.addEventListener('dragstart', e => {
      if (locked || slotState[i] === null) { e.preventDefault(); return; }
      dragSource = { type: 'slot', fromSlot: i, text: slotState[i] };
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', slotState[i]);
      slot.classList.add('dragging');
    });
    slot.addEventListener('dragend', () => {
      slot.classList.remove('dragging');
      dragSource = null;
    });
    slot.draggable = true;

    // Touch drag from slot
    addTouchDrag(slot, null, i);
  });

  // Allow dropping back to pool (mouse)
  pool.addEventListener('dragover', e => {
    if (locked || !dragSource || dragSource.type !== 'slot') return;
    e.preventDefault();
    pool.style.background = 'rgba(198,97,63,0.05)';
  });
  pool.addEventListener('dragleave', () => { pool.style.background = ''; });
  pool.addEventListener('drop', e => {
    e.preventDefault();
    pool.style.background = '';
    if (!dragSource || dragSource.type !== 'slot' || locked) return;
    const { fromSlot, text } = dragSource;
    clearSlot(fromSlot);
    returnChipToPool(text);
    dragSource = null;
  });

  // ── Touch drag implementation ─────────────────────────────────────────────
  // ghost element that follows the finger
  let touchGhost = null;
  let touchDragSource = null;

  // elem: the chip or slot element
  // poolSource: { type:'pool', text } if from pool, else null (slot source derived from slotIndex)
  // slotIndex: index if this is a slot, else undefined
  function addTouchDrag(elem, poolSource, slotIndex) {
    elem.addEventListener('touchstart', e => {
      if (locked) return;

      // Determine what we're dragging
      if (poolSource) {
        // Chip from pool
        if (elem.classList.contains('used')) return;
        touchDragSource = { type: 'pool', text: poolSource.text };
      } else {
        // Slot — only start drag if filled
        if (slotState[slotIndex] === null) return;
        touchDragSource = { type: 'slot', fromSlot: slotIndex, text: slotState[slotIndex] };
      }

      e.preventDefault(); // prevent scroll while dragging

      const touch = e.touches[0];

      // Create ghost chip that follows the finger
      touchGhost = elem.cloneNode(true);
      touchGhost.classList.remove('used');
      touchGhost.style.cssText = `
        position: fixed;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.85;
        transform: scale(1.08);
        transition: none;
        left: ${touch.clientX - elem.offsetWidth / 2}px;
        top:  ${touch.clientY - elem.offsetHeight / 2}px;
        width: ${elem.offsetWidth}px;
        margin: 0;
      `;
      document.body.appendChild(touchGhost);
      elem.classList.add('dragging');
    }, { passive: false });

    elem.addEventListener('touchmove', e => {
      if (!touchGhost || !touchDragSource) return;
      e.preventDefault();
      const touch = e.touches[0];
      touchGhost.style.left = (touch.clientX - touchGhost.offsetWidth / 2) + 'px';
      touchGhost.style.top  = (touch.clientY - touchGhost.offsetHeight / 2) + 'px';

      // Highlight slot under finger
      touchGhost.style.pointerEvents = 'none';
      const under = document.elementFromPoint(touch.clientX, touch.clientY);
      slotEls.forEach(s => s.classList.remove('drag-over'));
      const slotEl = under && under.closest('.slot');
      if (slotEl) slotEl.classList.add('drag-over');

      // Highlight pool if dragging from slot
      if (touchDragSource.type === 'slot') {
        const onPool = under && (under === pool || pool.contains(under));
        pool.style.background = onPool ? 'rgba(198,97,63,0.05)' : '';
      }
    }, { passive: false });

    elem.addEventListener('touchend', e => {
      if (!touchGhost || !touchDragSource) return;
      e.preventDefault();

      const touch = e.changedTouches[0];
      touchGhost.style.pointerEvents = 'none';
      const under = document.elementFromPoint(touch.clientX, touch.clientY);

      // Clean up visual state
      slotEls.forEach(s => s.classList.remove('drag-over'));
      pool.style.background = '';
      document.body.removeChild(touchGhost);
      touchGhost = null;
      elem.classList.remove('dragging');

      if (!under || revealed) { touchDragSource = null; return; }

      // Drop on a slot?
      const targetSlotEl = under.closest('.slot');
      if (targetSlotEl) {
        const targetIndex = slotEls.indexOf(targetSlotEl);
        if (targetIndex !== -1) {
          dragSource = touchDragSource;
          dropOnSlot(targetIndex);
        }
      }

      // Drop back on pool (slot → pool)?
      if (touchDragSource.type === 'slot' && (under === pool || pool.contains(under))) {
        clearSlot(touchDragSource.fromSlot);
        returnChipToPool(touchDragSource.text);
      }

      touchDragSource = null;
      dragSource = null;
    }, { passive: false });
  }

  // ── Render helpers ─────────────────────────────────────────────────────────
  function renderSlot(i) {
    const slot = slotEls[i];
    const text = slotState[i];
    if (text) {
      slot.classList.add('filled');
      slot.querySelector('.slot-text').textContent = text;
    } else {
      slot.classList.remove('filled');
      slot.querySelector('.slot-text').textContent = '—';
    }
  }

  function clearSlot(i) {
    slotState[i] = null;
    renderSlot(i);
  }

  function removeChipFromPool(text) {
    const chip = [...pool.querySelectorAll('.chip')].find(c => c.dataset.text === text);
    if (chip) chip.classList.add('used');
  }

  function returnChipToPool(text) {
    const chip = [...pool.querySelectorAll('.chip')].find(c => c.dataset.text === text);
    if (chip) chip.classList.remove('used');
  }

  // ── Check & reveal ─────────────────────────────────────────────────────────
  function checkAnswers() {
    if (revealed) return;
    const allFilled = slotState.every(s => s !== null);
    if (!allFilled) {
      showFeedback('warn', 'Fülle zuerst alle Felder aus!');
      return;
    }

    attempts++;
    document.getElementById('dot' + attempts).classList.add('used');

    const allCorrect = slotState.every((text, i) => text === items[i].answer);

    if (allCorrect) {
      revealResult(true);
      showFeedback('ok', 'Ausgezeichnet! Alle Antworten sind richtig!');
      winState();
      return;
    }

    if (attempts < 3) {
      showFeedback('warn', 'Das ist noch nicht richtig. Versuche es nochmal!');
      return;
    }

    // 3rd failed attempt
    revealed = true;
    const slotStateFail = slotState.map((text, i) => ({ filled: text || '', correct: text === items[i].answer }));
    localStorage.setItem('task_willkommen_slots', JSON.stringify(slotStateFail));
    localStorage.setItem('task_willkommen_fail', 'true');
    localStorage.setItem('task_willkommen_attempts', 3);
    const pointsScoredFail = slotState.filter((text, i) => text === items[i].answer).length * 0.5;
    localStorage.setItem('task_willkommen_points', pointsScoredFail);
    localStorage.setItem('task_willkommen_date', new Date().toLocaleDateString('de-DE'));
    // Show badges
    slotState.forEach((text, i) => {
      const correct = text === items[i].answer;
      slotEls[i].classList.add(correct ? 'correct' : 'wrong');
      const badge = document.getElementById('badge-' + i);
      badge.classList.add('show', correct ? 'ok' : 'fail');
      badge.innerHTML = correct
        ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
        : '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>';
    });
    showFeedback('warn', 'Klicke auf die gelb umrandeten Felder um die richtige Lösung zu sehen.');
    const failBtn = document.getElementById('checkBtn');
    failBtn.classList.add('partial');
    failBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
    failBtn.disabled = false;
    failBtn.onclick = () => window.location.href = 'eine-roemische-familie.html';
    lockAll();
  }

  function revealResult(allCorrect) {
    slotEls.forEach((slot, i) => {
      slot.classList.add('correct');
      const badge = document.getElementById('badge-' + i);
      badge.classList.add('show', 'ok');
      badge.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
    });
  }

  function winState() {
    lockAll();
    revealed = true;
    const pointsScored = slotState.filter((text, i) => text === items[i].answer).length * 0.5;
    const saveData = slotState.map((text, i) => ({ filled: text || '', correct: text === items[i].answer }));
    localStorage.setItem('task_willkommen_slots', JSON.stringify(saveData));
    localStorage.setItem('task_willkommen', 'done');
    localStorage.setItem('task_willkommen_points', pointsScored);
    localStorage.removeItem('task_willkommen_fail');
    localStorage.setItem('task_willkommen_date', new Date().toLocaleDateString('de-DE'));
    localStorage.setItem('task_willkommen_attempts', attempts);
    const btn = document.getElementById('checkBtn');
    btn.classList.add('success');
    btn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
    btn.onclick = () => window.location.href = 'eine-roemische-familie.html';
    btn.disabled = false;
  }

  function lockAll() {
    locked = true;
    document.querySelectorAll('.chip').forEach(c => { c.draggable = false; c.style.cursor = 'default'; });
    slotEls.forEach(s => { s.draggable = false; });
  }

  function showFeedback(type, text) {
    const fb = document.getElementById('feedback');
    const icon = document.getElementById('feedbackIcon');
    const txt = document.getElementById('feedbackText');
    fb.className = 'feedback show ' + type;
    icon.innerHTML = type === 'ok'
      ? '<polyline points="20 6 9 17 4 12"/>'
      : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
    txt.textContent = text;
  }

  // ── Floating chip pool on scroll ─────────────────────────────────────────
  const poolEl = document.getElementById('chipPool');
  const floatEl = document.getElementById('chipPoolFloat');
  const floatInner = document.getElementById('chipPoolFloatInner');
  let lastScrollY = window.scrollY;
  let poolOriginalTop = null;

  function syncFloatPool() {
    floatInner.innerHTML = '';
    pool.querySelectorAll('.chip:not(.used)').forEach(chip => {
      const clone = chip.cloneNode(true);
      clone.addEventListener('dragstart', e => {
        if (locked) { e.preventDefault(); return; }
        dragSource = { type: 'pool', text: chip.dataset.text };
        chip.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', chip.dataset.text);
      });
      clone.addEventListener('dragend', () => { chip.classList.remove('dragging'); dragSource = null; });
      floatInner.appendChild(clone);
    });
  }

  window.addEventListener('scroll', () => {
    if (poolOriginalTop === null) poolOriginalTop = poolEl.getBoundingClientRect().top + window.scrollY;
    const scrollY = window.scrollY;
    const scrollingUp = scrollY < lastScrollY;
    const poolPastTop = poolOriginalTop < scrollY + 120;
    if (scrollingUp && poolPastTop) { floatEl.classList.add('visible'); syncFloatPool(); }
    else if (!poolPastTop) floatEl.classList.remove('visible');
    lastScrollY = scrollY;
  }, { passive: true });

  // ── Bell & dropdown ───────────────────────────────────────────────────────
  function handleBell() { alert('Keine neuen Benachrichtigungen.'); }
  function toggleDropdown() { document.getElementById('dropdown').classList.toggle('open'); }
  function closeDropdown() { document.getElementById('dropdown').classList.remove('open'); }
  document.addEventListener('click', e => { if (!document.querySelector('.user-wrap').contains(e.target)) closeDropdown(); });

  // ── Restore saved state on page load ─────────────────────────────────────
  (function restoreState() {
    const savedSlots = localStorage.getItem('task_willkommen_slots');
    const savedDone  = localStorage.getItem('task_willkommen') === 'done';
    const savedFail  = localStorage.getItem('task_willkommen_fail') === 'true';
    const savedAttempts = parseInt(localStorage.getItem('task_willkommen_attempts') || '0');
    if (!savedSlots || (!savedDone && !savedFail)) return;

    const slotData = JSON.parse(savedSlots);
    slotData.forEach((s, i) => {
      if (!s.filled) return;
      slotState[i] = s.filled;
      renderSlot(i);
      removeChipFromPool(s.filled);
    });

    for (let i = 1; i <= savedAttempts; i++) {
      const d = document.getElementById('dot' + i);
      if (d) d.classList.add('used');
    }

    slotData.forEach((s, i) => {
      slotEls[i].classList.add(s.correct ? 'correct' : 'wrong');
      const badge = document.getElementById('badge-' + i);
      badge.classList.add('show', s.correct ? 'ok' : 'fail');
      badge.innerHTML = s.correct
        ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
        : '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>';
    });

    revealed = true;
    attempts = savedAttempts;
    lockAll();

    if (savedDone) {
      const btn = document.getElementById('checkBtn');
      btn.classList.add('success');
      btn.innerHTML = 'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
      btn.onclick = () => window.location.href = 'eine-roemische-familie.html';
      btn.disabled = false;
      showFeedback('ok', 'Ausgezeichnet! Alle Antworten sind richtig!');
    } else {
      const failBtn = document.getElementById('checkBtn');
      failBtn.classList.add('partial');
      failBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
      failBtn.disabled = false;
      failBtn.onclick = () => window.location.href = 'eine-roemische-familie.html';
      showFeedback('warn', 'Klicke auf die gelb umrandeten Felder um die richtige Lösung zu sehen.');
    }
  })();
</script>
<div class="chip-pool-float" id="chipPoolFloat">
  <div class="chip-pool" id="chipPoolFloatInner"></div>
</div>
