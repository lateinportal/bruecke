<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Befehl oder Verbot (1)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Lora:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scrollbar-gutter: stable;
      }

      :root {
        --bg: #f8f8f6;
        --white: #ffffff;
        --border: #e6e4df;
        --text: #111111;
        --muted: #898783;
        --green: #4caf50;
        --yellow: #f5a623;
        --blue: #2563eb;
        --radius: 14px;
      }

      body {
        font-family: "Noto Sans", sans-serif;
        background: var(--bg);
        min-height: 100vh;
        padding: 5rem 1.5rem 3rem;
        color: var(--text);
      }

      /* ── Header ── */
      header {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 56px;
        background: var(--white);
        border-bottom: 1px solid var(--border);
        display: flex; align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
        z-index: 200;
      }
      .sitename { font-size: 19px; font-weight: 700; color: #111; font-family: "Lora", serif; letter-spacing: -0.4px; display: flex; align-items: center; gap: 6px; }
      .sitename a { color: inherit; text-decoration: none; }
      .sitename .sep  { color: #cccccc; font-family: "Noto Sans", sans-serif; font-weight: 400; font-size: 17px; }
      .sitename .sep2 { color: #cccccc; font-family: "Noto Sans", sans-serif; font-weight: 400; font-size: 17px; }
      .sitename .sub  { font-size: 12px; font-weight: 600; color: #555; font-family: "Noto Sans", sans-serif; }
      .sitename .sub2 { font-size: 12px; font-weight: 600; color: #555; font-family: "Noto Sans", sans-serif; }
      .topbar { display: flex; align-items: center; gap: 8px; }
      .icon-btn { width: 34px; height: 34px; border-radius: 12px; border: 1px solid transparent; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; position: relative; outline: none; flex-shrink: 0; }
      .icon-btn:hover { transform: scale(1.08); }
      .icon-btn:active { transform: scale(0.94); }
      .icon-btn svg { width: 16px; height: 16px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .bell-btn svg { stroke: #898783; }
      .bell-btn .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: #cc3300; border-radius: 50%; border: 1.5px solid var(--white); }
      @keyframes ring { 0%,100%{transform:rotate(0)} 15%{transform:rotate(14deg)} 30%{transform:rotate(-12deg)} 45%{transform:rotate(8deg)} 60%{transform:rotate(-5deg)} 75%{transform:rotate(3deg)} }
      .bell-btn:hover svg { animation: ring 0.55s ease; transform-origin: 50% 3px; }
      .user-btn svg { stroke: #898783; }
      .user-wrap { position: relative; }
      .dropdown { display: none; position: absolute; top: 44px; right: 0; background: var(--white); border: 1px solid #e0e0e0; border-radius: 10px; min-width: 190px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,0.1); }
      .dropdown.open { display: block; animation: dropIn 0.15s ease; }
      @keyframes dropIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
      .dropdown-header { padding: 13px 16px 9px; border-bottom: 1px solid #e8e8e8; background: #f9f9f9; }
      .dropdown-name { font-size: 14px; font-weight: 600; color: #111; }
      .dropdown-email { font-size: 12px; color: #888; margin-top: 2px; }
      .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 14px; color: #111; cursor: pointer; border: none; background: none; width: 100%; font-family: "Noto Sans", sans-serif; transition: background 0.12s; text-align: left; }
      .dropdown-item:hover { background: #f4f4f4; }
      .dropdown-item svg { width: 15px; height: 15px; stroke: #555; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
      .dropdown-sep-line { height: 1px; background: #e8e8e8; }
      .dropdown-item.danger { color: #cc3300; }
      .dropdown-item.danger svg { stroke: #cc3300; }

      /* ── Page ── */
      .page-wrap { max-width: 780px; margin: 0 auto; }

      /* ── Task card ── */
      .task-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
      .task-header { padding: 20px 22px 16px; border-bottom: 1px solid var(--border); }
      .task-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; font-family: "Lora", serif; }
      .task-instruction { font-size: 14px; color: var(--muted); line-height: 1.6; }

      /* ── Task content ── */
      .task-content { padding: 22px 22px; display: flex; flex-direction: column; gap: 0; }

      /* ── Example box ── */
      .example-box {
        background: #f5f4f0;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 18px;
        line-height: 1.7;
      }
      .example-box strong { color: var(--text); }
      .example-box .lat { font-family: "Lora", serif; font-style: italic; }
      .example-box .arrow { color: #aaa; margin: 0 4px; }

      /* ── Table ── */
      .verb-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .verb-table thead th {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        padding: 0 10px 12px;
        text-align: left;
        border-bottom: 1.5px solid var(--border);
        white-space: nowrap;
      }
      .verb-table thead th:first-child { padding-left: 0; }
      .verb-table thead th.center { text-align: center; }

      .verb-table tbody tr { border-bottom: 1px solid var(--border); }
      .verb-table tbody tr:last-child { border-bottom: none; }
      .verb-table tbody td { padding: 14px 10px; vertical-align: middle; }
      .verb-table tbody td:first-child { padding-left: 0; }

      /* Given cell (Befehl + DE) */
      .given-cell {
        min-width: 130px;
      }
      .given-cell .lat {
        font-family: "Lora", serif;
        font-size: 14px;
        font-style: italic;
        color: var(--text);
        display: block;
      }
      .given-cell .de {
        font-size: 12px;
        color: var(--muted);
        display: block;
        margin-top: 2px;
      }

      /* Input cell */
      .inp-cell { text-align: center; }

      /* ── Input field ── */
      .fill-wrap {
        display: inline-flex;
        align-items: center;
        position: relative;
        vertical-align: middle;
      }
      .fill-input {
        width: 150px;
        height: 34px;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        background: var(--white);
        font-family: "Lora", serif;
        font-size: 13px;
        color: var(--text);
        padding: 0 10px;
        outline: none;
        transition: border-color 0.18s, box-shadow 0.18s;
        text-align: center;
      }
      .fill-input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
      }
      .fill-input:disabled {
        opacity: 1;
        -webkit-text-fill-color: var(--text);
        cursor: default;
      }
      .fill-input.trans {
        font-family: "Noto Sans", sans-serif;
        font-size: 13px;
        width: 160px;
      }

      /* States */
      .fill-wrap.correct .fill-input { border-color: var(--green) !important; border-width: 2px; box-shadow: none; }
      .fill-wrap.wrong .fill-input { border-color: var(--yellow) !important; border-width: 2px; box-shadow: none; }
      .fill-wrap.wrong-locked .fill-input { border-color: var(--yellow) !important; border-width: 2px; box-shadow: none; pointer-events: none; }
      .fill-wrap.wrong-locked { cursor: pointer; }

      /* Badge */
      .fill-badge {
        position: absolute; top: -8px; right: -8px;
        width: 18px; height: 18px; border-radius: 50%;
        display: none; align-items: center; justify-content: center; z-index: 10;
      }
      .fill-badge.show { display: flex; }
      .fill-badge.ok   { background: var(--green); }
      .fill-badge.fail { background: var(--yellow); cursor: pointer; }
      .fill-badge svg  { width: 9px; height: 9px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

      /* Popover */
      .fill-popover {
        display: none;
        position: absolute;
        bottom: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%);
        background: #111; color: #fff;
        font-size: 11px; font-weight: 600; font-style: normal;
        font-family: "Noto Sans", sans-serif;
        padding: 5px 9px; border-radius: 7px;
        white-space: nowrap; z-index: 50; pointer-events: none;
      }
      .fill-popover::after {
        content: ""; position: absolute; top: 100%; left: 50%;
        transform: translateX(-50%);
        border: 5px solid transparent; border-top-color: #111;
      }
      .fill-popover.show { display: block; }

      /* ── Feedback ── */
      .feedback { display: none; margin: 0 22px 16px; padding: 12px 14px; border-radius: 10px; font-size: 14px; font-weight: 500; align-items: center; gap: 8px; }
      .feedback.show { display: flex; }
      .feedback.warn { background: #fff8ed; color: #b45309; border: 1px solid #fde68a; }
      .feedback.ok   { background: #edf7ed; color: #2e7d32; border: 1px solid #c8e6c9; }
      .feedback svg  { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

      /* ── Task footer ── */
      .task-footer { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
      .attempts-wrap { display: flex; gap: 5px; align-items: center; }
      .attempt-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #d0cec9; background: transparent; transition: background 0.2s, border-color 0.2s; }
      .attempt-dot.used { background: var(--muted); border-color: var(--muted); }
      .check-btn { background: #111; color: #fff; border: none; border-radius: 10px; padding: 9px 20px; font-size: 14px; font-weight: 600; font-family: "Noto Sans", sans-serif; cursor: pointer; transition: background 0.15s, transform 0.15s; display: flex; align-items: center; gap: 6px; }
      .check-btn:hover:not(:disabled) { background: #333; transform: translateY(-1px); }
      .check-btn:active:not(:disabled) { transform: scale(0.97); }
      .check-btn:disabled { opacity: 0.4; cursor: default; transform: none; }
      .check-btn.success { background: var(--green); }
      .check-btn.partial { background: var(--yellow); }
      .check-btn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

      @media (max-width: 600px) {
        body { padding: 4.5rem 0.75rem 2rem; }
        .task-content { padding: 14px 12px; }
        .fill-input { width: 110px; font-size: 12px; }
        .fill-input.trans { width: 120px; }
        .verb-table thead th { font-size: 10px; padding: 0 6px 10px; }
        .verb-table tbody td { padding: 10px 6px; }
        .given-cell { min-width: 90px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="sitename">
        <a href="lektionsuebersicht.html">Latein*</a>
        <span class="sep">›</span>
        <a href="lektion04.html" class="sub">Lektion 4</a>
        <span class="sep2">›</span>
        <span class="sub2">Befehl oder Verbot (1)</span>
      </div>
      <div class="topbar">
        <button class="icon-btn bell-btn" title="Benachrichtigungen" onclick="handleBell()">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="dot" id="bellDot"></span>
        </button>
        <div class="user-wrap">
          <button class="icon-btn user-btn" title="Benutzerprofil" onclick="toggleDropdown()">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>
          <div class="dropdown" id="dropdown">
            <div class="dropdown-header">
              <div class="dropdown-name">Max Mustermann</div>
              <div class="dropdown-email">max@beispiel.de</div>
            </div>
            <button class="dropdown-item" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil
            </button>
            <button class="dropdown-item" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Einstellungen
            </button>
            <div class="dropdown-sep-line"></div>
            <button class="dropdown-item danger" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Abmelden
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="page-wrap">
      <div class="task-card">
        <div class="task-header">
          <div class="task-title">Befehl oder Verbot (1)</div>
          <div class="task-instruction">
            Bilde zu den Befehlsformen die verneinte Form und übersetze diese.
          </div>
        </div>

        <div class="task-content">

          <!-- Example box -->
          <div class="example-box">
            <strong>Beispiel:</strong>
            <span class="lat">Venīte!</span> <em>(Kommt!)</em>
            <span class="arrow">→</span>
            <span class="lat">Nōlīte venīre!</span>
            <span class="arrow">→</span>
            <em>Kommt nicht!</em>
          </div>

          <table class="verb-table">
            <thead>
              <tr>
                <th>Befehl</th>
                <th class="center">Verneinte Form</th>
                <th class="center">Übersetzung</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <div class="feedback" id="feedback">
          <svg id="feedbackIcon" viewBox="0 0 24 24"></svg>
          <span id="feedbackText"></span>
        </div>

        <div class="task-footer">
          <div class="attempts-wrap">
            <div class="attempt-dot" id="dot1"></div>
            <div class="attempt-dot" id="dot2"></div>
            <div class="attempt-dot" id="dot3"></div>
          </div>
          <button class="check-btn" id="checkBtn">Überprüfen</button>
        </div>
      </div>
    </div>

    <script>
      // ── Daten ─────────────────────────────────────────────────────────────────
      // given: { lat, de }  — shown in column 1
      // neg:   { id, ans }  — Verbot form to be typed (col 2)
      // trans: { id, ans }  — German translation to be typed (col 3)
      const rows = [
        {
          given: { lat: "Scrībe!", de: "Schreib!" },
          neg:   { id: "neg1", ans: ["Noli scribere!", "Noli scribere"] },
          trans: { id: "tr1",  ans: ["Schreib nicht!", "Schreib nicht"] },
        },
        {
          given: { lat: "Legite!", de: "Lest!" },
          neg:   { id: "neg2", ans: ["Nolite legere!", "Nolite legere"] },
          trans: { id: "tr2",  ans: ["Lest nicht!", "Lest nicht"] },
        },
        {
          given: { lat: "Rīdēte!", de: "Lacht!" },
          neg:   { id: "neg3", ans: ["Nolite ridere!", "Nolite ridere"] },
          trans: { id: "tr3",  ans: ["Lacht nicht!", "Lacht nicht"] },
        },
        {
          given: { lat: "Clāmā!", de: "Ruf! / Schrei!" },
          neg:   { id: "neg4", ans: ["Noli clamare!", "Noli clamare"] },
          trans: { id: "tr4",  ans: ["Ruf nicht!", "Schrei nicht!", "Ruf nicht", "Schrei nicht"] },
        },
        {
          given: { lat: "Tacēte!", de: "Schweigt!" },
          neg:   { id: "neg5", ans: ["Nolite tacere!", "Nolite tacere"] },
          trans: { id: "tr5",  ans: ["Schweigt nicht!", "Redet!", "Schweigt nicht", "Redet"] },
        },
        {
          given: { lat: "Age!", de: "Tu! / Handle! / Los!" },
          neg:   { id: "neg6", ans: ["Noli agere!", "Noli agere"] },
          trans: { id: "tr6",  ans: ["Tu es nicht!", "Handle nicht!", "Tu es nicht", "Handle nicht"] },
        },
      ];

      const KEY  = "task_l04_befehl_verbot_1";
      const NEXT = "befehl-oder-verbot-2.html";

      let tries  = 0;
      let locked = false;
      const allInputs = {}; // id → { el, ans, wrapEl, badgeEl, popoverEl }

      // ── Tabelle aufbauen ───────────────────────────────────────────────────────
      const tbody = document.getElementById("tableBody");

      function makeCell(id, ans, extraClass) {
        const td = document.createElement("td");
        td.className = "inp-cell";

        const wrap = document.createElement("span");
        wrap.className = "fill-wrap";
        wrap.id = "wrap-" + id;

        const input = document.createElement("input");
        input.type = "text";
        input.className = "fill-input" + (extraClass ? " " + extraClass : "");
        input.id = "inp-" + id;
        input.autocomplete = "off";
        input.autocorrect = "off";
        input.autocapitalize = "none";
        input.spellcheck = false;

        const badge = document.createElement("span");
        badge.className = "fill-badge";
        badge.id = "badge-" + id;

        const popover = document.createElement("div");
        popover.className = "fill-popover";
        popover.id = "popover-" + id;
        popover.textContent = ans[0];

        const togglePopover = () => {
          if (locked && wrap.classList.contains("wrong-locked")) {
            popover.classList.toggle("show");
          }
        };
        wrap.addEventListener("click", togglePopover);
        input.addEventListener("click", togglePopover);
        badge.addEventListener("click", (e) => {
          e.stopPropagation();
          togglePopover();
        });

        wrap.appendChild(input);
        wrap.appendChild(badge);
        wrap.appendChild(popover);
        td.appendChild(wrap);

        allInputs[id] = { el: input, ans, wrapEl: wrap, badgeEl: badge, popoverEl: popover };
        return td;
      }

      rows.forEach((r) => {
        const tr = document.createElement("tr");

        // Col 1: given (Befehl + DE)
        const tdGiven = document.createElement("td");
        tdGiven.className = "given-cell";
        tdGiven.innerHTML = `<span class="lat">${r.given.lat}</span><span class="de">${r.given.de}</span>`;
        tr.appendChild(tdGiven);

        // Col 2: verneinte Form
        tr.appendChild(makeCell(r.neg.id, r.neg.ans, ""));

        // Col 3: Übersetzung
        tr.appendChild(makeCell(r.trans.id, r.trans.ans, "trans"));

        tbody.appendChild(tr);
      });

      // ── Button aktivieren ──────────────────────────────────────────────────────
      const checkBtn = document.getElementById("checkBtn");
      checkBtn.onclick = checkAnswers;

      // Makrons & Satzzeichen normalisieren
      function norm(s) {
        return s
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")  // strip diacritics incl. macrons
          .replace(/[!?.]/g, "")            // strip punctuation
          .replace(/[,\/]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }
      function isOk(val, ans) {
        return ans.some((a) => norm(val) === norm(a));
      }

      // ── Überprüfen ────────────────────────────────────────────────────────────
      function checkAnswers() {
        if (locked || tries >= 3) return;

        const anyFilled = Object.values(allInputs).some((d) => d.el.value.trim() !== "");
        if (!anyFilled) {
          showFeedback("warn", "Fülle zuerst mindestens ein Feld aus.");
          return;
        }

        tries++;
        document.getElementById("dot" + tries).classList.add("used");

        let correct = 0;
        const total = Object.keys(allInputs).length;

        Object.entries(allInputs).forEach(([id, d]) => {
          const val = d.el.value.trim();
          const ok  = isOk(val, d.ans);
          if (ok) {
            correct++;
            d.wrapEl.classList.add("correct");
            d.wrapEl.classList.remove("wrong");
            d.el.disabled = true;
          } else {
            d.wrapEl.classList.add("wrong");
            if (tries >= 3) d.el.disabled = true;
          }
        });

        const allOk  = correct === total;
        const doLock = tries >= 3 || allOk;

        if (doLock) {
          locked = true;
          Object.entries(allInputs).forEach(([id, d]) => {
            if (d.wrapEl.classList.contains("wrong")) {
              d.wrapEl.classList.remove("wrong");
              d.wrapEl.classList.add("wrong-locked");
            }
            const ok = d.wrapEl.classList.contains("correct");
            d.badgeEl.classList.add("show", ok ? "ok" : "fail");
            d.badgeEl.innerHTML = ok
              ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
              : '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>';
            d.el.disabled = true;
          });
          save(allOk, correct);
        }

        if (allOk) {
          showFeedback("ok", "Ausgezeichnet! Alle Formen richtig!");
          checkBtn.classList.add("success");
          checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
          checkBtn.onclick = () => (window.location.href = NEXT);
        } else if (tries < 3) {
          showFeedback("warn", `${correct} von ${total} richtig. Versuche es nochmal!`);
        } else {
          showFeedback("warn", "Klicke auf die gelb umrandeten Felder, um die richtige Lösung zu sehen.");
          checkBtn.classList.add("partial");
          checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
          checkBtn.onclick = () => (window.location.href = NEXT);
        }
      }

      function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
      function lsGet(k)    { try { return localStorage.getItem(k); } catch(e) { return null; } }

      function save(done, correct) {
        const total = Object.keys(allInputs).length;
        const vals = {};
        Object.entries(allInputs).forEach(([id, d]) => { vals[id] = d.el.value.trim(); });
        lsSet(KEY, done ? "done" : "attempted");
        lsSet(KEY + "_vals",     JSON.stringify(vals));
        lsSet(KEY + "_attempts", tries);
        lsSet(KEY + "_points",   +(correct * 0.5).toFixed(2));
        lsSet(KEY + "_date",     new Date().toLocaleDateString("de-DE"));
        if (!done) lsSet(KEY + "_fail", "true");
      }

      function showFeedback(type, text) {
        const fb = document.getElementById("feedback");
        fb.className = "feedback show " + type;
        document.getElementById("feedbackIcon").innerHTML = type === "ok"
          ? '<polyline points="20 6 9 17 4 12"/>'
          : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
        document.getElementById("feedbackText").textContent = text;
      }

      // ── Zustand wiederherstellen ───────────────────────────────────────────────
      (function restore() {
        const savedDone  = lsGet(KEY) === "done";
        const savedFail  = lsGet(KEY + "_fail") === "true";
        const savedVals  = lsGet(KEY + "_vals");
        const savedTries = parseInt(lsGet(KEY + "_attempts") || "0");
        if (!savedVals || (!savedDone && !savedFail)) return;

        const vals = JSON.parse(savedVals);
        tries  = savedTries;
        locked = true;

        for (let i = 1; i <= savedTries; i++) {
          const d = document.getElementById("dot" + i);
          if (d) d.classList.add("used");
        }

        Object.entries(allInputs).forEach(([id, d]) => {
          const val = vals[id] || "";
          const ok  = isOk(val, d.ans);
          d.el.value    = val;
          d.el.disabled = true;
          d.wrapEl.classList.add(ok ? "correct" : "wrong-locked");
          d.badgeEl.classList.add("show", ok ? "ok" : "fail");
          d.badgeEl.innerHTML = ok
            ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
            : '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>';
        });

        if (savedDone) {
          showFeedback("ok", "Ausgezeichnet! Alle Formen richtig!");
          checkBtn.classList.add("success");
        } else {
          showFeedback("warn", "Klicke auf die gelb umrandeten Felder, um die richtige Lösung zu sehen.");
          checkBtn.classList.add("partial");
        }
        checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
        checkBtn.onclick = () => (window.location.href = NEXT);
      })();

      // ── Bell & Dropdown ───────────────────────────────────────────────────────
      function handleBell()    { alert("Keine neuen Benachrichtigungen."); }
      function toggleDropdown(){ document.getElementById("dropdown").classList.toggle("open"); }
      function closeDropdown() { document.getElementById("dropdown").classList.remove("open"); }
      document.addEventListener("click", (e) => {
        if (!document.querySelector(".user-wrap").contains(e.target)) closeDropdown();
      });
    </script>
  </body>
</html>
