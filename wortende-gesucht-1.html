<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wortende gesucht (1)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,700;1,400&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scrollbar-gutter: stable; }
      :root {
        --bg:#f8f8f6;--white:#ffffff;--border:#e6e4df;--text:#111111;--muted:#898783;
        --green:#4caf50;--yellow:#f5a623;--blue:#2563eb;--radius:14px;
        --split-color:#2563eb;--split-bg:rgba(37,99,235,0.10);--split-hover:rgba(37,99,235,0.18);
        --correct-color:#4caf50;--wrong-color:#f5a623;
      }
      body { font-family:"Noto Sans",sans-serif;background:var(--bg);min-height:100vh;padding:5rem 1.5rem 3rem;color:var(--text); }

      header { position:fixed;top:0;left:0;right:0;height:56px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;z-index:200; }
      .sitename { font-size:19px;font-weight:700;color:#111;font-family:"Lora",serif;letter-spacing:-0.4px;display:flex;align-items:center;gap:6px; }
      .sitename a { color:inherit;text-decoration:none; }
      .sitename .sep  { color:#cccccc;font-family:"Noto Sans",sans-serif;font-weight:400;font-size:17px; }
      .sitename .sep2 { color:#cccccc;font-family:"Noto Sans",sans-serif;font-weight:400;font-size:17px; }
      .sitename .sub  { font-size:12px;font-weight:600;color:#555;font-family:"Noto Sans",sans-serif; }
      .sitename .sub2 { font-size:12px;font-weight:600;color:#555;font-family:"Noto Sans",sans-serif; }
      .topbar { display:flex;align-items:center;gap:8px; }
      .icon-btn { width:34px;height:34px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.15s;position:relative;outline:none;flex-shrink:0; }
      .icon-btn:hover { transform:scale(1.08); } .icon-btn:active { transform:scale(0.94); }
      .icon-btn svg { width:16px;height:16px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round; }
      .bell-btn svg { stroke:#898783; }
      .bell-btn .dot { position:absolute;top:6px;right:6px;width:7px;height:7px;background:#cc3300;border-radius:50%;border:1.5px solid var(--white); }
      @keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}75%{transform:rotate(3deg)}}
      .bell-btn:hover svg { animation:ring 0.55s ease;transform-origin:50% 3px; }
      .user-btn svg { stroke:#898783; }
      .user-wrap { position:relative; }
      .dropdown { display:none;position:absolute;top:44px;right:0;background:var(--white);border:1px solid #e0e0e0;border-radius:10px;min-width:190px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,0.1); }
      .dropdown.open { display:block;animation:dropIn 0.15s ease; }
      @keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
      .dropdown-header { padding:13px 16px 9px;border-bottom:1px solid #e8e8e8;background:#f9f9f9; }
      .dropdown-name { font-size:14px;font-weight:600;color:#111; } .dropdown-email { font-size:12px;color:#888;margin-top:2px; }
      .dropdown-item { display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:14px;color:#111;cursor:pointer;border:none;background:none;width:100%;font-family:"Noto Sans",sans-serif;transition:background 0.12s;text-align:left; }
      .dropdown-item:hover { background:#f4f4f4; }
      .dropdown-item svg { width:15px;height:15px;stroke:#555;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0; }
      .dropdown-sep-line { height:1px;background:#e8e8e8; }
      .dropdown-item.danger { color:#cc3300; } .dropdown-item.danger svg { stroke:#cc3300; }

      .page-wrap { max-width:780px;margin:0 auto; }
      .task-card { background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden; }
      .task-header { padding:20px 22px 16px;border-bottom:1px solid var(--border); }
      .task-title { font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;font-family:"Lora",serif; }
      .task-instruction { font-size:14px;color:var(--muted);line-height:1.6; }
      .task-content { padding:20px 22px;display:flex;flex-direction:column;gap:12px; }

      /* Example box */
      .example-box { background:#f5f4f0;border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--muted);line-height:1.7; }
      .example-box strong { color:var(--text); }
      .example-box .ex-word { font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--text); }
      .example-box .ex-split { font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--split-color);font-weight:700; }

      /* ── Splitter card ── */
      .splitter-card {
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 20px 18px;
        background: var(--white);
        transition: border-color 0.2s;
      }
      .splitter-card.has-correct { border-color: var(--correct-color); }
      .splitter-card.has-wrong   { border-color: var(--wrong-color); }

      /* The splitter widget — wrapping allowed */
      .splitter {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        row-gap: 8px;
        position: relative;
        cursor: default;
        line-height: 1;
      }

      .seg { display: inline-flex; align-items: center; position: relative; }
      .seg-text {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
        line-height: 1;
        padding: 6px 0;
        user-select: none;
        display: block;
      }

      /* Gap button */
      .gap-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 4px;
        height: 44px;
        overflow: hidden;
        cursor: pointer;
        position: relative;
        flex-shrink: 0;
        border: none;
        background: transparent;
        padding: 0;
        transition: width 0.1s, background 0.1s;
        border-radius: 4px;
      }
      .gap-btn.hovered { width: 28px; background: var(--split-hover); overflow: visible; }
      .gap-btn.hovered .gap-line { opacity: 1; background: var(--split-color); }
      .gap-btn.active  { width: 28px; overflow: visible; }

      .gap-line { width: 3px; height: 30px; border-radius: 2px; background: transparent; opacity: 0; pointer-events: none; flex-shrink: 0; transition: opacity 0.15s; }
      .gap-btn.active .gap-line { background: var(--split-color); opacity: 1; height: 36px; box-shadow: 0 0 8px rgba(37,99,235,0.4); }
      .gap-btn.active::after { content:"|"; position:absolute; top:-16px; left:50%; transform:translateX(-50%); font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:700; color:var(--split-color); pointer-events:none; }

      /* Locked states */
      .splitter-card.locked .gap-btn { cursor:default; pointer-events:none; }
      .splitter-card.locked .gap-btn:not(.active):not(.correct-split):not(.wrong-split):not(.missing-split) { width:4px!important; background:transparent!important; overflow:hidden!important; }

      .gap-btn.correct-split { width:28px!important; overflow:visible!important; }
      .gap-btn.correct-split .gap-line { background:var(--correct-color)!important; opacity:1!important; }
      .gap-btn.correct-split::after { color:var(--correct-color)!important; }
      .gap-btn.wrong-split   { width:28px!important; overflow:visible!important; }
      .gap-btn.wrong-split   .gap-line { background:var(--wrong-color)!important; opacity:1!important; }
      .gap-btn.wrong-split::after { content:"|"; color:var(--wrong-color)!important; }
      .gap-btn.missing-split { width:28px!important; overflow:visible!important; }
      .gap-btn.missing-split .gap-line { background:var(--wrong-color)!important; opacity:1!important; height:36px!important; }
      .gap-btn.missing-split::after { content:"\2193"; color:var(--wrong-color); font-size:11px; }

      /* Solution display */
      .solution-row { font-size:12px;color:var(--muted);margin-top:10px;display:none;flex-wrap:wrap;gap:6px; }
      .solution-row.show { display:flex; }
      .sol-word { background:#f5f4f0;border-radius:6px;padding:3px 8px;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text); }

      /* Feedback */
      .feedback { display:none;margin:0 22px 16px;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:500;align-items:center;gap:8px; }
      .feedback.show { display:flex; }
      .feedback.warn { background:#fff8ed;color:#b45309;border:1px solid #fde68a; }
      .feedback.ok   { background:#edf7ed;color:#2e7d32;border:1px solid #c8e6c9; }
      .feedback svg  { width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0; }

      .task-footer { padding:16px 22px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:16px; }
      .attempts-wrap { display:flex;gap:5px;align-items:center; }
      .attempt-dot { width:7px;height:7px;border-radius:50%;border:1.5px solid #d0cec9;background:transparent;transition:background 0.2s,border-color 0.2s; }
      .attempt-dot.used { background:var(--muted);border-color:var(--muted); }
      .check-btn { background:#111;color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:14px;font-weight:600;font-family:"Noto Sans",sans-serif;cursor:pointer;transition:background 0.15s,transform 0.15s;display:flex;align-items:center;gap:6px; }
      .check-btn:hover:not(:disabled) { background:#333;transform:translateY(-1px); }
      .check-btn:active:not(:disabled) { transform:scale(0.97); }
      .check-btn:disabled { opacity:0.4;cursor:default;transform:none; }
      .check-btn.success { background:var(--green); }
      .check-btn.partial { background:var(--yellow); }
      .check-btn svg { width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round; }

      @media(max-width:560px){
        body{padding:4.5rem 1rem 2rem}
        .task-content{padding:14px 12px}
        .task-footer{padding:12px 14px}
        .seg-text{font-size:15px}
      }
    </style>
  </head>
  <body>
    <header>
      <div class="sitename">
        <a href="lektionsuebersicht.html">Latein*</a>
        <span class="sep">›</span>
        <a href="lektion04.html" class="sub">Lektion 4</a>
        <span class="sep2">›</span>
        <span class="sub2">Wortende gesucht (1)</span>
      </div>
      <div class="topbar">
        <button class="icon-btn bell-btn" title="Benachrichtigungen" onclick="handleBell()">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="dot" id="bellDot"></span>
        </button>
        <div class="user-wrap">
          <button class="icon-btn user-btn" title="Benutzerprofil" onclick="toggleDropdown()">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>
          <div class="dropdown" id="dropdown">
            <div class="dropdown-header">
              <div class="dropdown-name">Max Mustermann</div>
              <div class="dropdown-email">max@beispiel.de</div>
            </div>
            <button class="dropdown-item" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil
            </button>
            <button class="dropdown-item" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Einstellungen
            </button>
            <div class="dropdown-sep-line"></div>
            <button class="dropdown-item danger" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Abmelden
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="page-wrap">
      <div class="task-card">
        <div class="task-header">
          <div class="task-title">Wortende gesucht (1)</div>
          <div class="task-instruction">
            Die folgenden lateinischen Verbformen sind aneinandergeschrieben. Klicke auf die Stellen zwischen den Wörtern, um sie voneinander zu trennen.
          </div>
        </div>

        <div class="task-content">

          <!-- Example box -->
          <div class="example-box">
            <strong>Beispiel:</strong>
            <span class="ex-word">veniteaudi</span> &rarr; <span class="ex-split">venite | audi</span>
          </div>

          <!-- Splitter card -->
          <div class="splitter-card" id="splitterCard">
            <div class="splitter" id="splitter"></div>
            <div class="solution-row" id="solutionRow"></div>
          </div>

        </div>

        <div class="feedback" id="feedback">
          <svg id="feedbackIcon" viewBox="0 0 24 24"></svg>
          <span id="feedbackText"></span>
        </div>

        <div class="task-footer">
          <div class="attempts-wrap">
            <div class="attempt-dot" id="dot1"></div>
            <div class="attempt-dot" id="dot2"></div>
            <div class="attempt-dot" id="dot3"></div>
          </div>
          <button class="check-btn" id="checkBtn" onclick="checkAnswers()">Überprüfen</button>
        </div>
      </div>
    </div>

    <script>
      // ── Data ─────────────────────────────────────────────────────────────────
      const words = ['monet','currite','voca','sedes','audite','scribe','tacent','portate','duc','considite','video','responde'];
      // Full string
      const fullString = words.join('');
      // correctGaps: gap indices (after letter index) where splits must be placed
      // gap[i] = between fullString[i] and fullString[i+1]
      const correctGaps = [];
      let pos = 0;
      for (let i = 0; i < words.length - 1; i++) {
        pos += words[i].length;
        correctGaps.push(pos - 1);
      }

      const KEY  = 'task_l04_wortende_1';
      const NEXT = 'wortende-gesucht-2.html';

      let tries   = 0;
      let locked  = false;
      const activeGaps = new Set();

      // ── Build splitter ────────────────────────────────────────────────────────
      const splitter = document.getElementById('splitter');
      const letters  = fullString.split('');

      letters.forEach((ch, ci) => {
        const seg = document.createElement('span');
        seg.className = 'seg';
        const txt = document.createElement('span');
        txt.className = 'seg-text';
        txt.textContent = ch;
        seg.appendChild(txt);
        splitter.appendChild(seg);

        if (ci < letters.length - 1) {
          const gap = document.createElement('button');
          gap.className = 'gap-btn';
          gap.id = 'gap-' + ci;
          gap.type = 'button';
          const line = document.createElement('div');
          line.className = 'gap-line';
          gap.appendChild(line);
          gap.addEventListener('click', () => toggleGap(ci));
          splitter.appendChild(gap);
        }
      });

      // ── Hover: hovering a letter highlights the gap after it ─────────────────
      letters.forEach((_, ci) => {
        if (ci >= letters.length - 1) return;
        const gapEl = document.getElementById('gap-' + ci);
        const segs  = splitter.querySelectorAll('.seg');
        segs[ci].addEventListener('mouseenter', () => { if (!locked) gapEl.classList.add('hovered'); });
        segs[ci].addEventListener('mouseleave', () => gapEl.classList.remove('hovered'));
        gapEl.addEventListener('mouseenter', () => { if (!locked) gapEl.classList.add('hovered'); });
        gapEl.addEventListener('mouseleave', () => gapEl.classList.remove('hovered'));
      });

      // ── Toggle gap ────────────────────────────────────────────────────────────
      function toggleGap(idx) {
        if (locked) return;
        const gapEl = document.getElementById('gap-' + idx);
        if (activeGaps.has(idx)) {
          activeGaps.delete(idx);
          gapEl.classList.remove('active');
        } else {
          activeGaps.add(idx);
          gapEl.classList.add('active');
        }
        updateCheckBtn();
      }

      const checkBtn = document.getElementById('checkBtn');
      function updateCheckBtn() { checkBtn.disabled = activeGaps.size === 0; }
      checkBtn.disabled = true;

      // ── Check ─────────────────────────────────────────────────────────────────
      function checkAnswers() {
        if (locked || tries >= 3) return;
        tries++;
        document.getElementById('dot' + tries).classList.add('used');

        const correct = new Set(correctGaps);
        const allOk   = correct.size === activeGaps.size && [...correct].every(g => activeGaps.has(g));
        const doLock  = tries >= 3 || allOk;

        if (doLock) {
          locked = true;
          applyFinalStyles();
          save(allOk);
        }

        if (allOk) {
          showFeedback('ok', 'Ausgezeichnet! Alle Wörter korrekt getrennt!');
          checkBtn.classList.add('success');
          checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
          checkBtn.disabled = false;
          checkBtn.onclick = () => window.location.href = NEXT;
        } else if (tries < 3) {
          showFeedback('warn', 'Das ist noch nicht richtig. Versuche es nochmal!');
        } else {
          showFeedback('warn', 'Die richtige Lösung wird angezeigt.');
          checkBtn.classList.add('partial');
          checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
          checkBtn.disabled = false;
          checkBtn.onclick = () => window.location.href = NEXT;
        }
      }

      function applyFinalStyles() {
        const correct = new Set(correctGaps);
        const card = document.getElementById('splitterCard');
        const allOk = correct.size === activeGaps.size && [...correct].every(g => activeGaps.has(g));
        card.classList.add(allOk ? 'has-correct' : 'has-wrong');
        card.classList.add('locked');

        letters.forEach((_, ci) => {
          if (ci >= letters.length - 1) return;
          const gapEl  = document.getElementById('gap-' + ci);
          const isSet  = activeGaps.has(ci);
          const needed = correct.has(ci);
          gapEl.classList.remove('active');
          if (isSet && needed)   gapEl.classList.add('active', 'correct-split');
          else if (isSet)        gapEl.classList.add('active', 'wrong-split');
          else if (needed)       gapEl.classList.add('active', 'missing-split');
        });

        // Show solution words
        const solRow = document.getElementById('solutionRow');
        if (!allOk) {
          words.forEach(w => {
            const span = document.createElement('span');
            span.className = 'sol-word';
            span.textContent = w;
            solRow.appendChild(span);
          });
          solRow.classList.add('show');
        }
      }

      function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
      function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

      function save(done) {
        lsSet(KEY, done?'done':'attempted');
        lsSet(KEY+'_gaps',     JSON.stringify([...activeGaps]));
        lsSet(KEY+'_attempts', tries);
        // 0.5 points per correctly placed gap (max 4.0)
        const correct = new Set(correctGaps);
        const correctlyPlaced = [...activeGaps].filter(g => correct.has(g)).length;
        const wronglyPlaced   = [...activeGaps].filter(g => !correct.has(g)).length;
        const pts = Math.max(0, (correctlyPlaced - wronglyPlaced) * 0.5);
        lsSet(KEY+'_points', +pts.toFixed(2));
        lsSet(KEY+'_date',     new Date().toLocaleDateString('de-DE'));
        if (!done) lsSet(KEY+'_fail','true');
      }

      function showFeedback(type, text) {
        const fb = document.getElementById('feedback');
        fb.className = 'feedback show ' + type;
        document.getElementById('feedbackIcon').innerHTML = type==='ok'
          ? '<polyline points="20 6 9 17 4 12"/>'
          : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
        document.getElementById('feedbackText').textContent = text;
      }

      // ── Restore ───────────────────────────────────────────────────────────────
      (function restoreState(){
        const savedDone  = lsGet(KEY) === 'done';
        const savedFail  = lsGet(KEY+'_fail') === 'true';
        const savedGaps  = lsGet(KEY+'_gaps');
        const savedTries = parseInt(lsGet(KEY+'_attempts')||'0');
        if (!savedGaps || (!savedDone && !savedFail)) return;

        JSON.parse(savedGaps).forEach(g => {
          activeGaps.add(g);
          const gapEl = document.getElementById('gap-' + g);
          if (gapEl) gapEl.classList.add('active');
        });
        tries  = savedTries;
        locked = true;
        for (let i=1;i<=savedTries;i++){const d=document.getElementById('dot'+i);if(d)d.classList.add('used');}
        applyFinalStyles();

        if (savedDone) {
          showFeedback('ok','Ausgezeichnet! Alle Wörter korrekt getrennt!');
          checkBtn.classList.add('success');
        } else {
          showFeedback('warn','Die richtige Lösung wird angezeigt.');
          checkBtn.classList.add('partial');
        }
        checkBtn.innerHTML='Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
        checkBtn.disabled=false;
        checkBtn.onclick=()=>window.location.href=NEXT;
      })();

      function handleBell()    { alert('Keine neuen Benachrichtigungen.'); }
      function toggleDropdown(){ document.getElementById('dropdown').classList.toggle('open'); }
      function closeDropdown() { document.getElementById('dropdown').classList.remove('open'); }
      document.addEventListener('click', e => { if (!document.querySelector('.user-wrap').contains(e.target)) closeDropdown(); });
    </script>
  </body>
</html>
