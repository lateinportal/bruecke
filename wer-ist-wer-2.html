<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer ist wer? (2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Lora:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-gutter: stable; }

  :root {
    --bg:      #f8f8f6;
    --white:   #ffffff;
    --border:  #E6E4DF;
    --text:    #111111;
    --muted:   #898783;
    --accent:  #c6613f;
    --green:   #4CAF50;
    --yellow:  #F5A623;
    --radius:  14px;
    --blue:    #2563eb;
  }

  body {
    font-family: 'Noto Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 5rem 1.5rem 3rem;
    color: var(--text);
  }

  /* ── Header ── */
  header {
    position: fixed; top: 0; left: 0; right: 0;
    height: 56px; background: var(--white);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem; z-index: 200;
  }
  .sitename { font-size: 19px; font-weight: 700; color: #111; font-family: 'Lora', serif; letter-spacing: -0.4px; display: flex; align-items: center; gap: 6px; }
  .sitename a { color: inherit; text-decoration: none; }
  .sitename .sep  { color: #CCCCCC; font-family: 'Noto Sans', sans-serif; font-weight: 400; font-size: 17px; }
  .sitename .sep2 { color: #CCCCCC; font-family: 'Noto Sans', sans-serif; font-weight: 400; font-size: 17px; }
  .sitename .sub  { font-size: 12px; font-weight: 600; color: #555; font-family: 'Noto Sans', sans-serif; }
  .sitename .sub2 { font-size: 12px; font-weight: 600; color: #555; font-family: 'Noto Sans', sans-serif; }
  .topbar { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 12px; border: 1px solid transparent; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; position: relative; outline: none; flex-shrink: 0; }
  .icon-btn:hover { transform: scale(1.08); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 16px; height: 16px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bell-btn svg { stroke: #898783; }
  .bell-btn .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: #CC3300; border-radius: 50%; border: 1.5px solid var(--white); }
  @keyframes ring { 0%,100%{transform:rotate(0)} 15%{transform:rotate(14deg)} 30%{transform:rotate(-12deg)} 45%{transform:rotate(8deg)} 60%{transform:rotate(-5deg)} 75%{transform:rotate(3deg)} }
  .bell-btn:hover svg { animation: ring 0.55s ease; transform-origin: 50% 3px; }
  .user-btn svg { stroke: #898783; }
  .user-wrap { position: relative; }
  .dropdown { display: none; position: absolute; top: 44px; right: 0; background: var(--white); border: 1px solid #E0E0E0; border-radius: 10px; min-width: 190px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,0.10); }
  .dropdown.open { display: block; animation: dropIn 0.15s ease; }
  @keyframes dropIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
  .dropdown-header { padding: 13px 16px 9px; border-bottom: 1px solid #E8E8E8; background: #F9F9F9; }
  .dropdown-name { font-size: 14px; font-weight: 600; color: #111; }
  .dropdown-email { font-size: 12px; color: #888; margin-top: 2px; }
  .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 14px; color: #111; cursor: pointer; border: none; background: none; width: 100%; font-family: 'Noto Sans', sans-serif; transition: background 0.12s; text-align: left; }
  .dropdown-item:hover { background: #F4F4F4; }
  .dropdown-item svg { width: 15px; height: 15px; stroke: #555; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .dropdown-sep-line { height: 1px; background: #E8E8E8; }
  .dropdown-item.danger { color: #CC3300; }
  .dropdown-item.danger svg { stroke: #CC3300; }

  /* ── Page ── */
  .page-wrap { max-width: 780px; margin: 0 auto; }

  /* ── Task card ── */
  .task-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: visible; }
  .task-header { padding: 20px 22px 16px; border-bottom: 1px solid var(--border); }
  .task-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; font-family: 'Lora', serif; }
  .task-instruction { font-size: 14px; color: var(--muted); line-height: 1.6; }

  /* ── Task content ── */
  .task-content { padding: 22px 22px; }

  /* ── Two-column grid ── */
  .pairs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 24px;
  }

  /* ── Single pair row ── */
  .pair-row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: none;
    padding: 0;
  }

  .pair-label {
    font-size: 14px;
    font-style: italic;
    color: var(--text);
    white-space: nowrap;
    min-width: 90px;
    flex-shrink: 0;
    padding: 10px 0;
  }

  .pair-arrow {
    color: var(--muted);
    font-size: 14px;
    flex-shrink: 0;
    line-height: 1;
  }

  .pair-input-wrap {
    flex: 1;
    min-width: 0;
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 9px 14px;
    display: flex;
    align-items: center;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .pair-input-wrap:focus-within {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
  }

  .pair-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'Noto Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    min-width: 0;
  }
  .pair-input::placeholder { color: #ccc; }
  .pair-input:disabled { color: var(--text); opacity: 1; -webkit-text-fill-color: var(--text); cursor: pointer; pointer-events: none; }

  /* States after check */
  .pair-row.correct .pair-input-wrap { background: #EDF7ED; border-color: var(--green) !important; box-shadow: none; }
  .pair-row.wrong   .pair-input-wrap { background: #FFF8ED; border-color: var(--yellow) !important; box-shadow: none; cursor: pointer; }

  /* Badge */
  .pair-badge {
    position: absolute; top: -9px; right: -9px;
    width: 18px; height: 18px;
    border-radius: 50%; display: none;
    align-items: center; justify-content: center; z-index: 10;
  }
  .pair-badge.show { display: flex; }
  .pair-badge.ok   { background: var(--green); }
  .pair-badge.fail { background: var(--yellow); cursor: pointer; }
  .pair-badge svg  { width: 9px; height: 9px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  /* Popover */
  .pair-popover {
    display: none; position: absolute;
    top: 50%; right: calc(100% + 10px); transform: translateY(-50%);
    background: #111; color: #fff;
    font-size: 11px; font-weight: 600; font-style: normal;
    padding: 5px 9px; border-radius: 7px;
    white-space: nowrap; z-index: 50; pointer-events: none;
    animation: fadeLeft 0.15s ease;
  }
  .pair-popover::after {
    content: ''; position: absolute;
    top: 50%; left: 100%; transform: translateY(-50%);
    border: 5px solid transparent; border-left-color: #111;
  }
  @keyframes fadeLeft { from{opacity:0;transform:translateY(-50%) translateX(4px)} to{opacity:1;transform:translateY(-50%) translateX(0)} }
  .pair-popover.show { display: block; }

  /* ── Feedback ── */
  .feedback {
    display: none; margin: 0 22px 16px;
    padding: 12px 14px; border-radius: 10px;
    font-size: 14px; font-weight: 500;
    align-items: center; gap: 8px;
  }
  .feedback.show { display: flex; }
  .feedback.warn { background: #FFF8ED; color: #b45309; border: 1px solid #FDE68A; }
  .feedback.ok   { background: #EDF7ED; color: #2E7D32; border: 1px solid #C8E6C9; }
  .feedback svg  { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ── Task footer ── */
  .task-footer {
    padding: 16px 22px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: flex-end; gap: 16px;
  }
  .attempts-wrap { display: flex; gap: 5px; align-items: center; }
  .attempt-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #D0CEC9; background: transparent; transition: background 0.2s, border-color 0.2s; }
  .attempt-dot.used { background: var(--muted); border-color: var(--muted); }

  .check-btn {
    background: #111; color: #fff;
    border: none; border-radius: 10px;
    padding: 9px 20px; font-size: 14px; font-weight: 600;
    font-family: 'Noto Sans', sans-serif;
    cursor: pointer; transition: background 0.15s, transform 0.15s;
    display: flex; align-items: center; gap: 6px;
  }
  .check-btn:hover:not(:disabled) { background: #333; transform: translateY(-1px); }
  .check-btn:active:not(:disabled) { transform: scale(0.97); }
  .check-btn:disabled { opacity: 0.4; cursor: default; transform: none; }
  .check-btn.success { background: var(--green); }
  .check-btn.partial { background: var(--yellow); }
  .check-btn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  @media (max-width: 560px) {
    body { padding: 4.5rem 1rem 2rem; }
    .task-content { padding: 14px 12px; }
    .task-footer  { padding: 12px 14px; }
    .task-header  { padding: 16px 14px 12px; }
    .pairs-grid   { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="sitename">
    <a href="lektionsuebersicht.html">Latein*</a>
    <span class="sep">›</span>
    <a href="lektion01.html" class="sub">Lektion 1</a>
    <span class="sep2">›</span>
    <span class="sub2">Wer ist wer? (2)</span>
  </div>
  <div class="topbar">
    <button class="icon-btn bell-btn" title="Benachrichtigungen" onclick="handleBell()">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="dot" id="bellDot"></span>
    </button>
    <div class="user-wrap">
      <button class="icon-btn user-btn" title="Benutzerprofil" onclick="toggleDropdown()">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <div class="dropdown" id="dropdown">
        <div class="dropdown-header">
          <div class="dropdown-name">Max Mustermann</div>
          <div class="dropdown-email">max@beispiel.de</div>
        </div>
        <button class="dropdown-item" onclick="closeDropdown()">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil
        </button>
        <button class="dropdown-item" onclick="closeDropdown()">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Einstellungen
        </button>
        <div class="dropdown-sep-line"></div>
        <button class="dropdown-item danger" onclick="closeDropdown()">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Abmelden
        </button>
      </div>
    </div>
  </div>
</header>

<div class="page-wrap">
  <div class="task-card">

    <div class="task-header">
      <div class="task-title">Wer ist wer? (2)</div>
      <div class="task-instruction">Bilde zu jedem Substantiv den Akkusativ.</div>
    </div>

    <div class="task-content">
      <div class="pairs-grid" id="pairsGrid"></div>
    </div>

    <div class="feedback" id="feedback">
      <svg id="feedbackIcon" viewBox="0 0 24 24"></svg>
      <span id="feedbackText"></span>
    </div>

    <div class="task-footer">
      <div class="attempts-wrap">
        <div class="attempt-dot" id="dot1"></div>
        <div class="attempt-dot" id="dot2"></div>
        <div class="attempt-dot" id="dot3"></div>
      </div>
      <button class="check-btn" id="checkBtn" onclick="checkAnswers()">Überprüfen</button>
    </div>

  </div>
</div>

<script>
  // ── Data ─────────────────────────────────────────────────────────────────
  const items = [
    { id: 'filia',  label: 'filia',  ans: 'filiam',  caseSensitive: false },
    { id: 'filius', label: 'filius', ans: 'filium',  caseSensitive: false },
    { id: 'pater',  label: 'pater',  ans: 'patrem',  caseSensitive: false },
    { id: 'mater',  label: 'mater',  ans: 'matrem',  caseSensitive: false },
  ];

  const KEY  = 'task_l1_wer_ist_wer_2';
  const NEXT = 'wer-ist-wer-3.html';

  let tries  = 0;
  let locked = false;

  // ── Build rows ────────────────────────────────────────────────────────────
  const grid = document.getElementById('pairsGrid');
  items.forEach(d => {
    const row = document.createElement('div');
    row.className = 'pair-row';
    row.id = 'row-' + d.id;

    const label = document.createElement('div');
    label.className = 'pair-label';
    label.textContent = d.label;

    const arrow = document.createElement('div');
    arrow.className = 'pair-arrow';
    arrow.innerHTML = '&rarr;';

    const input = document.createElement('input');
    input.className = 'pair-input';
    input.type = 'text';
    input.id   = 'inp-' + d.id;
    input.autocomplete = 'off';
    input.autocorrect  = 'off';
    input.autocapitalize = 'none';
    input.spellcheck = false;
    input.addEventListener('input', updateBtn);

    const badge = document.createElement('span');
    badge.className = 'pair-badge';
    badge.id = 'badge-' + d.id;

    const popover = document.createElement('div');
    popover.className = 'pair-popover';
    popover.id = 'popover-' + d.id;

    const inputWrap = document.createElement('div');
    inputWrap.className = 'pair-input-wrap';
    inputWrap.id = 'wrap-' + d.id;
    inputWrap.style.position = 'relative';
    inputWrap.appendChild(input);
    inputWrap.appendChild(popover);

    row.appendChild(label);
    row.appendChild(arrow);
    row.appendChild(inputWrap);
    row.appendChild(badge);

    const togglePopover = () => {
      if (locked && row.classList.contains('wrong')) {
        popover.classList.toggle('show');
      }
    };
    inputWrap.addEventListener('click', togglePopover);
    badge.addEventListener('click', e => { e.stopPropagation(); togglePopover(); });
    grid.appendChild(row);
  });

  // ── Enable button only when all filled ───────────────────────────────────
  const checkBtn = document.getElementById('checkBtn');
  function updateBtn() {
    const allFilled = items.every(d => document.getElementById('inp-' + d.id).value.trim() !== '');
    checkBtn.disabled = !allFilled;
  }
  checkBtn.disabled = true;

  // ── Check ─────────────────────────────────────────────────────────────────
  function checkAnswers() {
    if (locked || tries >= 3) return;

    tries++;
    document.getElementById('dot' + tries).classList.add('used');

    let correct = 0;
    items.forEach(d => {
      const input   = document.getElementById('inp-' + d.id);
      const row     = document.getElementById('row-' + d.id);
      const popover = document.getElementById('popover-' + d.id);
      const val     = input.value.trim();
      const ok      = d.caseSensitive
        ? val === d.ans
        : val.toLowerCase() === d.ans.toLowerCase();

      if (ok) {
        correct++;
        row.classList.add('correct'); row.classList.remove('wrong');
        input.disabled = true;
      } else {
        row.classList.add('wrong');
        popover.textContent = d.ans;
        input.disabled = tries >= 3;
      }
    });

    const allOk  = correct === items.length;
    const doLock = tries >= 3 || allOk;
    const points = +(correct * 0.5).toFixed(2);

    if (doLock) {
      items.forEach(d => {
        const badge2 = document.getElementById('badge-' + d.id);
        const row2   = document.getElementById('row-' + d.id);
        badge2.classList.add('show', row2.classList.contains('correct') ? 'ok' : 'fail');
        badge2.innerHTML = row2.classList.contains('correct')
          ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
          : '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>';
      });
    }

    if (doLock) {
      locked = true;
      items.forEach(d => { document.getElementById('inp-' + d.id).disabled = true; });
      save(allOk, points);
    }

    if (allOk) {
      showFeedback('ok', 'Ausgezeichnet! Alle Formen richtig gebildet!');
      checkBtn.classList.add('success');
      checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
      checkBtn.disabled = false;
      checkBtn.onclick = () => window.location.href = NEXT;
    } else if (tries < 3) {
      showFeedback('warn', `${correct} von ${items.length} richtig. Versuche es nochmal!`);
      checkBtn.disabled = true;
      updateBtn();
    } else {
      showFeedback('warn', 'Klicke auf die gelb umrandeten Felder, um die richtige Lösung zu sehen.');
      checkBtn.classList.add('partial');
      checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
      checkBtn.disabled = false;
      checkBtn.onclick = () => window.location.href = NEXT;
    }
  }

  function save(done, points) {
    const vals = {};
    items.forEach(d => { vals[d.id] = document.getElementById('inp-' + d.id).value.trim(); });
    localStorage.setItem(KEY, done ? 'done' : 'attempted');
    localStorage.setItem(KEY + '_vals',     JSON.stringify(vals));
    localStorage.setItem(KEY + '_attempts', tries);
    localStorage.setItem(KEY + '_points',   points);
    localStorage.setItem(KEY + '_date',     new Date().toLocaleDateString('de-DE'));
    if (!done) localStorage.setItem(KEY + '_fail', 'true');
  }

  function showFeedback(type, text) {
    const fb   = document.getElementById('feedback');
    const icon = document.getElementById('feedbackIcon');
    fb.className = 'feedback show ' + type;
    icon.innerHTML = type === 'ok'
      ? '<polyline points="20 6 9 17 4 12"/>'
      : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
    document.getElementById('feedbackText').textContent = text;
  }

  // ── Restore saved state ───────────────────────────────────────────────────
  (function restoreState() {
    const savedDone = localStorage.getItem(KEY) === 'done';
    const savedFail = localStorage.getItem(KEY + '_fail') === 'true';
    if (!savedDone && !savedFail) return;

    const savedVals     = JSON.parse(localStorage.getItem(KEY + '_vals') || '{}');
    const savedAttempts = parseInt(localStorage.getItem(KEY + '_attempts') || '0');
    tries  = savedAttempts;
    locked = true;

    for (let i = 1; i <= savedAttempts; i++) {
      const d = document.getElementById('dot' + i);
      if (d) d.classList.add('used');
    }

    items.forEach(d => {
      const input   = document.getElementById('inp-' + d.id);
      const row     = document.getElementById('row-' + d.id);
      const badge   = document.getElementById('badge-' + d.id);
      const popover = document.getElementById('popover-' + d.id);
      const val     = savedVals[d.id] || '';
      const ok      = d.caseSensitive
        ? val === d.ans
        : val.toLowerCase() === d.ans.toLowerCase();

      input.value    = val;
      input.disabled = true;
      badge.classList.add('show', ok ? 'ok' : 'fail');
      if (ok) {
        row.classList.add('correct'); row.classList.remove('wrong');
        badge.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
      } else {
        row.classList.add('wrong');
        badge.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>';
        popover.textContent = d.ans;
      }
    });

    if (savedDone) {
      showFeedback('ok', 'Ausgezeichnet! Alle Formen richtig gebildet!');
      checkBtn.classList.add('success');
    } else {
      showFeedback('warn', 'Klicke auf die gelb umrandeten Felder, um die richtige Lösung zu sehen.');
      checkBtn.classList.add('partial');
    }
    checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
    checkBtn.disabled = false;
    checkBtn.onclick = () => window.location.href = NEXT;
  })();

  // ── Bell & dropdown ───────────────────────────────────────────────────────
  function handleBell()     { alert('Keine neuen Benachrichtigungen.'); }
  function toggleDropdown() { document.getElementById('dropdown').classList.toggle('open'); }
  function closeDropdown()  { document.getElementById('dropdown').classList.remove('open'); }
  document.addEventListener('click', e => {
    if (!document.querySelector('.user-wrap').contains(e.target)) closeDropdown();
  });
</script>
</body>
</html>
