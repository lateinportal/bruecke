<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nominativ oder Akkusativ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Lora:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-gutter: stable; }
  :root {
    --bg:#f8f8f6;--white:#ffffff;--border:#E6E4DF;--text:#111111;--muted:#898783;
    --green:#4CAF50;--yellow:#F5A623;--radius:14px;--blue:#2563eb;
  }
  body { font-family:'Noto Sans',sans-serif;background:var(--bg);min-height:100vh;padding:5rem 1.5rem 3rem;color:var(--text); }
  header { position:fixed;top:0;left:0;right:0;height:56px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;z-index:200; }
  .sitename { font-size:19px;font-weight:700;color:#111;font-family:'Lora',serif;letter-spacing:-0.4px;display:flex;align-items:center;gap:6px; }
  .sitename a { color:inherit;text-decoration:none; }
  .sitename .sep  { color:#CCCCCC;font-family:'Noto Sans',sans-serif;font-weight:400;font-size:17px; }
  .sitename .sep2 { color:#CCCCCC;font-family:'Noto Sans',sans-serif;font-weight:400;font-size:17px; }
  .sitename .sub  { font-size:12px;font-weight:600;color:#555;font-family:'Noto Sans',sans-serif; }
  .sitename .sub2 { font-size:12px;font-weight:600;color:#555;font-family:'Noto Sans',sans-serif; }
  .topbar { display:flex;align-items:center;gap:8px; }
  .icon-btn { width:34px;height:34px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.15s;position:relative;outline:none;flex-shrink:0; }
  .icon-btn:hover { transform:scale(1.08); } .icon-btn:active { transform:scale(0.94); }
  .icon-btn svg { width:16px;height:16px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round; }
  .bell-btn svg { stroke:#898783; }
  .bell-btn .dot { position:absolute;top:6px;right:6px;width:7px;height:7px;background:#CC3300;border-radius:50%;border:1.5px solid var(--white); }
  @keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}75%{transform:rotate(3deg)}}
  .bell-btn:hover svg { animation:ring 0.55s ease;transform-origin:50% 3px; }
  .user-btn svg { stroke:#898783; }
  .user-wrap { position:relative; }
  .dropdown { display:none;position:absolute;top:44px;right:0;background:var(--white);border:1px solid #E0E0E0;border-radius:10px;min-width:190px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,0.10); }
  .dropdown.open { display:block;animation:dropIn 0.15s ease; }
  @keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .dropdown-header { padding:13px 16px 9px;border-bottom:1px solid #E8E8E8;background:#F9F9F9; }
  .dropdown-name { font-size:14px;font-weight:600;color:#111; } .dropdown-email { font-size:12px;color:#888;margin-top:2px; }
  .dropdown-item { display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:14px;color:#111;cursor:pointer;border:none;background:none;width:100%;font-family:'Noto Sans',sans-serif;transition:background 0.12s;text-align:left; }
  .dropdown-item:hover { background:#F4F4F4; }
  .dropdown-item svg { width:15px;height:15px;stroke:#555;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0; }
  .dropdown-sep-line { height:1px;background:#E8E8E8; }
  .dropdown-item.danger { color:#CC3300; } .dropdown-item.danger svg { stroke:#CC3300; }

  .page-wrap { max-width:780px;margin:0 auto; }
  .task-card { background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden; }
  .task-header { padding:20px 22px 16px;border-bottom:1px solid var(--border); }
  .task-title { font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;font-family:'Lora',serif; }
  .task-instruction { font-size:14px;color:var(--muted);line-height:1.6; }
  .task-content { padding:24px 22px; }

  /* ── Table: word | Nom | Akk | Sg | Pl | Übersetzung ── */
  .rf-table { display:flex;flex-direction:column;border:1.5px solid var(--border);border-radius:10px;overflow:hidden; }
  .rf-header { display:grid;grid-template-columns:110px 56px 56px 56px 56px 1fr;background:#F5F4F0;border-bottom:1.5px solid var(--border);padding:8px 12px;align-items:center;gap:0; }
  .rf-header-label { font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px; }
  .rf-header-col { font-size:12px;font-weight:700;color:var(--text);text-align:center; }
  .rf-header-trans { font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding-left:8px; }

  .rf-row { display:grid;grid-template-columns:110px 56px 56px 56px 56px 1fr;padding:10px 12px;align-items:center;border-bottom:1px solid var(--border);transition:background 0.12s;gap:0; }
  .rf-row:last-child { border-bottom:none; }
  .rf-row:hover { background:#FAFAF8; }

  .rf-statement { font-size:14px;font-style:italic;font-weight:600;color:var(--text); }
  .rf-cell { display:flex;align-items:center;justify-content:center;cursor:pointer; }

  /* Square checkbox */
  .rf-check { width:20px;height:20px;border-radius:4px;border:2px solid #D0CEC9;background:var(--white);display:flex;align-items:center;justify-content:center;transition:background 0.15s,border-color 0.15s;flex-shrink:0; }
  .rf-check.selected { background:#111;border-color:#111; }
  .rf-check.selected::after { content:'✓';font-size:12px;color:#fff;line-height:1; }

  /* Granular locked states – checkboxes and input independently */
  .rf-check.locked-ok    { background:var(--green)  !important; border-color:var(--green)  !important; }
  .rf-check.locked-wrong { background:var(--yellow) !important; border-color:var(--yellow) !important; }
  /* Row background only when BOTH checks AND translation are evaluated */
  .rf-row.checks-ok   { background:#EDF7ED; }
  .rf-row.checks-wrong{ background:#FFF8ED; }
  .rf-trans-input.trans-ok    { background:#EDF7ED !important; border-color:var(--green)  !important; }
  .rf-trans-input.trans-wrong { background:#FFF8ED !important; border-color:var(--yellow) !important; }

  /* Explanation */
  .rf-explanation { display:none;grid-column:1/-1;margin-top:8px;padding:10px 12px;background:#FFF8ED;border:1px solid #FDE68A;border-radius:8px;font-size:13px;line-height:1.55;color:#78350f; }
  .rf-explanation.show { display:block; }

  /* Translation input */
  .rf-trans-cell { padding-left:8px; }
  .rf-trans-input {
    width:100%;height:30px;
    border:1.5px solid var(--border);border-radius:7px;
    background:var(--white);
    font-family:'Noto Sans',sans-serif;font-size:13px;
    color:var(--text);padding:0 8px;outline:none;
    transition:border-color 0.18s,box-shadow 0.18s;
  }
  .rf-trans-input:focus { border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,0.08); }
  .rf-trans-input:disabled { opacity:1;-webkit-text-fill-color:var(--text);pointer-events:none; }

  .feedback { display:none;margin:0 22px 16px;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:500;align-items:center;gap:8px; }
  .feedback.show { display:flex; }
  .feedback.warn { background:#FFF8ED;color:#b45309;border:1px solid #FDE68A; }
  .feedback.ok   { background:#EDF7ED;color:#2E7D32;border:1px solid #C8E6C9; }
  .feedback svg  { width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0; }
  .task-footer { padding:16px 22px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:16px; }
  .attempts-wrap { display:flex;gap:5px;align-items:center; }
  .attempt-dot { width:7px;height:7px;border-radius:50%;border:1.5px solid #D0CEC9;background:transparent;transition:background 0.2s,border-color 0.2s; }
  .attempt-dot.used { background:var(--muted);border-color:var(--muted); }
  .check-btn { background:#111;color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:14px;font-weight:600;font-family:'Noto Sans',sans-serif;cursor:pointer;transition:background 0.15s,transform 0.15s;display:flex;align-items:center;gap:6px; }
  .check-btn:hover { background:#333;transform:translateY(-1px); }
  .check-btn:active { transform:scale(0.97); }
  .check-btn:disabled { opacity:0.4;cursor:default;transform:none; }
  .check-btn.success { background:var(--green); } .check-btn.partial { background:var(--yellow); }
  .check-btn svg { width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round; }

  @media(max-width:600px){
    body{padding:4.5rem 1rem 2rem}.task-content{padding:14px 10px}.task-footer{padding:12px 12px}.task-header{padding:16px 12px 12px}
    .rf-header,.rf-row{grid-template-columns:90px 44px 44px 44px 44px 1fr;padding:8px 8px}
    .rf-header-col{font-size:10px}.rf-statement{font-size:13px}.rf-check{width:17px;height:17px}
    .rf-trans-input{font-size:12px}
  }
</style>
</head>
<body>

<header>
  <div class="sitename">
    <a href="lektionsuebersicht.html">Latein*</a>
    <span class="sep">›</span>
    <a href="lektion02.html" class="sub">Lektion 2</a>
    <span class="sep2">›</span>
    <span class="sub2">Nominativ oder Akkusativ?</span>
  </div>
  <div class="topbar">
    <button class="icon-btn bell-btn" title="Benachrichtigungen" onclick="handleBell()">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="dot" id="bellDot"></span>
    </button>
    <div class="user-wrap">
      <button class="icon-btn user-btn" title="Benutzerprofil" onclick="toggleDropdown()">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <div class="dropdown" id="dropdown">
        <div class="dropdown-header">
          <div class="dropdown-name">Max Mustermann</div>
          <div class="dropdown-email">max@beispiel.de</div>
        </div>
        <button class="dropdown-item" onclick="closeDropdown()">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil
        </button>
        <button class="dropdown-item" onclick="closeDropdown()">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Einstellungen
        </button>
        <div class="dropdown-sep-line"></div>
        <button class="dropdown-item danger" onclick="closeDropdown()">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Abmelden
        </button>
      </div>
    </div>
  </div>
</header>

<div class="page-wrap">
  <div class="task-card">
    <div class="task-header">
      <div class="task-title">Nominativ oder Akkusativ?</div>
      <div class="task-instruction">Kreuze an, um welchen Kasus und Numerus es sich handelt und übersetze die Form mit bestimmtem Artikel.</div>
    </div>
    <div class="task-content">
      <div class="rf-table" id="rfTable">
        <div class="rf-header">
          <div class="rf-header-label">Wort</div>
          <div class="rf-header-col">Nom.</div>
          <div class="rf-header-col">Akk.</div>
          <div class="rf-header-col">Sg.</div>
          <div class="rf-header-col">Pl.</div>
          <div class="rf-header-trans">Übersetzung</div>
        </div>
      </div>
    </div>
    <div class="feedback" id="feedback">
      <svg id="feedbackIcon" viewBox="0 0 24 24"></svg>
      <span id="feedbackText"></span>
    </div>
    <div class="task-footer">
      <div class="attempts-wrap">
        <div class="attempt-dot" id="dot1"></div>
        <div class="attempt-dot" id="dot2"></div>
        <div class="attempt-dot" id="dot3"></div>
      </div>
      <button class="check-btn" id="checkBtn" onclick="checkAnswers()">Überprüfen</button>
    </div>
  </div>
</div>

<script>
  // kasus: 'nom'|'akk'|'both'   numerus: 'sg'|'pl'|'both'
  // trans: array of accepted translations (lowercase comparison)
  const items = [
    { id: 'patrem',   label: 'patrem',   kasus: 'akk',  numerus: 'sg', trans: ['den Vater'],                                   explanation: 'patrem ist Akkusativ Singular von pater (konsonantische Deklination).' },
    { id: 'dominae',  label: 'dominae',  kasus: 'nom',  numerus: 'pl', trans: ['die Herrinnen'],                                explanation: 'dominae ist Nominativ Plural (a-Deklination).' },
    { id: 'sorores',  label: 'sorōrēs',  kasus: 'both', numerus: 'pl', trans: ['die Schwestern'],                               explanation: 'sorōrēs ist Nominativ und Akkusativ Plural (konsonantische Deklination).' },
    { id: 'servum',   label: 'servum',   kasus: 'akk',  numerus: 'sg', trans: ['den Sklaven'],                                  explanation: 'servum ist Akkusativ Singular von servus (o-Deklination).' },
    { id: 'dominos',  label: 'dominōs',  kasus: 'akk',  numerus: 'pl', trans: ['die Herren'],                                   explanation: 'dominōs ist Akkusativ Plural von dominus (o-Deklination).' },
    { id: 'puellas',  label: 'puellās',  kasus: 'akk',  numerus: 'pl', trans: ['die Mädchen'],                                  explanation: 'puellās ist Akkusativ Plural von puella (a-Deklination).' },
    { id: 'labor',    label: 'labor',    kasus: 'nom',  numerus: 'sg', trans: ['die Arbeit', 'die Mühe', 'die Anstrengung'],    explanation: 'labor ist Nominativ Singular (konsonantische Deklination).' },
    { id: 'avi',      label: 'avī',      kasus: 'nom',  numerus: 'pl', trans: ['die Großväter', 'die Opas'],                    explanation: 'avī ist Nominativ Plural von avus (o-Deklination).' },
    { id: 'culinam',  label: 'culīnam',  kasus: 'akk',  numerus: 'sg', trans: ['die Küche'],                                    explanation: 'culīnam ist Akkusativ Singular von culīna (a-Deklination).' },
  ];

  const KEY  = 'l02_nom_oder_akk';
  const NEXT = 'deklinationsklassen-unterscheiden.html';

  // state: per item { nom, akk, sg, pl, trans }
  let sel    = {};
  let transInputs = {};
  let tries  = 0;
  let locked = false;

  items.forEach(d => { sel[d.id] = { nom: false, akk: false, sg: false, pl: false }; });

  // ── Build rows ────────────────────────────────────────────────────────────
  const table = document.getElementById('rfTable');
  items.forEach(d => {
    const row = document.createElement('div');
    row.className = 'rf-row'; row.id = 'row-' + d.id;

    // Word
    const stmt = document.createElement('div');
    stmt.className = 'rf-statement'; stmt.textContent = d.label;
    row.appendChild(stmt);

    // 4 checkboxes
    ['nom','akk','sg','pl'].forEach(col => {
      const cell = document.createElement('div'); cell.className = 'rf-cell';
      const box  = document.createElement('div'); box.className = 'rf-check'; box.id = 'check-' + col + '-' + d.id;
      cell.appendChild(box);
      cell.onclick = () => toggleBox(d.id, col);
      row.appendChild(cell);
    });

    // Translation input
    const transCell = document.createElement('div'); transCell.className = 'rf-trans-cell';
    const input = document.createElement('input');
    input.type = 'text'; input.className = 'rf-trans-input'; input.id = 'trans-' + d.id;
    input.autocomplete = 'off'; input.autocorrect = 'off'; input.autocapitalize = 'sentences'; input.spellcheck = false;
    input.placeholder = '…';
    input.addEventListener('input', updateBtn);
    transCell.appendChild(input);
    row.appendChild(transCell);
    transInputs[d.id] = input;

    // Explanation
    if (d.explanation) {
      const exp = document.createElement('div');
      exp.className = 'rf-explanation'; exp.id = 'exp-' + d.id;
      exp.textContent = d.explanation; exp.style.gridColumn = '1 / -1';
      row.appendChild(exp);
    }

    table.appendChild(row);
  });

  function toggleBox(id, col) {
    if (locked) return;
    sel[id][col] = !sel[id][col];
    document.getElementById('check-' + col + '-' + id).classList.toggle('selected', sel[id][col]);
    updateBtn();
  }

  const checkBtn = document.getElementById('checkBtn');
  function updateBtn() {
    const allChecked  = items.every(d => sel[d.id].nom || sel[d.id].akk);
    const allNumerus  = items.every(d => sel[d.id].sg  || sel[d.id].pl);
    const allTrans    = items.every(d => transInputs[d.id].value.trim() !== '');
    checkBtn.disabled = !(allChecked && allNumerus && allTrans);
  }
  checkBtn.disabled = true;

  function norm(s) { return s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').trim(); }

  function isChecksCorrect(d) {
    const s = sel[d.id];
    const kasusOk = (() => {
      if (d.kasus === 'nom')  return s.nom && !s.akk;
      if (d.kasus === 'akk')  return !s.nom && s.akk;
      if (d.kasus === 'both') return s.nom && s.akk;
      return false;
    })();
    const numerusOk = (() => {
      if (d.numerus === 'sg')   return s.sg && !s.pl;
      if (d.numerus === 'pl')   return !s.sg && s.pl;
      if (d.numerus === 'both') return s.sg && s.pl;
      return false;
    })();
    return kasusOk && numerusOk;
  }

  function isTransCorrect(d) {
    const transVal = norm(transInputs[d.id].value);
    return d.trans.some(t => norm(t) === transVal);
  }

  function isCorrect(d) { return isChecksCorrect(d) && isTransCorrect(d); }

  // Apply visual feedback for checks and translation independently
  function applyRowFeedback(d, doLock) {
    const checksOk = isChecksCorrect(d);
    const transOk  = isTransCorrect(d);

    // Checkbox cells
    ['nom','akk','sg','pl'].forEach(col => {
      const el = document.getElementById('check-'+col+'-'+d.id);
      if (!el.classList.contains('selected')) return;
      el.classList.remove('locked-ok','locked-wrong');
      if (checksOk) el.classList.add('locked-ok');
      else          el.classList.add('locked-wrong');
    });

    // Row background follows checks
    const row = document.getElementById('row-' + d.id);
    row.classList.remove('checks-ok','checks-wrong');
    if (checksOk) row.classList.add('checks-ok');
    else          row.classList.add('checks-wrong');

    // Translation input
    const inp = transInputs[d.id];
    inp.classList.remove('trans-ok','trans-wrong');
    if (transOk) inp.classList.add('trans-ok');
    else         inp.classList.add('trans-wrong');

    if (doLock) inp.disabled = true;

    // Explanation: show if anything wrong
    if (!checksOk || !transOk) {
      const exp = document.getElementById('exp-' + d.id);
      if (exp) { exp.textContent = d.explanation + ' Lösung: ' + d.trans[0]; exp.classList.add('show'); }
    }
  }

  function checkAnswers() {
    if (locked || tries >= 3) return;
    tries++;
    document.getElementById('dot' + tries).classList.add('used');

    const score  = items.filter(isCorrect).length;
    const allOk  = score === items.length;
    const doLock = tries >= 3 || allOk;

    items.forEach(d => applyRowFeedback(d, doLock));

    if (doLock) { locked = true; saveState(allOk, score); }

    if (allOk) {
      showFeedback('ok','Ausgezeichnet! Alle Formen korrekt bestimmt und übersetzt!');
      winState(); return;
    }
    if (!doLock) {
      showFeedback('warn', `${score} von ${items.length} vollständig richtig. Versuche es nochmal!`);
      return;
    }
    checkBtn.classList.add('partial');
    checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
    checkBtn.disabled = false; checkBtn.onclick = () => window.location.href = NEXT;
    showFeedback('warn','Grün = korrekt, Gelb = noch nicht richtig.');
  }

  function winState() {
    saveState(true, items.length);
    checkBtn.classList.add('success');
    checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
    checkBtn.disabled = false; checkBtn.onclick = () => window.location.href = NEXT;
  }

  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

  function saveState(done, score) {
    const points = +(score * 0.5).toFixed(1);
    const transVals = {};
    items.forEach(d => { transVals[d.id] = transInputs[d.id].value.trim(); });
    lsSet(KEY, done ? 'done' : 'attempted');
    lsSet(KEY + '_sel',      JSON.stringify(sel));
    lsSet(KEY + '_trans',    JSON.stringify(transVals));
    lsSet(KEY + '_attempts', tries);
    lsSet(KEY + '_points',   points);
    lsSet(KEY + '_date',     new Date().toLocaleDateString('de-DE'));
    if (!done) lsSet(KEY + '_fail', 'true');
  }

  function showFeedback(type, text) {
    const fb = document.getElementById('feedback'), icon = document.getElementById('feedbackIcon');
    fb.className = 'feedback show ' + type;
    icon.innerHTML = type === 'ok' ? '<polyline points="20 6 9 17 4 12"/>' : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
    document.getElementById('feedbackText').textContent = text;
  }

  (function restoreState() {
    const savedDone  = lsGet(KEY) === 'done';
    const savedFail  = lsGet(KEY + '_fail') === 'true';
    const savedSel   = lsGet(KEY + '_sel');
    const savedTrans = lsGet(KEY + '_trans');
    const savedTries = parseInt(lsGet(KEY + '_attempts') || '0');
    if (!savedSel || (!savedDone && !savedFail)) return;
    sel = JSON.parse(savedSel);
    const transVals = JSON.parse(savedTrans || '{}');
    tries = savedTries; locked = true;
    for (let i = 1; i <= savedTries; i++) { const d = document.getElementById('dot' + i); if (d) d.classList.add('used'); }
    items.forEach(d => {
      ['nom','akk','sg','pl'].forEach(col => {
        document.getElementById('check-'+col+'-'+d.id).classList.toggle('selected', sel[d.id][col]);
      });
      transInputs[d.id].value = transVals[d.id] || '';
      applyRowFeedback(d, true);
    });
    if (savedDone) { checkBtn.classList.add('success'); showFeedback('ok','Ausgezeichnet! Alle Formen korrekt bestimmt und übersetzt!'); }
    else           { checkBtn.classList.add('partial'); showFeedback('warn','Grün = korrekt, Gelb = noch nicht richtig.'); }
    checkBtn.innerHTML = 'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
    checkBtn.disabled = false; checkBtn.onclick = () => window.location.href = NEXT;
  })();

  function handleBell()    { alert('Keine neuen Benachrichtigungen.'); }
  function toggleDropdown(){ document.getElementById('dropdown').classList.toggle('open'); }
  function closeDropdown() { document.getElementById('dropdown').classList.remove('open'); }
  document.addEventListener('click', e => { if (!document.querySelector('.user-wrap').contains(e.target)) closeDropdown(); });
</script>
</body>
</html>
