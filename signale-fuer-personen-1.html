<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signale für Personen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Lora:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scrollbar-gutter: stable;
      }

      :root {
        --bg: #f8f8f6;
        --white: #ffffff;
        --border: #e6e4df;
        --text: #111111;
        --muted: #898783;
        --accent: #c6613f;
        --green: #4caf50;
        --yellow: #f5a623;
        --radius: 14px;
      }

      body {
        font-family: "Noto Sans", sans-serif;
        background: var(--bg);
        min-height: 100vh;
        padding: 5rem 1.5rem 3rem;
        color: var(--text);
      }

      /* ── Header ── */
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        background: var(--white);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
        z-index: 200;
      }
      .sitename {
        font-size: 19px;
        font-weight: 700;
        color: #111;
        font-family: "Lora", serif;
        letter-spacing: -0.4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sitename a {
        color: inherit;
        text-decoration: none;
      }
      .sitename .sep {
        color: #cccccc;
        font-family: "Noto Sans", sans-serif;
        font-weight: 400;
        font-size: 17px;
      }
      .sitename .sep2 {
        color: #cccccc;
        font-family: "Noto Sans", sans-serif;
        font-weight: 400;
        font-size: 17px;
      }
      .sitename .sub {
        font-size: 12px;
        font-weight: 600;
        color: #555;
        font-family: "Noto Sans", sans-serif;
      }
      .sitename .sub2 {
        font-size: 12px;
        font-weight: 600;
        color: #555;
        font-family: "Noto Sans", sans-serif;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s;
        position: relative;
        outline: none;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        transform: scale(1.08);
      }
      .icon-btn:active {
        transform: scale(0.94);
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bell-btn svg {
        stroke: #898783;
      }
      .bell-btn .dot {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 7px;
        height: 7px;
        background: #cc3300;
        border-radius: 50%;
        border: 1.5px solid var(--white);
      }
      @keyframes ring {
        0%,
        100% {
          transform: rotate(0);
        }
        15% {
          transform: rotate(14deg);
        }
        30% {
          transform: rotate(-12deg);
        }
        45% {
          transform: rotate(8deg);
        }
        60% {
          transform: rotate(-5deg);
        }
        75% {
          transform: rotate(3deg);
        }
      }
      .bell-btn:hover svg {
        animation: ring 0.55s ease;
        transform-origin: 50% 3px;
      }
      .user-btn svg {
        stroke: #898783;
      }
      .user-wrap {
        position: relative;
      }
      .dropdown {
        display: none;
        position: absolute;
        top: 44px;
        right: 0;
        background: var(--white);
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        min-width: 190px;
        overflow: hidden;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.1);
      }
      .dropdown.open {
        display: block;
        animation: dropIn 0.15s ease;
      }
      @keyframes dropIn {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .dropdown-header {
        padding: 13px 16px 9px;
        border-bottom: 1px solid #e8e8e8;
        background: #f9f9f9;
      }
      .dropdown-name {
        font-size: 14px;
        font-weight: 600;
        color: #111;
      }
      .dropdown-email {
        font-size: 12px;
        color: #888;
        margin-top: 2px;
      }
      .dropdown-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        font-size: 14px;
        color: #111;
        cursor: pointer;
        border: none;
        background: none;
        width: 100%;
        font-family: "Noto Sans", sans-serif;
        transition: background 0.12s;
        text-align: left;
      }
      .dropdown-item:hover {
        background: #f4f4f4;
      }
      .dropdown-item svg {
        width: 15px;
        height: 15px;
        stroke: #555;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .dropdown-sep-line {
        height: 1px;
        background: #e8e8e8;
      }
      .dropdown-item.danger {
        color: #cc3300;
      }
      .dropdown-item.danger svg {
        stroke: #cc3300;
      }

      /* ── Page ── */
      .page-wrap {
        max-width: 780px;
        margin: 0 auto;
      }

      /* ── Task card ── */
      .task-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: visible;
      }
      .task-header {
        padding: 20px 22px 16px;
        border-bottom: 1px solid var(--border);
      }
      .task-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 6px;
        font-family: "Lora", serif;
      }
      .task-instruction {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.6;
      }

      /* ── Task content ── */
      .task-content {
        padding: 24px 22px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* ── Chip pool ── */
      .chip-pool {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 14px 16px;
        background: #efeeeb;
        border: 1px solid var(--border);
        border-radius: 10px;
        min-height: 52px;
        align-content: flex-start;
      }
      .chip {
        background: var(--white);
        border: 1.5px solid var(--border);
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 600;
        font-family: "Lora", serif;
        color: var(--text);
        cursor: grab;
        user-select: none;
        transition:
          box-shadow 0.15s,
          transform 0.15s,
          opacity 0.15s;
        white-space: nowrap;
      }
      .chip:hover {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        transform: translateY(-1px);
      }
      .chip.dragging {
        opacity: 0.5;
        cursor: grabbing;
      }
      .chip.used {
        visibility: hidden;
        pointer-events: none;
      }

      /* ── Conjugation table ── */
      .conj-table {
        width: 100%;
        border-collapse: collapse;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .conj-table thead th {
        background: #f2f1ef;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 10px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      .conj-table thead th:nth-child(1) {
        width: 28%;
      }
      .conj-table thead th:nth-child(2) {
        width: 28%;
        text-align: center;
      }
      .conj-table thead th:nth-child(3) {
        width: 44%;
        text-align: center;
      }

      .conj-table tbody tr {
        border-bottom: 1px solid var(--border);
      }
      .conj-table tbody tr:last-child {
        border-bottom: none;
      }
      .conj-table tbody tr:nth-child(4) {
        border-top: 2px solid var(--border);
      }

      .conj-table td {
        padding: 10px 16px;
        vertical-align: middle;
      }
      .conj-table td:nth-child(1) {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }
      .conj-table td:nth-child(2) {
        padding: 8px 12px;
        text-align: center;
      }
      .conj-table td:nth-child(3) {
        padding: 8px 12px;
        text-align: center;
      }

      /* Fixed (pre-filled) cell */
      .cell-fixed {
        font-size: 13px;
        font-weight: 700;
        font-family: "Lora", serif;
        color: var(--muted);
        font-style: italic;
        text-align: center;
      }

      /* ── Drop slot ── */
      .slot {
        min-height: 36px;
        border: 1.5px dashed #d0cec9;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #c0beb9;
        transition:
          border-color 0.2s,
          background 0.2s;
        cursor: pointer;
        position: relative;
        padding: 5px 10px;
        text-align: center;
        background: #fdfcfb;
      }
      .slot.drag-over {
        border-color: var(--accent);
        background: rgba(198, 97, 63, 0.05);
      }
      .slot.filled {
        border-style: solid;
        border-color: var(--border);
        background: #fff9e6;
        font-size: 13px;
        font-weight: 700;
        font-family: "Lora", serif;
        color: var(--text);
        cursor: pointer;
      }
      .slot.correct {
        border-color: var(--green) !important;
        border-width: 2px;
        background: #f0fbf0;
      }
      .slot.wrong {
        border-color: var(--yellow) !important;
        border-width: 2px;
        background: #fffbf0;
        cursor: pointer;
      }

      /* Slot badge */
      .slot-badge {
        position: absolute;
        top: -8px;
        right: -8px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .slot-badge.show {
        display: flex;
      }
      .slot-badge.ok {
        background: var(--green);
      }
      .slot-badge.fail {
        background: var(--yellow);
      }
      .slot-badge svg {
        width: 10px;
        height: 10px;
        stroke: #fff;
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Slot popover */
      .slot-popover {
        display: none;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        right: calc(100% + 8px);
        background: #111;
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        font-family: "Lora", serif;
        padding: 6px 10px;
        border-radius: 8px;
        white-space: nowrap;
        z-index: 50;
        pointer-events: none;
        animation: fadeLeft 0.15s ease;
      }
      .slot-popover::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 100%;
        transform: translateY(-50%);
        border: 5px solid transparent;
        border-left-color: #111;
      }
      .slot-popover.show {
        display: block;
      }
      @keyframes fadeLeft {
        from {
          opacity: 0;
          transform: translateY(-50%) translateX(4px);
        }
        to {
          opacity: 1;
          transform: translateY(-50%) translateX(0);
        }
      }

      /* ── Feedback ── */
      .feedback {
        display: none;
        margin: 0 22px 16px;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        align-items: center;
        gap: 8px;
      }
      .feedback.show {
        display: flex;
      }
      .feedback.warn {
        background: #fff8ed;
        color: #b45309;
        border: 1px solid #fde68a;
      }
      .feedback.ok {
        background: #edf7ed;
        color: #2e7d32;
        border: 1px solid #c8e6c9;
      }
      .feedback svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      /* ── Task footer ── */
      .task-footer {
        padding: 16px 22px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 16px;
      }
      .attempts-wrap {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .attempt-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 1.5px solid #d0cec9;
        background: transparent;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .attempt-dot.used {
        background: var(--muted);
        border-color: var(--muted);
      }

      .check-btn {
        background: #111;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 9px 20px;
        font-size: 14px;
        font-weight: 600;
        font-family: "Noto Sans", sans-serif;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.15s;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .check-btn:hover {
        background: #333;
        transform: translateY(-1px);
      }
      .check-btn:active {
        transform: scale(0.97);
      }
      .check-btn:disabled {
        opacity: 0.4;
        cursor: default;
        transform: none;
      }
      .check-btn.success {
        background: #4caf50;
      }
      .check-btn.partial {
        background: #f5a623;
      }
      .check-btn svg {
        width: 14px;
        height: 14px;
        stroke: #fff;
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ── Floating chip pool ── */
      .chip-pool-float {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 150;
        background: var(--bg);
        border-top: 1px solid var(--border);
        padding: 10px 22px 14px;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
        display: none;
      }
      .chip-pool-float.visible {
        display: block;
      }
      .chip-pool-float .chip-pool {
        margin-bottom: 0;
      }

      @media (max-width: 600px) {
        body {
          padding: 4.5rem 1rem 2rem;
        }
        .task-content {
          padding: 16px 14px;
        }
        .conj-table td {
          padding: 8px 8px;
        }
        .conj-table thead th {
          padding: 8px 8px;
          font-size: 10px;
        }
        .chip {
          font-size: 11px;
          padding: 4px 9px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="sitename">
        <a href="lektionsuebersicht.html">Latein*</a>
        <span class="sep">›</span>
        <a href="lektion03.html" class="sub">Lektion 3</a>
        <span class="sep2">›</span>
        <span class="sub2">Signale für Personen</span>
      </div>
      <div class="topbar">
        <button
          class="icon-btn bell-btn"
          title="Benachrichtigungen"
          onclick="handleBell()"
        >
          <svg viewBox="0 0 24 24">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span class="dot" id="bellDot"></span>
        </button>
        <div class="user-wrap">
          <button
            class="icon-btn user-btn"
            title="Benutzerprofil"
            onclick="toggleDropdown()"
          >
            <svg viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </button>
          <div class="dropdown" id="dropdown">
            <div class="dropdown-header">
              <div class="dropdown-name">Max Mustermann</div>
              <div class="dropdown-email">max@beispiel.de</div>
            </div>
            <button class="dropdown-item" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" /></svg
              >Profil
            </button>
            <button class="dropdown-item" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                /></svg
              >Einstellungen
            </button>
            <div class="dropdown-sep-line"></div>
            <button class="dropdown-item danger" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" /></svg
              >Abmelden
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="page-wrap">
      <div class="task-card">
        <div class="task-header">
          <div class="task-title">Signale für Personen</div>
          <div class="task-instruction">
            Ordne die fehlenden Personalendungen und die Verbformen in die
            Tabelle ein.
          </div>
        </div>

        <div class="task-content">
          <div class="chip-pool" id="chipPool"></div>

          <table class="conj-table">
            <thead>
              <tr>
                <th>Person / Numerus</th>
                <th style="text-align: center">Personalendung</th>
                <th style="text-align: center">Latein</th>
              </tr>
            </thead>
            <tbody id="conjBody"></tbody>
          </table>
        </div>

        <div class="feedback" id="feedback">
          <svg id="feedbackIcon" viewBox="0 0 24 24"></svg>
          <span id="feedbackText"></span>
        </div>

        <div class="task-footer">
          <div class="attempts-wrap">
            <div class="attempt-dot" id="dot1"></div>
            <div class="attempt-dot" id="dot2"></div>
            <div class="attempt-dot" id="dot3"></div>
          </div>
          <button class="check-btn" id="checkBtn" onclick="checkAnswers()">
            Überprüfen
          </button>
        </div>
      </div>
    </div>

    <script>
      // ── Daten ─────────────────────────────────────────────────────────────────
      // endFixed: true → Personalendung ist fest eingetragen (kein Slot)
      // endFixed: string → zeigt diesen Text als festen Wert
      const items = [
        {
          label: "1. Pers. Sing.",
          endFixed: false,
          endAns: "-o",
          latinFixed: false,
          latinAns: "dīcō",
        },
        {
          label: "2. Pers. Sing.",
          endFixed: false,
          endAns: "-s",
          latinFixed: false,
          latinAns: "intrās",
        },
        {
          label: "3. Pers. Sing.",
          endFixed: "-t",
          endAns: null,
          latinFixed: "clāmat",
          latinAns: null,
        },
        {
          label: "1. Pers. Plur.",
          endFixed: false,
          endAns: "-mus",
          latinFixed: false,
          latinAns: "vidēmus",
        },
        {
          label: "2. Pers. Plur.",
          endFixed: "-tis",
          endAns: null,
          latinFixed: false,
          latinAns: "dēbētis",
        },
        {
          label: "3. Pers. Plur.",
          endFixed: false,
          endAns: "-nt",
          latinFixed: false,
          latinAns: "dēlectant",
        },
      ];

      // Chip-Pool: nur die zu ziehenden Elemente (ohne -t und -tis, ohne videt)
      const chipTexts = [
        "intrās",
        "dēlectant",
        "-mus",
        "dēbētis",
        "dīcō",
        "-s",
        "vidēmus",
        "-o",
        "-nt",
      ];

      const KEY = "task_l03_signale_personen_1";
      const NEXT = "richtig-bestimmt-1.html";

      // ── State ─────────────────────────────────────────────────────────────────
      // Slots: pro Zeile maximal 2 (end + latin), aber nur wenn nicht fixed
      // Slot-ID: `${rowIndex}-end` und `${rowIndex}-latin`
      const slotState = {}; // key: '0-end', '0-latin', etc.
      const slotEls = {}; // same keys → DOM elements
      const slotDefs = []; // { key, answer } for all draggable slots

      items.forEach((item, i) => {
        if (!item.endFixed) {
          slotState[i + "-end"] = null;
        }
        if (!item.latinFixed) {
          slotState[i + "-latin"] = null;
        }
      });

      let attempts = 0;
      let revealed = false;
      let locked = false;
      let dragSource = null;

      const pool = document.getElementById("chipPool");

      // ── Tabelle aufbauen ──────────────────────────────────────────────────────
      const tbody = document.getElementById("conjBody");

      items.forEach((item, i) => {
        const tr = document.createElement("tr");

        // Spalte 1: Person/Numerus
        const td1 = document.createElement("td");
        td1.textContent = item.label;
        tr.appendChild(td1);

        // Spalte 2: Personalendung
        const td2 = document.createElement("td");
        td2.style.textAlign = "center";
        if (item.endFixed) {
          td2.innerHTML = `<span class="cell-fixed">${item.endFixed}</span>`;
        } else {
          td2.appendChild(makeSlot(i + "-end", item.endAns));
        }
        tr.appendChild(td2);

        // Spalte 3: Latein
        const td3 = document.createElement("td");
        td3.style.textAlign = "center";
        if (item.latinFixed) {
          td3.innerHTML = `<span class="cell-fixed">${item.latinFixed}</span>`;
        } else {
          td3.appendChild(makeSlot(i + "-latin", item.latinAns));
        }
        tr.appendChild(td3);

        tbody.appendChild(tr);
      });

      function makeSlot(key, answer) {
        slotDefs.push({ key, answer });

        const slot = document.createElement("div");
        slot.className = "slot";
        slot.id = "slot-" + key;
        slot.innerHTML = `
      <span class="slot-badge" id="badge-${key}"></span>
      <span class="slot-text" style="color:#C0BEB9">—</span>
      <div class="slot-popover" id="popover-${key}">${answer}</div>`;

        slot.addEventListener("dragover", (e) => {
          if (locked || !dragSource) return;
          e.preventDefault();
          slot.classList.add("drag-over");
        });
        slot.addEventListener("dragleave", () =>
          slot.classList.remove("drag-over"),
        );
        slot.addEventListener("drop", (e) => {
          e.preventDefault();
          slot.classList.remove("drag-over");
          if (!dragSource || locked || revealed) return;
          dropOnSlot(key);
        });
        slot.addEventListener("click", () => {
          if (revealed && slot.classList.contains("wrong")) {
            document.getElementById("popover-" + key).classList.toggle("show");
          }
        });

        slotEls[key] = slot;
        addTouchDrag(slot, null, key);
        slot.draggable = true;
        slot.addEventListener("dragstart", (e) => {
          if (locked || slotState[key] === null) {
            e.preventDefault();
            return;
          }
          dragSource = { type: "slot", fromSlot: key, text: slotState[key] };
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", slotState[key]);
          slot.classList.add("dragging");
        });
        slot.addEventListener("dragend", () => {
          slot.classList.remove("dragging");
          dragSource = null;
        });

        return slot;
      }

      // ── Chip-Pool aufbauen ────────────────────────────────────────────────────
      chipTexts.forEach((text) => pool.appendChild(makeChipEl(text)));

      function makeChipEl(text) {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.textContent = text;
        chip.draggable = true;
        chip.dataset.text = text;
        chip.addEventListener("dragstart", (e) => {
          if (locked) {
            e.preventDefault();
            return;
          }
          dragSource = { type: "pool", text };
          chip.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", text);
        });
        chip.addEventListener("dragend", () => {
          chip.classList.remove("dragging");
          dragSource = null;
        });
        addTouchDrag(chip, { type: "pool", text });
        return chip;
      }

      // ── Pool drop-back ────────────────────────────────────────────────────────
      pool.addEventListener("dragover", (e) => {
        if (locked || !dragSource || dragSource.type !== "slot") return;
        e.preventDefault();
        pool.style.background = "rgba(198,97,63,0.05)";
      });
      pool.addEventListener("dragleave", () => {
        pool.style.background = "";
      });
      pool.addEventListener("drop", (e) => {
        e.preventDefault();
        pool.style.background = "";
        if (!dragSource || dragSource.type !== "slot" || locked) return;
        clearSlot(dragSource.fromSlot);
        returnChipToPool(dragSource.text);
        dragSource = null;
      });

      // ── Kernlogik ─────────────────────────────────────────────────────────────
      function placeOnSlot(text, fromKey, targetKey) {
        if (fromKey) clearSlot(fromKey);
        if (slotState[targetKey] !== null)
          returnChipToPool(slotState[targetKey]);
        removeChipFromPool(text);
        slotState[targetKey] = text;
        renderSlot(targetKey);
      }

      function dropOnSlot(targetKey) {
        if (!dragSource) return;
        if (dragSource.type === "pool")
          placeOnSlot(dragSource.text, null, targetKey);
        else placeOnSlot(dragSource.text, dragSource.fromSlot, targetKey);
        dragSource = null;
      }

      function renderSlot(key) {
        const slot = slotEls[key];
        const txtEl = slot.querySelector(".slot-text");
        const text = slotState[key];
        if (text) {
          slot.classList.add("filled");
          txtEl.style.color = "var(--text)";
          txtEl.textContent = text;
        } else {
          slot.classList.remove("filled");
          txtEl.style.color = "#C0BEB9";
          txtEl.textContent = "—";
        }
      }

      function clearSlot(key) {
        slotState[key] = null;
        renderSlot(key);
      }
      function removeChipFromPool(text) {
        const chip = [...pool.querySelectorAll(".chip")].find(
          (c) => c.dataset.text === text,
        );
        if (chip) chip.classList.add("used");
      }
      function returnChipToPool(text) {
        const chip = [...pool.querySelectorAll(".chip")].find(
          (c) => c.dataset.text === text,
        );
        if (chip) chip.classList.remove("used");
      }

      // ── Touch-Drag ────────────────────────────────────────────────────────────
      let touchGhost = null;
      let touchDragSource = null;

      function addTouchDrag(elem, poolSource, slotKey) {
        elem.addEventListener(
          "touchstart",
          (e) => {
            if (locked) return;
            if (poolSource) {
              if (elem.classList.contains("used")) return;
              touchDragSource = { type: "pool", text: poolSource.text };
            } else {
              if (slotState[slotKey] === null) return;
              touchDragSource = {
                type: "slot",
                fromSlot: slotKey,
                text: slotState[slotKey],
              };
            }
            e.preventDefault();
            const touch = e.touches[0];
            touchGhost = elem.cloneNode(true);
            touchGhost.classList.remove("used");
            touchGhost.style.cssText = `position:fixed;z-index:9999;pointer-events:none;opacity:0.85;transform:scale(1.08);transition:none;left:${touch.clientX - elem.offsetWidth / 2}px;top:${touch.clientY - elem.offsetHeight / 2}px;width:${elem.offsetWidth}px;margin:0;`;
            document.body.appendChild(touchGhost);
            elem.classList.add("dragging");
          },
          { passive: false },
        );

        elem.addEventListener(
          "touchmove",
          (e) => {
            if (!touchGhost || !touchDragSource) return;
            e.preventDefault();
            const touch = e.touches[0];
            touchGhost.style.left =
              touch.clientX - touchGhost.offsetWidth / 2 + "px";
            touchGhost.style.top =
              touch.clientY - touchGhost.offsetHeight / 2 + "px";
            touchGhost.style.pointerEvents = "none";
            const under = document.elementFromPoint(
              touch.clientX,
              touch.clientY,
            );
            Object.values(slotEls).forEach((s) =>
              s.classList.remove("drag-over"),
            );
            const slotEl = under && under.closest(".slot");
            if (slotEl) slotEl.classList.add("drag-over");
            if (touchDragSource.type === "slot") {
              pool.style.background =
                under && (under === pool || pool.contains(under))
                  ? "rgba(198,97,63,0.05)"
                  : "";
            }
          },
          { passive: false },
        );

        elem.addEventListener(
          "touchend",
          (e) => {
            if (!touchGhost || !touchDragSource) return;
            e.preventDefault();
            const touch = e.changedTouches[0];
            touchGhost.style.pointerEvents = "none";
            const under = document.elementFromPoint(
              touch.clientX,
              touch.clientY,
            );
            Object.values(slotEls).forEach((s) =>
              s.classList.remove("drag-over"),
            );
            pool.style.background = "";
            document.body.removeChild(touchGhost);
            touchGhost = null;
            elem.classList.remove("dragging");
            if (!under || revealed) {
              touchDragSource = null;
              return;
            }
            const targetSlotEl = under.closest(".slot");
            if (targetSlotEl) {
              const targetKey = targetSlotEl.id.replace("slot-", "");
              if (slotEls[targetKey]) {
                dragSource = touchDragSource;
                dropOnSlot(targetKey);
              }
            }
            if (
              touchDragSource.type === "slot" &&
              (under === pool || pool.contains(under))
            ) {
              clearSlot(touchDragSource.fromSlot);
              returnChipToPool(touchDragSource.text);
            }
            touchDragSource = null;
            dragSource = null;
          },
          { passive: false },
        );
      }

      // ── Überprüfen ────────────────────────────────────────────────────────────
      function checkAnswers() {
        if (revealed) return;
        const allFilled = Object.values(slotState).every((s) => s !== null);
        if (!allFilled) {
          showFeedback("warn", "Fülle zuerst alle Felder aus!");
          return;
        }

        attempts++;
        document.getElementById("dot" + attempts).classList.add("used");

        const allCorrect = slotDefs.every((d) => slotState[d.key] === d.answer);
        if (allCorrect) {
          revealAll();
          showFeedback("ok", "Ausgezeichnet! Alle Formen richtig eingeordnet!");
          winState();
          return;
        }
        if (attempts < 3) {
          showFeedback(
            "warn",
            "Das ist noch nicht richtig. Versuche es nochmal!",
          );
          return;
        }

        // 3. Versuch
        revealed = true;
        showBadges();
        showFeedback(
          "warn",
          "Klicke auf die gelb umrandeten Felder um die richtige Lösung zu sehen.",
        );
        saveState(false);
        lockAll();
        const btn = document.getElementById("checkBtn");
        btn.classList.add("partial");
        btn.innerHTML =
          'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
        btn.disabled = false;
        btn.onclick = () => (window.location.href = NEXT);
      }

      function showBadges() {
        slotDefs.forEach((d) => {
          const correct = slotState[d.key] === d.answer;
          slotEls[d.key].classList.add(correct ? "correct" : "wrong");
          const badge = document.getElementById("badge-" + d.key);
          badge.classList.add("show", correct ? "ok" : "fail");
          badge.innerHTML = correct
            ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
            : '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>';
        });
      }

      function revealAll() {
        slotDefs.forEach((d) => {
          slotEls[d.key].classList.add("correct");
          const badge = document.getElementById("badge-" + d.key);
          badge.classList.add("show", "ok");
          badge.innerHTML =
            '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
        });
      }

      function winState() {
        lockAll();
        revealed = true;
        saveState(true);
        const btn = document.getElementById("checkBtn");
        btn.classList.add("success");
        btn.innerHTML =
          'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
        btn.onclick = () => (window.location.href = NEXT);
        btn.disabled = false;
      }

      function lockAll() {
        locked = true;
        document.querySelectorAll(".chip").forEach((c) => {
          c.draggable = false;
          c.style.cursor = "default";
        });
        Object.values(slotEls).forEach((s) => {
          s.draggable = false;
        });
      }

      function saveState(done) {
        const correctCount = slotDefs.filter(
          (d) => slotState[d.key] === d.answer,
        ).length;
        const points = +(correctCount * 0.5).toFixed(2);
        const slotData = {};
        slotDefs.forEach((d) => {
          slotData[d.key] = {
            filled: slotState[d.key] || "",
            correct: slotState[d.key] === d.answer,
          };
        });
        localStorage.setItem(KEY, done ? "done" : "attempted");
        localStorage.setItem(KEY + "_slots", JSON.stringify(slotData));
        localStorage.setItem(KEY + "_attempts", attempts);
        localStorage.setItem(KEY + "_points", points);
        localStorage.setItem(
          KEY + "_date",
          new Date().toLocaleDateString("de-DE"),
        );
        if (!done) localStorage.setItem(KEY + "_fail", "true");
      }

      function showFeedback(type, text) {
        const fb = document.getElementById("feedback");
        fb.className = "feedback show " + type;
        document.getElementById("feedbackIcon").innerHTML =
          type === "ok"
            ? '<polyline points="20 6 9 17 4 12"/>'
            : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
        document.getElementById("feedbackText").textContent = text;
      }

      // ── Floating chip pool ────────────────────────────────────────────────────
      const floatEl = document.getElementById("chipPoolFloat");
      const floatInner = document.getElementById("chipPoolFloatInner");
      let lastScrollY = window.scrollY;
      let poolOriginalTop = null;

      function syncFloatPool() {
        floatInner.innerHTML = "";
        pool.querySelectorAll(".chip:not(.used)").forEach((chip) => {
          const clone = chip.cloneNode(true);
          clone.addEventListener("dragstart", (e) => {
            if (locked) {
              e.preventDefault();
              return;
            }
            dragSource = { type: "pool", text: chip.dataset.text };
            chip.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", chip.dataset.text);
          });
          clone.addEventListener("dragend", () => {
            chip.classList.remove("dragging");
            dragSource = null;
          });
          floatInner.appendChild(clone);
        });
      }

      window.addEventListener(
        "scroll",
        () => {
          if (poolOriginalTop === null)
            poolOriginalTop = pool.getBoundingClientRect().top + window.scrollY;
          const scrollY = window.scrollY;
          const scrollingUp = scrollY < lastScrollY;
          const poolPastTop = poolOriginalTop < scrollY + 120;
          if (scrollingUp && poolPastTop) {
            floatEl.classList.add("visible");
            syncFloatPool();
          } else if (!poolPastTop) floatEl.classList.remove("visible");
          lastScrollY = scrollY;
        },
        { passive: true },
      );

      // ── Restore ───────────────────────────────────────────────────────────────
      (function restoreState() {
        const savedSlots = localStorage.getItem(KEY + "_slots");
        const savedDone = localStorage.getItem(KEY) === "done";
        const savedFail = localStorage.getItem(KEY + "_fail") === "true";
        const savedAttempts = parseInt(
          localStorage.getItem(KEY + "_attempts") || "0",
        );
        if (!savedSlots || (!savedDone && !savedFail)) return;

        const slotData = JSON.parse(savedSlots);
        Object.entries(slotData).forEach(([key, s]) => {
          if (!s.filled || !(key in slotState)) return;
          slotState[key] = s.filled;
          renderSlot(key);
          removeChipFromPool(s.filled);
        });

        for (let i = 1; i <= savedAttempts; i++) {
          const d = document.getElementById("dot" + i);
          if (d) d.classList.add("used");
        }

        slotDefs.forEach((d) => {
          const s = slotData[d.key];
          if (!s) return;
          slotEls[d.key].classList.add(s.correct ? "correct" : "wrong");
          const badge = document.getElementById("badge-" + d.key);
          badge.classList.add("show", s.correct ? "ok" : "fail");
          badge.innerHTML = s.correct
            ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
            : '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>';
        });

        revealed = true;
        attempts = savedAttempts;
        lockAll();

        const btn = document.getElementById("checkBtn");
        if (savedDone) {
          btn.classList.add("success");
          showFeedback("ok", "Ausgezeichnet! Alle Formen richtig eingeordnet!");
        } else {
          btn.classList.add("partial");
          showFeedback(
            "warn",
            "Klicke auf die gelb umrandeten Felder um die richtige Lösung zu sehen.",
          );
        }
        btn.innerHTML =
          'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
        btn.onclick = () => (window.location.href = NEXT);
        btn.disabled = false;
      })();

      // ── Bell & Dropdown ───────────────────────────────────────────────────────
      function handleBell() {
        alert("Keine neuen Benachrichtigungen.");
      }
      function toggleDropdown() {
        document.getElementById("dropdown").classList.toggle("open");
      }
      function closeDropdown() {
        document.getElementById("dropdown").classList.remove("open");
      }
      document.addEventListener("click", (e) => {
        if (!document.querySelector(".user-wrap").contains(e.target))
          closeDropdown();
      });
    </script>

    <div class="chip-pool-float" id="chipPoolFloat">
      <div class="chip-pool" id="chipPoolFloatInner"></div>
    </div>
  </body>
</html>
