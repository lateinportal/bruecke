<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer ist wer? (3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Lora:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-gutter: stable; }

  :root {
    --bg:      #f8f8f6;
    --white:   #ffffff;
    --border:  #E6E4DF;
    --text:    #111111;
    --muted:   #898783;
    --accent:  #c6613f;
    --green:   #4CAF50;
    --yellow:  #F5A623;
    --radius:  14px;
    --blue:    #2563eb;
  }

  body {
    font-family: 'Noto Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 5rem 1.5rem 3rem;
    color: var(--text);
  }

  /* ── Header ── */
  header {
    position: fixed; top: 0; left: 0; right: 0;
    height: 56px; background: var(--white);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem; z-index: 200;
  }
  .sitename { font-size: 19px; font-weight: 700; color: #111; font-family: 'Lora', serif; letter-spacing: -0.4px; display: flex; align-items: center; gap: 6px; }
  .sitename a { color: inherit; text-decoration: none; }
  .sitename .sep  { color: #CCCCCC; font-family: 'Noto Sans', sans-serif; font-weight: 400; font-size: 17px; }
  .sitename .sep2 { color: #CCCCCC; font-family: 'Noto Sans', sans-serif; font-weight: 400; font-size: 17px; }
  .sitename .sub  { font-size: 12px; font-weight: 600; color: #555; font-family: 'Noto Sans', sans-serif; }
  .sitename .sub2 { font-size: 12px; font-weight: 600; color: #555; font-family: 'Noto Sans', sans-serif; }
  .topbar { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 12px; border: 1px solid transparent; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; position: relative; outline: none; flex-shrink: 0; }
  .icon-btn:hover { transform: scale(1.08); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 16px; height: 16px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bell-btn svg { stroke: #898783; }
  .bell-btn .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: #CC3300; border-radius: 50%; border: 1.5px solid var(--white); }
  @keyframes ring { 0%,100%{transform:rotate(0)} 15%{transform:rotate(14deg)} 30%{transform:rotate(-12deg)} 45%{transform:rotate(8deg)} 60%{transform:rotate(-5deg)} 75%{transform:rotate(3deg)} }
  .bell-btn:hover svg { animation: ring 0.55s ease; transform-origin: 50% 3px; }
  .user-btn svg { stroke: #898783; }
  .user-wrap { position: relative; }
  .dropdown { display: none; position: absolute; top: 44px; right: 0; background: var(--white); border: 1px solid #E0E0E0; border-radius: 10px; min-width: 190px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,0.10); }
  .dropdown.open { display: block; animation: dropIn 0.15s ease; }
  @keyframes dropIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
  .dropdown-header { padding: 13px 16px 9px; border-bottom: 1px solid #E8E8E8; background: #F9F9F9; }
  .dropdown-name { font-size: 14px; font-weight: 600; color: #111; }
  .dropdown-email { font-size: 12px; color: #888; margin-top: 2px; }
  .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 14px; color: #111; cursor: pointer; border: none; background: none; width: 100%; font-family: 'Noto Sans', sans-serif; transition: background 0.12s; text-align: left; }
  .dropdown-item:hover { background: #F4F4F4; }
  .dropdown-item svg { width: 15px; height: 15px; stroke: #555; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .dropdown-sep-line { height: 1px; background: #E8E8E8; }
  .dropdown-item.danger { color: #CC3300; }
  .dropdown-item.danger svg { stroke: #CC3300; }

  /* ── Page ── */
  .page-wrap { max-width: 780px; margin: 0 auto; }

  /* ── Task card ── */
  .task-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: visible; }
  .task-header { padding: 20px 22px 16px; border-bottom: 1px solid var(--border); }
  .task-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; font-family: 'Lora', serif; }
  .task-instruction { font-size: 14px; color: var(--muted); line-height: 1.6; }

  /* ── Task content ── */
  .task-content { padding: 24px 22px; display: flex; flex-direction: column; gap: 10px; }

  /* ── Chip pool ── */
  .chip-pool {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 14px 16px;
    background: #EFEEEB;
    border: 1px solid var(--border);
    border-radius: 10px;
    min-height: 52px;
    align-content: flex-start;
    margin-bottom: 6px;
  }
  .chip {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px; font-weight: 600;
    font-style: italic;
    color: var(--text);
    cursor: grab;
    user-select: none;
    transition: box-shadow 0.15s, transform 0.15s, opacity 0.15s;
    white-space: nowrap;
  }
  .chip:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); transform: translateY(-1px); }
  .chip.dragging { opacity: 0.5; cursor: grabbing; }
  .chip.used { visibility: hidden; pointer-events: none; }

  /* ── Sentence rows ── */
  .sentence-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    background: #FDFCFB;
  }
  .sentence-latin {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    line-height: 1.7;
  }
  .sentence-num {
    font-family: 'Noto Sans', sans-serif;
    font-style: normal;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    min-width: 18px;
    flex-shrink: 0;
  }
  .sentence-german {
    font-size: 13px;
    color: var(--muted);
    padding-left: 24px;
  }

  /* ── Drop slot (inline) ── */
  .slot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 90px;
    height: 34px;
    border: 1.5px dashed #D0CEC9;
    border-radius: 8px;
    font-size: 13px; color: #C0BEB9;
    font-style: italic;
    font-family: 'Lora', serif;
    transition: border-color 0.2s, background 0.2s;
    cursor: pointer;
    position: relative;
    padding: 4px 10px;
    background: #FFF;
    vertical-align: middle;
  }
  .slot.drag-over { border-color: var(--accent); background: rgba(198,97,63,0.05); }
  .slot.filled { border-style: solid; border-color: var(--border); background: #FFF9E6; color: var(--text); font-weight: 700; cursor: pointer; }
  .slot.correct { border-color: var(--green) !important; border-style: solid; border-width: 2px; background: #EDF7ED; }
  .slot.wrong   { border-color: var(--yellow) !important; border-style: solid; border-width: 2px; background: #FFF8ED; cursor: pointer; }

  /* Slot badge */
  .slot-badge {
    position: absolute; top: -9px; right: -9px;
    width: 18px; height: 18px;
    border-radius: 50%; display: none;
    align-items: center; justify-content: center; z-index: 10;
  }
  .slot-badge.show { display: flex; }
  .slot-badge.ok   { background: var(--green); }
  .slot-badge.fail { background: var(--yellow); }
  .slot-badge svg  { width: 9px; height: 9px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  /* Slot popover */
  .slot-popover {
    display: none; position: absolute;
    bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: #111; color: #fff;
    font-size: 11px; font-weight: 600; font-style: normal;
    padding: 5px 9px; border-radius: 7px;
    white-space: nowrap; z-index: 50; pointer-events: none;
    animation: fadeUp 0.15s ease;
    font-family: 'Noto Sans', sans-serif;
  }
  .slot-popover::after {
    content: ''; position: absolute;
    top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: #111;
  }
  .slot-popover.show { display: block; }
  @keyframes fadeUp { from{opacity:0;transform:translateX(-50%) translateY(4px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

  /* ── Feedback ── */
  .feedback {
    display: none; margin: 0 22px 16px;
    padding: 12px 14px; border-radius: 10px;
    font-size: 14px; font-weight: 500;
    align-items: center; gap: 8px;
  }
  .feedback.show { display: flex; }
  .feedback.warn { background: #FFF8ED; color: #b45309; border: 1px solid #FDE68A; }
  .feedback.ok   { background: #EDF7ED; color: #2E7D32; border: 1px solid #C8E6C9; }
  .feedback svg  { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ── Task footer ── */
  .task-footer {
    padding: 16px 22px; border-top: 1px solid var(--border);
    display: flex; align-items: center;
    justify-content: flex-end; gap: 16px;
  }
  .attempts-wrap { display: flex; gap: 5px; align-items: center; }
  .attempt-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #D0CEC9; background: transparent; transition: background 0.2s, border-color 0.2s; }
  .attempt-dot.used { background: var(--muted); border-color: var(--muted); }
  .check-btn {
    background: #111; color: #fff; border: none; border-radius: 10px;
    padding: 9px 20px; font-size: 14px; font-weight: 600;
    font-family: 'Noto Sans', sans-serif;
    cursor: pointer; transition: background 0.15s, transform 0.15s;
    display: flex; align-items: center; gap: 6px;
  }
  .check-btn:hover:not(:disabled) { background: #333; transform: translateY(-1px); }
  .check-btn:active:not(:disabled) { transform: scale(0.97); }
  .check-btn:disabled { opacity: 0.4; cursor: default; transform: none; }
  .check-btn.success { background: var(--green); }
  .check-btn.partial { background: var(--yellow); }
  .check-btn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }



  @media (max-width: 600px) {
    body { padding: 4.5rem 1rem 2rem; }
    .task-content { padding: 14px; }
    .task-footer  { padding: 12px 14px; }
    .task-header  { padding: 16px 14px 12px; }
    .chip { font-size: 11px; padding: 4px 9px; }
    .slot { min-width: 72px; }
  }
</style>
</head>
<body>

<header>
  <div class="sitename">
    <a href="lektionsuebersicht.html">Latein*</a>
    <span class="sep">›</span>
    <a href="lektion01.html" class="sub">Lektion 1</a>
    <span class="sep2">›</span>
    <span class="sub2">Wer ist wer? (3)</span>
  </div>
  <div class="topbar">
    <button class="icon-btn bell-btn" title="Benachrichtigungen" onclick="handleBell()">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

        </button>
        <button class="dropdown-item" onclick="closeDropdown()">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Einstellungen
        </button>

          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Abmelden
        </button>
      </div>
    </div>
  </div>
</header>

<div class="page-wrap">
  <div class="task-card">

    <div class="task-header">
      <div class="task-title">Wer ist wer? (3)</div>
      <div class="task-instruction">Ergänze die Sätze sinnvoll. Achte auf die Formen.</div>
    </div>

    <div class="task-content">
      <!-- Chip pool -->
      <div class="chip-pool" id="chipPool"></div>

      <!-- Sentence rows built by JS -->
      <div id="sentenceList"></div>
    </div>

    <div class="feedback" id="feedback">
      <svg id="feedbackIcon" viewBox="0 0 24 24"></svg>
      <span id="feedbackText"></span>
    </div>

    <div class="task-footer">
      <div class="attempts-wrap">
        <div class="attempt-dot" id="dot1"></div>
        <div class="attempt-dot" id="dot2"></div>
        <div class="attempt-dot" id="dot3"></div>
      </div>
      <button class="check-btn" id="checkBtn" onclick="checkAnswers()">Überprüfen</button>
    </div>

  </div>
</div>


<script>
  // ── Data ─────────────────────────────────────────────────────────────────
  // Each sentence: parts array — strings are static text, null marks a slot
  // answers[i] = correct chip text for slot i (in order of appearance)
  const sentences = [
    { parts: [null, 'filium exspectat.'],         german: 'Der Vater erwartet seinen Sohn.',   answer: 'Pater'  },
    { parts: [null, 'matrem quaerit.'],            german: 'Der Sohn sucht seine Mutter.',      answer: 'Filius' },
    { parts: ['Mater', null, 'vocat.'],            german: 'Die Mutter ruft ihren Sohn.',       answer: 'filium' },
    { parts: ['Filia', null, 'videt.'],            german: 'Die Tochter sieht ihren Vater.',    answer: 'patrem' },
    { parts: ['Filius', null, 'audit.'],           german: 'Der Sohn hört seine Mutter.',       answer: 'matrem' },
  ];

  // Pool chips — 8 total, 5 used, 3 left over
  const chipTexts = [
    'filia', 'filiam', 'mater', 'matrem',
    'filius', 'filium', 'pater', 'patrem',
    // capitalised forms needed as answers:
    'Pater', 'Filius',
  ];
  // We show the pool with the capitalised versions merged:
  // actual pool = the 8 listed in the task + their capitalised variants where needed
  // Since answers include 'Pater' and 'Filius' (sentence-initial), let's build:
  const poolChips = [
    'filia', 'filiam', 'mater', 'matrem',
    'filius', 'filium', 'pater', 'patrem',
    'Pater', 'Filius',
  ];
  // Answers in slot order (0-4):
  const answers = sentences.map(s => s.answer);
  const TOTAL   = sentences.length; // 5 slots

  const KEY  = 'task_l1_wer_ist_wer_3';
  const NEXT = 'mask-oder-fem-2.html';

  // ── State ─────────────────────────────────────────────────────────────────
  const slotState = new Array(TOTAL).fill(null); // chip text or null
  const slotUid   = new Array(TOTAL).fill(null); // chip uid
  let attempts = 0;
  let revealed = false;
  let locked   = false;
  let dragSource = null;

  const pool    = document.getElementById('chipPool');
  const slotEls = []; // indexed 0-4

  // ── Build sentences ───────────────────────────────────────────────────────
  const list = document.getElementById('sentenceList');
  sentences.forEach((s, si) => {
    const row = document.createElement('div');
    row.className = 'sentence-row';

    const latinDiv = document.createElement('div');
    latinDiv.className = 'sentence-latin';

    const num = document.createElement('span');
    num.className = 'sentence-num';
    num.textContent = (si + 1) + '.';
    latinDiv.appendChild(num);

    s.parts.forEach(part => {
      if (part === null) {
        // build slot
        const slot = document.createElement('span');
        slot.className = 'slot';
        slot.id = 'slot-' + si;
        slot.innerHTML = `
          <span class="slot-badge" id="badge-${si}"></span>
          <span class="slot-text" id="text-${si}" style="color:#C0BEB9">—</span>
          <div class="slot-popover" id="popover-${si}"></div>`;

        slot.addEventListener('dragover', e => {
          if (locked || !dragSource) return;
          e.preventDefault();
          slot.classList.add('drag-over');
        });
        slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
        slot.addEventListener('drop', e => {
          e.preventDefault();
          slot.classList.remove('drag-over');
          if (!dragSource || locked || revealed) return;
          dropOnSlot(si);
          dragSource = null;
        });
        slot.addEventListener('click', () => {
          if (revealed && slot.classList.contains('wrong')) {
            document.getElementById('popover-' + si).classList.toggle('show');
          } else if (!locked && slotState[si] !== null) {
            // return chip to pool on click when filled
            returnToPool(si);
          }
        });
        slot.draggable = true;
        slot.addEventListener('dragstart', e => {
          if (locked || slotState[si] === null) { e.preventDefault(); return; }
          dragSource = { type: 'slot', fromSlot: si, text: slotState[si], uid: slotUid[si] };
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', slotState[si]);
          slot.classList.add('dragging');
        });
        slot.addEventListener('dragend', () => { slot.classList.remove('dragging'); dragSource = null; });

        addTouchDrag(slot, null, si);
        slotEls.push(slot);
        latinDiv.appendChild(slot);
      } else {
        const span = document.createElement('span');
        span.textContent = part;
        latinDiv.appendChild(span);
      }
    });

    const germanDiv = document.createElement('div');
    germanDiv.className = 'sentence-german';
    germanDiv.textContent = s.german;

    row.appendChild(latinDiv);
    row.appendChild(germanDiv);
    list.appendChild(row);
  });

  // ── Build chip pool ───────────────────────────────────────────────────────
  const chipEls = {};
  poolChips.forEach((text, uid) => {
    const chip = makeChipEl(text, uid);
    pool.appendChild(chip);
    chipEls[uid] = chip;
  });

  function makeChipEl(text, uid) {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = text;
    chip.draggable = true;
    chip.dataset.text = text;
    chip.dataset.uid  = uid;
    chip.addEventListener('dragstart', e => {
      if (locked) { e.preventDefault(); return; }
      dragSource = { type: 'pool', text: text, uid: uid };
      chip.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', text);
    });
    chip.addEventListener('dragend', () => { chip.classList.remove('dragging'); dragSource = null; });
    chip.addEventListener('click', () => {
      if (locked) return;
      // click chip → place in first empty slot
      const emptySlot = slotState.findIndex(s => s === null);
      if (emptySlot === -1) return;
      dragSource = { type: 'pool', text: text, uid: uid };
      dropOnSlot(emptySlot);
      dragSource = null;
    });
    addTouchDrag(chip, uid, null);
    return chip;
  }

  // ── Slot operations ───────────────────────────────────────────────────────
  function dropOnSlot(slotIdx) {
    if (!dragSource) return;

    // If slot already filled, return its chip to pool first
    if (slotState[slotIdx] !== null) {
      const oldUid = slotUid[slotIdx];
      chipEls[oldUid].classList.remove('used');
    }

    if (dragSource.type === 'pool') {
      slotState[slotIdx] = dragSource.text;
      slotUid[slotIdx]   = dragSource.uid;
      chipEls[dragSource.uid].classList.add('used');
    } else if (dragSource.type === 'slot') {
      const fromIdx = dragSource.fromSlot;
      slotState[slotIdx] = dragSource.text;
      slotUid[slotIdx]   = dragSource.uid;
      slotState[fromIdx] = null;
      slotUid[fromIdx]   = null;
      renderSlot(fromIdx);
    }
    renderSlot(slotIdx);
  }

  function returnToPool(slotIdx) {
    const uid = slotUid[slotIdx];
    chipEls[uid].classList.remove('used');
    slotState[slotIdx] = null;
    slotUid[slotIdx]   = null;
    renderSlot(slotIdx);
  }

  function renderSlot(idx) {
    const slot    = slotEls[idx];
    const textEl  = document.getElementById('text-' + idx);
    const val     = slotState[idx];
    if (val) {
      slot.classList.add('filled');
      textEl.textContent = val;
      textEl.style.color = '';
    } else {
      slot.classList.remove('filled');
      textEl.textContent = '—';
      textEl.style.color = '#C0BEB9';
    }
  }

  function removeChipFromPool(uid) {
    if (chipEls[uid]) chipEls[uid].classList.add('used');
  }

  // ── Touch drag support ────────────────────────────────────────────────────
  function addTouchDrag(el, chipUid, slotIdx) {
    let ghost = null;
    el.addEventListener('touchstart', e => {
      if (locked) return;
      const touch = e.touches[0];
      if (chipUid !== null) {
        dragSource = { type: 'pool', text: el.dataset.text, uid: chipUid };
      } else if (slotIdx !== null && slotState[slotIdx] !== null) {
        dragSource = { type: 'slot', fromSlot: slotIdx, text: slotState[slotIdx], uid: slotUid[slotIdx] };
      } else return;
      ghost = el.cloneNode(true);
      ghost.style.cssText = `position:fixed;opacity:0.7;pointer-events:none;z-index:9999;font-size:13px;font-style:italic;font-weight:600;padding:6px 14px;background:#fff;border:1.5px solid #ccc;border-radius:6px;`;
      ghost.style.left = (touch.clientX - 40) + 'px';
      ghost.style.top  = (touch.clientY - 20) + 'px';
      document.body.appendChild(ghost);
      e.preventDefault();
    }, { passive: false });

    el.addEventListener('touchmove', e => {
      if (!ghost) return;
      const touch = e.touches[0];
      ghost.style.left = (touch.clientX - 40) + 'px';
      ghost.style.top  = (touch.clientY - 20) + 'px';
      e.preventDefault();
    }, { passive: false });

    el.addEventListener('touchend', e => {
      if (!ghost || !dragSource) return;
      const touch = e.changedTouches[0];
      ghost.remove(); ghost = null;
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      const slotEl = target ? target.closest('.slot') : null;
      if (slotEl) {
        const id = parseInt(slotEl.id.replace('slot-', ''));
        if (!isNaN(id)) { dropOnSlot(id); }
      }
      dragSource = null;
    }, { passive: false });
  }

  // ── Check ─────────────────────────────────────────────────────────────────
  function checkAnswers() {
    if (revealed) return;
    const allFilled = slotState.every(s => s !== null);
    if (!allFilled) { showFeedback('warn', 'Fülle zuerst alle Felder aus!'); return; }

    attempts++;
    document.getElementById('dot' + attempts).classList.add('used');

    const allCorrect = slotState.every((text, i) => text === answers[i]);

    if (allCorrect) {
      revealAll();
      showFeedback('ok', 'Ausgezeichnet! Alle Sätze richtig ergänzt!');
      winState();
      return;
    }
    if (attempts < 3) {
      showFeedback('warn', 'Das ist noch nicht richtig. Versuche es nochmal!');
      return;
    }

    // 3rd failed attempt
    revealed = true;
    showBadges();
    showFeedback('warn', 'Klicke auf die gelb umrandeten Felder um die richtige Lösung zu sehen.');
    saveState(false);
    lockAll();
    const btn = document.getElementById('checkBtn');
    btn.classList.add('partial');
    btn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
    btn.disabled = false;
    btn.onclick = () => window.location.href = NEXT;
  }

  function showBadges() {
    slotState.forEach((text, i) => {
      const correct = text === answers[i];
      slotEls[i].classList.add(correct ? 'correct' : 'wrong');
      const badge = document.getElementById('badge-' + i);
      badge.classList.add('show', correct ? 'ok' : 'fail');
      badge.innerHTML = correct
        ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
        : '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>';
      if (!correct) document.getElementById('popover-' + i).textContent = answers[i];
    });
  }

  function revealAll() {
    slotEls.forEach((slot, i) => {
      slot.classList.add('correct');
      const badge = document.getElementById('badge-' + i);
      badge.classList.add('show', 'ok');
      badge.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
    });
  }

  function winState() {
    lockAll(); revealed = true; saveState(true);
    const btn = document.getElementById('checkBtn');
    btn.classList.add('success');
    btn.innerHTML = 'Weiter <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
    btn.onclick = () => window.location.href = NEXT;
    btn.disabled = false;
  }

  function lockAll() {
    locked = true;
    document.querySelectorAll('.chip').forEach(c => { c.draggable = false; c.style.cursor = 'default'; });
    slotEls.forEach(s => { s.draggable = false; });
  }

  function lsGet(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }
  function lsSet(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }
  function lsRemove(key) { try { localStorage.removeItem(key); } catch(e) {} }

  function saveState(done) {
    const correct = slotState.filter((t, i) => t === answers[i]).length;
    const points  = +(correct * 0.5).toFixed(2);
    const slotData = slotState.map((text, i) => ({
      filled: text || '',
      correct: text === answers[i],
      uid: slotUid[i]
    }));
    lsSet(KEY,               done ? 'done' : 'attempted');
    lsSet(KEY + '_slots',    JSON.stringify(slotData));
    lsSet(KEY + '_attempts', attempts);
    lsSet(KEY + '_points',   points);
    lsSet(KEY + '_date',     new Date().toLocaleDateString('de-DE'));
    if (!done) lsSet(KEY + '_fail', 'true');
  }

  function showFeedback(type, text) {
    const fb   = document.getElementById('feedback');
    const icon = document.getElementById('feedbackIcon');
    fb.className = 'feedback show ' + type;
    icon.innerHTML = type === 'ok'
      ? '<polyline points="20 6 9 17 4 12"/>'
      : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
    document.getElementById('feedbackText').textContent = text;
  }



  // ── Restore saved state ───────────────────────────────────────────────────
  (function restoreState() {
    const savedSlots    = lsGet(KEY + '_slots');
    const savedDone     = lsGet(KEY) === 'done';
    const savedFail     = lsGet(KEY + '_fail') === 'true';
    const savedAttempts = parseInt(lsGet(KEY + '_attempts') || '0');
    if (!savedSlots || (!savedDone && !savedFail)) return;

    const slotData = JSON.parse(savedSlots);
    slotData.forEach((s, i) => {
      if (!s.filled) return;
      slotState[i] = s.filled;
      slotUid[i]   = s.uid;
      renderSlot(i);
      removeChipFromPool(s.uid);
    });
    for (let i = 1; i <= savedAttempts; i++) {
      const d = document.getElementById('dot' + i);
      if (d) d.classList.add('used');
    }
    slotData.forEach((s, i) => {
      slotEls[i].classList.add(s.correct ? 'correct' : 'wrong');
      const badge = document.getElementById('badge-' + i);
      badge.classList.add('show', s.correct ? 'ok' : 'fail');
      badge.innerHTML = s.correct
        ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
        : '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>';
      if (!s.correct) document.getElementById('popover-' + i).textContent = answers[i];
    });
    revealed = true; attempts = savedAttempts; lockAll();
    const btn = document.getElementById('checkBtn');
    if (savedDone) {
      btn.classList.add('success');
      btn.innerHTML = 'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
      btn.onclick = () => window.location.href = NEXT;
      btn.disabled = false;
      showFeedback('ok', 'Ausgezeichnet! Alle Sätze richtig ergänzt!');
    } else {
      btn.classList.add('partial');
      btn.innerHTML = 'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
      btn.onclick = () => window.location.href = NEXT;
      btn.disabled = false;
      showFeedback('warn', 'Klicke auf die gelb umrandeten Felder um die richtige Lösung zu sehen.');
    }
  })();

  // ── Bell & dropdown ───────────────────────────────────────────────────────
  function handleBell()     { alert('Keine neuen Benachrichtigungen.'); }
  function toggleDropdown() { document.getElementById('dropdown').classList.toggle('open'); }
  function closeDropdown()  { document.getElementById('dropdown').classList.remove('open'); }
  document.addEventListener('click', e => {
    if (!document.querySelector('.user-wrap').contains(e.target)) closeDropdown();
  });
</script>
</body>
