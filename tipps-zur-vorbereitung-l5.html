<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tipps zur Vorbereitung</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Lora:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scrollbar-gutter: stable;
      }

      :root {
        --bg: #f8f8f6;
        --white: #ffffff;
        --border: #e6e4df;
        --text: #111111;
        --muted: #898783;
        --accent: #c6613f;
        --blue: #3b6fe0;
        --radius: 14px;
      }

      body {
        font-family: "Noto Sans", sans-serif;
        background: var(--bg);
        min-height: 100vh;
        padding: 5rem 1.5rem 3rem;
        color: var(--text);
      }

      /* ── Header ── */
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        background: var(--white);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
        z-index: 100;
      }

      .sitename {
        font-size: 19px;
        font-weight: 700;
        color: #111111;
        font-family: "Lora", serif;
        letter-spacing: -0.4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sitename a {
        color: inherit;
        text-decoration: none;
      }
      .sitename .sep {
        color: #cccccc;
        font-family: "Noto Sans", sans-serif;
        font-weight: 400;
        font-size: 17px;
      }
      .sitename .sep2 {
        color: #cccccc;
        font-family: "Noto Sans", sans-serif;
        font-weight: 400;
        font-size: 17px;
      }
      .sitename .sub {
        font-size: 12px;
        font-weight: 600;
        color: #555555;
        font-family: "Noto Sans", sans-serif;
        letter-spacing: 0;
      }
      .sitename .sub2 {
        font-size: 12px;
        font-weight: 600;
        color: #555555;
        font-family: "Noto Sans", sans-serif;
        letter-spacing: 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s;
        position: relative;
        outline: none;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        transform: scale(1.08);
      }
      .icon-btn:active {
        transform: scale(0.94);
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .bell-btn svg {
        stroke: #898783;
      }
      .bell-btn .dot {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 7px;
        height: 7px;
        background: #cc3300;
        border-radius: 50%;
        border: 1.5px solid var(--white);
      }
      @keyframes ring {
        0%,
        100% {
          transform: rotate(0);
        }
        15% {
          transform: rotate(14deg);
        }
        30% {
          transform: rotate(-12deg);
        }
        45% {
          transform: rotate(8deg);
        }
        60% {
          transform: rotate(-5deg);
        }
        75% {
          transform: rotate(3deg);
        }
      }
      .bell-btn:hover svg {
        animation: ring 0.55s ease;
        transform-origin: 50% 3px;
      }
      .user-btn svg {
        stroke: #898783;
      }
      .user-wrap {
        position: relative;
      }

      .dropdown {
        display: none;
        position: absolute;
        top: 44px;
        right: 0;
        background: var(--white);
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        min-width: 190px;
        overflow: hidden;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.1);
      }
      .dropdown.open {
        display: block;
        animation: dropIn 0.15s ease;
      }
      @keyframes dropIn {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .dropdown-header {
        padding: 13px 16px 9px;
        border-bottom: 1px solid #e8e8e8;
        background: #f9f9f9;
      }
      .dropdown-name {
        font-size: 14px;
        font-weight: 600;
        color: #111;
      }
      .dropdown-email {
        font-size: 12px;
        color: #888;
        margin-top: 2px;
      }
      .dropdown-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        font-size: 14px;
        color: #111;
        cursor: pointer;
        border: none;
        background: none;
        width: 100%;
        font-family: "Noto Sans", sans-serif;
        transition: background 0.12s;
        text-align: left;
      }
      .dropdown-item:hover {
        background: #f4f4f4;
      }
      .dropdown-item svg {
        width: 15px;
        height: 15px;
        stroke: #555;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .dropdown-sep-line {
        height: 1px;
        background: #e8e8e8;
      }
      .dropdown-item.danger {
        color: #cc3300;
      }
      .dropdown-item.danger svg {
        stroke: #cc3300;
      }

      /* ── Page layout ── */
      .page-wrap {
        max-width: 780px;
        margin: 0 auto;
      }

      /* ── Task card ── */
      .task-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .task-header {
        padding: 20px 22px 16px;
        border-bottom: 1px solid var(--border);
      }

      .task-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 6px;
        font-family: "Lora", serif;
      }

      .task-instruction {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.6;
      }

      /* ── Task content ── */
      .task-content {
        padding: 22px 22px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* ── Checklist items ── */
      .check-item {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 16px 18px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #fafaf9;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
        user-select: none;
      }
      .check-item:hover {
        background: #f3f2ef;
        border-color: #d0cec9;
      }
      .check-item.checked {
        background: #eef3fc;
        border-color: #b8ccf4;
      }

      .circle-check {
        flex-shrink: 0;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid #c8c5bf;
        background: var(--white);
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.2s,
          border-color 0.2s;
        margin-top: 1px;
      }
      .check-item.checked .circle-check {
        background: var(--blue);
        border-color: var(--blue);
      }
      .circle-check svg {
        width: 13px;
        height: 13px;
        stroke: var(--white);
        fill: none;
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
        transform: scale(0.6);
        transition:
          opacity 0.18s,
          transform 0.18s;
      }
      .check-item.checked .circle-check svg {
        opacity: 1;
        transform: scale(1);
      }

      .check-label {
        font-size: 14px;
        line-height: 1.55;
        color: var(--text);
        padding-top: 3px;
      }
      .check-label .tag {
        display: inline-block;
        margin-left: 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        background: #eeecea;
        border-radius: 5px;
        padding: 1px 6px;
        vertical-align: middle;
        position: relative;
        top: -1px;
      }
      .check-item.checked .check-label {
        color: #3b6fe0;
      }

      /* ── Task footer ── */
      .task-footer {
        padding: 16px 22px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 16px;
      }

      .attempts-wrap {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .attempt-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e0ded9;
        transition: background 0.2s;
      }
      .attempt-dot.used {
        background: #898783;
      }

      .check-btn {
        padding: 9px 20px;
        border-radius: 10px;
        border: none;
        background: #111;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        font-family: "Noto Sans", sans-serif;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.12s;
      }
      .check-btn:hover {
        background: #333;
        transform: translateY(-1px);
      }
      .check-btn:active {
        transform: scale(0.97);
      }
      .check-btn.success {
        background: #4caf50;
      }

      /* ── Result feedback ── */
      .feedback {
        display: none;
        margin: 0 22px 16px;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        align-items: center;
        gap: 8px;
      }
      .feedback.show {
        display: flex;
      }
      .feedback.ok {
        background: #edf7ed;
        color: #2e7d32;
        border: 1px solid #c8e6c9;
      }
      .feedback.err {
        background: #fef3f0;
        color: #b84a2e;
        border: 1px solid #f5c5b8;
      }
      .feedback svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      @media (max-width: 500px) {
        body {
          padding: 4.5rem 1rem 2rem;
        }
        .task-content {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="sitename">
        <a href="lektionsuebersicht.html">Latein*</a>
        <span class="sep">›</span>
        <a href="lektion05.html" class="sub">Lektion 5</a>
        <span class="sep2">›</span>
        <span class="sub2">Tipps zur Vorbereitung</span>
      </div>
      <div class="topbar">
        <button
          class="icon-btn bell-btn"
          title="Benachrichtigungen"
          onclick="handleBell()"
        >
          <svg viewBox="0 0 24 24">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span class="dot" id="bellDot"></span>
        </button>
        <div class="user-wrap">
          <button
            class="icon-btn user-btn"
            title="Benutzerprofil"
            onclick="toggleDropdown()"
          >
            <svg viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </button>
          <div class="dropdown" id="dropdown">
            <div class="dropdown-header">
              <div class="dropdown-name">Max Mustermann</div>
              <div class="dropdown-email">max@beispiel.de</div>
            </div>
            <button class="dropdown-item" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              Profil
            </button>
            <button class="dropdown-item" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                />
              </svg>
              Einstellungen
            </button>
            <div class="dropdown-sep-line"></div>
            <button class="dropdown-item danger" onclick="closeDropdown()">
              <svg viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Abmelden
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="page-wrap">
      <div class="task-card">
        <div class="task-header">
          <div class="task-title">Tipps zur Vorbereitung</div>
          <div class="task-instruction">
            Folgendes kannst du dir noch einmal im Begleitbuch ansehen:
          </div>
        </div>

        <div class="task-content" id="checkList">
          <div class="check-item" id="item1" onclick="toggleItem(1)">
            <div class="circle-check">
              <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </div>
            <div class="check-label">
              das Prädikatsnomen
              <span class="tag">G2</span>
            </div>
          </div>

          <div class="check-item" id="item2" onclick="toggleItem(2)">
            <div class="circle-check">
              <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </div>
            <div class="check-label">
              die Formen der Substantive im Nominativ und Akkusativ
              <span class="tag">G9</span>
            </div>
          </div>
        </div>

        <div class="feedback" id="feedback">
          <svg id="feedbackIcon" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          <span id="feedbackText"></span>
        </div>

        <div class="task-footer">
          <div class="attempts-wrap">
            <div class="attempt-dot" id="dot1"></div>
            <div class="attempt-dot" id="dot2"></div>
            <div class="attempt-dot" id="dot3"></div>
          </div>
          <button class="check-btn" id="checkBtn">Weiter</button>
        </div>
      </div>
    </div>

    <script>
      const TOTAL = 2;
      const KEY = "task_l05_tipps_vorbereitung";
      const NEXT = "ponticulus-4a.html";
      let attempts = 0;
      let done = false;
      const checked = new Set();

      const checkBtn = document.getElementById("checkBtn");
      const feedback = document.getElementById("feedback");
      const feedbackText = document.getElementById("feedbackText");
      const feedbackIcon = document.getElementById("feedbackIcon");

      function goNext() {
        window.location.href = NEXT;
      }

      function setWeiter() {
        checkBtn.classList.add("success");
        checkBtn.innerHTML =
          'Weiter <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:4px;"><polyline points="9 18 15 12 9 6"/></svg>';
        checkBtn.removeEventListener("click", handleClick);
        checkBtn.addEventListener("click", goNext);
      }

      function toggleItem(n) {
        if (done) return;
        const el = document.getElementById("item" + n);
        if (checked.has(n)) {
          checked.delete(n);
          el.classList.remove("checked");
        } else {
          checked.add(n);
          el.classList.add("checked");
        }
      }

      function showFeedback(type, text) {
        feedback.className = "feedback show " + type;
        feedbackText.textContent = text;
        feedbackIcon.innerHTML =
          type === "ok"
            ? '<polyline points="20 6 9 17 4 12"/>'
            : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
      }

      function handleClick() {
        if (done) return;
        attempts++;
        const dotEl = document.getElementById("dot" + attempts);

        if (checked.size === TOTAL) {
          done = true;
          if (dotEl) dotEl.classList.add("used");
          showFeedback(
            "ok",
            "Sehr gut! Du hast die Grammatiktexte gelesen und erhältst 1 Punkt.",
          );
          localStorage.setItem(KEY, "done");
          localStorage.setItem(
            KEY + "_date",
            new Date().toLocaleDateString("de-DE"),
          );
          localStorage.setItem(KEY + "_attempts", attempts);
          localStorage.setItem(KEY + "_points", 1);
          setWeiter();
        } else {
          if (dotEl) dotEl.classList.add("used");
          const missing = TOTAL - checked.size;
          const msg =
            missing === TOTAL
              ? "Bitte hake alle Punkte ab, bevor du weitermachst."
              : `Fast! Noch ${missing} ${missing === 1 ? "Punkt" : "Punkte"} zum Abhaken – schau alles noch einmal durch.`;
          showFeedback("err", msg);
          if (attempts >= 3) {
            showFeedback(
              "err",
              "Du kannst die Aufgabe trotzdem überspringen und weitermachen.",
            );
            setWeiter();
          }
        }
      }

      checkBtn.addEventListener("click", handleClick);

      // Restore state if already completed
      if (localStorage.getItem(KEY) === "done") {
        done = true;
        for (let i = 1; i <= TOTAL; i++) {
          checked.add(i);
          document.getElementById("item" + i).classList.add("checked");
          document.getElementById("item" + i).style.pointerEvents = "none";
        }
        showFeedback(
          "ok",
          "Sehr gut! Du hast die Grammatiktexte gelesen und erhältst 1 Punkt.",
        );
        const savedAttempts = parseInt(
          localStorage.getItem(KEY + "_attempts") || "1",
        );
        for (let i = 1; i <= savedAttempts; i++) {
          const d = document.getElementById("dot" + i);
          if (d) d.classList.add("used");
        }
        setWeiter();
      }

      function handleBell() {
        alert("Keine neuen Benachrichtigungen.");
      }
      function toggleDropdown() {
        document.getElementById("dropdown").classList.toggle("open");
      }
      function closeDropdown() {
        document.getElementById("dropdown").classList.remove("open");
      }
      document.addEventListener("click", (e) => {
        if (!document.querySelector(".user-wrap").contains(e.target))
          closeDropdown();
      });
    </script>
  </body>
</html>
